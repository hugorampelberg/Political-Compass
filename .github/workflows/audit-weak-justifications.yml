name: Audit weak justifications
on:
  push:
    paths:
      - '.github/workflows/audit-weak-justifications.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build weak justification report
        run: |
          cat > /tmp/audit.js <<'NODE'
          const fs=require('fs'), vm=require('vm');
          function load(path,name){
            const src=fs.readFileSync(path,'utf8')+`\nthis.__OUT__=${name};`;
            const ctx={}; vm.createContext(ctx); vm.runInContext(src,ctx); return ctx.__OUT__;
          }
          const qd=load('data/questionnaire.js','QUESTIONNAIRE_DATA');
          const parties=load('data/parties.js','PARTIES_DATA');
          const govs=load('data/governments.js','GOVERNMENTS_DATA');
          const qs=qd.questions;
          const phrases=[
            /niveau de confiance documentaire/i,
            /sources officielles et prises de position convergentes/i,
            /orientation cohérente avec le document officiel retenu/i,
            /sans passage isolé directement équivalent/i,
            /position cohérente avec le document officiel retenu/i,
            /documentation disponible/i,
            /sources retenues/i,
            /source retenue/i,
            /orientation générale/i,
            /cohérent(?:e)? avec (?:la|le|les) (?:ligne|programme|document)/i,
            /faute de (?:prise de position|position|source|passage) (?:plus )?précis/i,
            /aucune prise de position suffisamment précise/i,
            /pas de position suffisamment précise/i,
            /pas de passage explicite/i,
            /ne permet pas d'établir/i,
            /prudence documentaire/i,
            /par prudence/i,
            /inférence/i,
            /codage/i,
            /réévalué/i
          ];
          const rows=[];
          const entities=[...parties,...govs];
          for(const e of entities){
            for(let i=0;i<qs.length;i++){
              const j=String(e.justifications?.[i]||'').trim();
              const hits=phrases.filter(r=>r.test(j)).map(r=>r.source);
              const weak = !j || hits.length>0 || j.length<85;
              if(weak) rows.push({category:e.category,id:e.id,name:e.name,qid:qs[i].id,theme:qs[i].theme,question:qs[i].text,score:e.responses?.[i],confidence:e.confidence?.[i],source:e.sources?.[i]||'',justification:j,hits:hits.join('|'),length:j.length});
            }
          }
          rows.sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name)||a.qid-b.qid);
          const esc=s=>String(s??'').replace(/\t/g,' ').replace(/\r?\n/g,' ');
          const head=['category','id','name','qid','theme','question','score','confidence','source','justification','hits','length'];
          fs.mkdirSync('audit',{recursive:true});
          fs.writeFileSync('audit/weak-justifications.tsv',head.join('\t')+'\n'+rows.map(r=>head.map(k=>esc(r[k])).join('\t')).join('\n')+'\n');
          const byEntity={}; for(const r of rows) byEntity[r.name]=(byEntity[r.name]||0)+1;
          const summary={questionCount:qs.length,entityCount:entities.length,weakCount:rows.length,byEntity};
          fs.writeFileSync('audit/weak-justifications-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(summary);
          NODE
          node /tmp/audit.js
      - name: Commit report and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/weak-justifications.tsv audit/weak-justifications-summary.json
          git rm .github/workflows/audit-weak-justifications.yml
          git commit -m 'Generate weak justification audit report'
          git push
