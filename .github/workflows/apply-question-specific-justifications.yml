            51:['lier fortement certaines prestations sociales à l’activité, aux cotisations ou à la durée de participation au marché du travail','maintenir des prestations largement fondées sur les besoins ou l’universalité plutôt que sur une longue durée de cotisation ou de travail'],
            53:['conditionner les aides publiques importantes aux entreprises à des limites sur les dividendes et rémunérations de dirigeants','éviter d’imposer des restrictions générales sur les dividendes ou rémunérations en contrepartie des aides publiques'],
            54:['utiliser activement les participations publiques pour fixer des orientations industrielles de long terme aux grandes entreprises','laisser davantage les entreprises, y compris celles où l’État est actionnaire, déterminer leur stratégie selon une gouvernance commerciale'],
