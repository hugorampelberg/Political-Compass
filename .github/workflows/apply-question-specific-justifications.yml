            45:['maintenir une imposition française sur le patrimoine mondial des très grandes fortunes même après leur départ de France','refuser une imposition durable du patrimoine mondial après expatriation et privilégier le principe de résidence fiscale'],
            46:['réduire significativement les allocations d’un chômeur qui refuse plusieurs offres raisonnables et adaptées','protéger davantage la continuité de l’indemnisation et limiter les sanctions financières liées au refus d’offres'],
            47:['mobiliser durablement l’argent public pour rapprocher les prix des produits essentiels outre-mer de ceux de l’Hexagone','privilégier la concurrence, la production locale ou des aides plus ciblées plutôt qu’une garantie publique durable d’alignement des prix'],
            48:['assouplir la protection du CDI afin de faciliter les embauches, les mobilités et les ruptures de contrats','préserver une protection forte du CDI et considérer qu’elle reste un élément essentiel de sécurité pour les salariés'],
