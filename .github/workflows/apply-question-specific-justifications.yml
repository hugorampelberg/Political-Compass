            61:['considérer que des pratiques culturelles ou religieuses très différentes ne posent pas en elles-mêmes problème tant que la loi est respectée','attendre une assimilation culturelle plus forte que le seul respect des lois communes'],
            63:['autoriser une surveillance préventive ciblée d’une personne présentant un risque terroriste sérieux avant qu’existent les preuves nécessaires à des poursuites','exiger des garanties judiciaires et factuelles plus fortes avant d’autoriser une surveillance intrusive'],
            64:['protéger largement les propos offensants par la liberté d’expression tant qu’ils ne constituent ni menace, ni appel à la violence, ni infraction','accepter des restrictions plus larges aux propos profondément offensants afin de protéger la dignité, l’ordre public ou certains groupes'],
