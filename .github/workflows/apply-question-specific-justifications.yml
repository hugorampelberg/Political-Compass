            42:['permettre une désobéissance ciblée aux règles européennes lorsqu’elles empêchent une politique jugée essentielle pour l’intérêt national','respecter la primauté et les engagements du droit européen même lorsqu’ils contraignent une politique économique nationale'],
            43:['supprimer l’IFI ou, plus largement, réduire la taxation spécifique du patrimoine immobilier','maintenir ou renforcer une taxation spécifique des patrimoines immobiliers élevés'],
