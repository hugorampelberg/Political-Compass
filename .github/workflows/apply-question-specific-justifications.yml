name: Apply question-specific justifications
on:
  push:
    paths: ['.github/workflows/apply-question-specific-justifications.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Replace generic justifications with question-specific explanations
        run: |
          cat > /tmp/fix.js <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          function loadText(text,name){const c={};vm.createContext(c);vm.runInContext(text+`\nthis.__out=${name};`,c);return c.__out;}
          function load(path,name){return loadText(fs.readFileSync(path,'utf8'),name)}
          function old(path,name){return loadText(cp.execFileSync('git',['show','0005b2fd72947fcd8bb08b2ba0b568c6e01f672b:'+path],{encoding:'utf8',maxBuffer:50e6}),name)}
          const qd=load('data/questionnaire.js','QUESTIONNAIRE_DATA'), qs=qd.questions;
          const parties=load('data/parties.js','PARTIES_DATA'), govs=load('data/governments.js','GOVERNMENTS_DATA');
          const oldParties=old('data/parties.js','PARTIES_DATA'), oldGovs=old('data/governments.js','GOVERNMENTS_DATA');
          const qIndex=new Map(qs.map((q,i)=>[q.id,i]));
          const BAD=/Pour [^,]+, sur Q\d+|Position directement documentée\.?$|Position peu explicite ou comparaison institutionnelle limitée|Comparabilité limitée ou position peu explicite|orientation cohérente|niveau de confiance|codage|niveau de preuve|preuve primaire|estimation prudente|sources officielles et prises de position convergentes|sans passage isolé|formulation parfaitement équivalente|Le programme combine baisse de l’impôt|L’accord CDU\/CSU–SPD combine|La coalition est socialement|La ligne gouvernementale|Le gouvernement veut réduire l’immigration|Le programme 2026 des Écologistes|La convention économique 2025 de Renaissance|LFI veut partager davantage|LFI veut soustraire plusieurs|Le PCF défend|Le Projet socialiste 2026|Les Écologistes veulent|Reconquête veut|Nouvelle Énergie veut|Horizons veut|Le MoDem|L’UDR|Le RN|La France Humaniste/i;
          const OLD_BAD=/orientation cohérente|niveau de confiance|codage|niveau de preuve|preuve primaire|estimation prudente|sources officielles et prises de position convergentes|sans passage isolé|formulation parfaitement équivalente|Transposition ou inférence prudente|Position de compromis|Position directement documentée\.?$|Position peu explicite/i;
          const label={3:'Accord très fort',2:'Accord net',1:'Accord modéré',0:'Position intermédiaire',[-1]:'Désaccord modéré',[-2]:'Désaccord net',[-3]:'Désaccord très fort'};
          const POLICY={
            1:['réduire les prélèvements sur le travail et le capital, en acceptant des économies de dépenses pour financer ces baisses','préserver les recettes et les dépenses publiques plutôt que financer des baisses d’impôts par des réductions de politiques publiques'],
            2:['considérer que des écarts de revenus peuvent être légitimes lorsqu’ils récompensent le travail, le mérite, l’initiative ou la prise de risque','faire de la réduction des inégalités un objectif prioritaire, sans considérer le mérite ou la prise de risque comme une justification suffisante des écarts économiques'],
            3:['augmenter la contribution des hauts revenus et des gros patrimoines afin de réduire les écarts de richesse','éviter une hausse générale de la fiscalité sur les hauts revenus et les patrimoines et privilégier d’autres leviers que la redistribution fiscale'],
            4:['imposer un écart maximal entre la rémunération des dirigeants et les plus bas salaires de leur entreprise','laisser la rémunération des dirigeants relever de la gouvernance des entreprises plutôt que d’un ratio légal avec les plus bas salaires'],
            5:['relever sensiblement le salaire minimum par une décision publique ou conventionnelle de portée générale','éviter une forte hausse imposée du salaire minimum, notamment pour préserver le coût du travail et l’emploi'],
            6:['faire davantage confiance aux opérateurs privés et à la concurrence pour fournir efficacement des biens et services, y compris dans certains secteurs essentiels','maintenir une place centrale aux opérateurs et services publics dans les secteurs essentiels plutôt que présumer une efficacité supérieure du privé'],
            7:['permettre une prise de contrôle publique d’une entreprise lorsque son activité est stratégique pour la souveraineté du pays','préserver en principe la propriété privée des entreprises stratégiques et recourir à la réglementation, aux participations minoritaires ou aux contrats plutôt qu’à la nationalisation'],
            8:['privilégier la concurrence et l’ouverture des marchés comme moteurs de prix plus bas, de qualité et d’innovation','privilégier l’encadrement public, les normes et la régulation lorsque la concurrence seule ne garantit pas les objectifs économiques ou sociaux'],
            9:['réduire les dépenses et accepter des économies sur certaines politiques sociales pour rétablir durablement les comptes publics','préserver les principales politiques sociales même si le retour à l’équilibre exige davantage de recettes ou un ajustement budgétaire plus lent'],
            10:['maintenir un niveau élevé de protection sociale financé collectivement, même au prix de prélèvements importants','réduire le poids fiscal ou cibler davantage la protection sociale plutôt que maintenir un haut niveau universel de prestations financé par une fiscalité importante'],
            12:['utiliser plus fortement l’intervention publique, les prix réglementés, les subventions ou les obligations lorsque le marché produit des résultats jugés injustes','limiter l’intervention économique directe de l’État et privilégier les mécanismes de marché même lorsque leurs résultats sont socialement contestés'],
            13:['laisser davantage de choix individuel dans l’usage de l’argent consacré à la retraite, la santé ou la protection sociale','conserver des systèmes collectifs obligatoires afin de mutualiser les risques et de garantir une protection commune'],
            14:['accepter largement la diversité des modes de vie lorsque ceux-ci respectent la loi et les droits d’autrui','accorder davantage de poids aux normes sociales et culturelles traditionnelles dans l’organisation de la vie collective'],
            15:['permettre à l’exécutif de faire entrer un budget en vigueur sans vote parlementaire lorsqu’aucune majorité stable ne se dégage','maintenir l’exigence d’un vote du Parlement sur le budget même en situation de blocage politique'],
            16:['admettre que certaines politiques de réduction des inégalités puissent limiter des choix ou libertés individuelles','faire primer les libertés individuelles et refuser qu’un objectif d’égalité suffise à justifier des restrictions générales'],
            17:['utiliser activement les politiques publiques pour corriger des discriminations structurelles ou historiques entre groupes','privilégier l’égalité formelle et les politiques universelles plutôt que des dispositifs explicitement correcteurs entre groupes'],
            18:['accorder aux régions ou collectivités un véritable pouvoir normatif leur permettant d’adopter des règles économiques, sociales ou environnementales différentes','préserver l’uniformité des principales règles nationales et limiter les différences territoriales à leur mise en œuvre'],
            19:['préserver certaines traditions, références et valeurs culturelles même lorsqu’elles évoluent plus lentement que les mœurs','faire davantage primer l’évolution des libertés et des normes sociales sur la conservation de traditions particulières'],
            20:['réduire globalement le nombre d’entrées migratoires et renforcer le pilotage quantitatif des flux','ne pas faire de la réduction du volume global de l’immigration un objectif prioritaire'],
            21:['considérer l’immigration de travail comme un apport économique utile lorsqu’elle répond aux besoins de l’économie','mettre davantage l’accent sur les coûts, tensions ou effets distributifs de l’immigration économique que sur son apport global'],
            22:['garantir aux étrangers durablement et légalement installés un accès aux prestations et au logement social sans préférence permanente liée à la nationalité','maintenir une priorité nationale ou des restrictions durables d’accès à certaines prestations pour les étrangers même régulièrement installés'],
            23:['durcir les conditions d’accès à la nationalité, par la durée de résidence, la langue, l’intégration ou d’autres critères','préserver ou faciliter les voies actuelles d’accès à la nationalité plutôt que les rendre globalement plus exigeantes'],
            24:['faciliter et accélérer l’expulsion des étrangers condamnés pour des infractions graves','conserver des garanties fortes contre l’expulsion et refuser d’en faire une conséquence beaucoup plus systématique des condamnations graves'],
            25:['admettre que la cohésion culturelle puisse justifier de limiter l’immigration même lorsque celle-ci présente un intérêt économique','refuser d’utiliser la préservation d’une culture majoritaire comme motif autonome de limitation d’une immigration économiquement utile'],
            26:['accroître l’accueil de personnes fuyant la guerre ou les persécutions même lorsque cet accueil entraîne un coût budgétaire','limiter les admissions de réfugiés et donner davantage de poids aux capacités d’accueil et au coût économique'],
            27:['durcir les peines de prison effectives même si cela conduit à davantage d’incarcérations','privilégier la proportionnalité, les alternatives ou la réinsertion plutôt qu’une hausse générale des peines et de la population carcérale'],
            28:['donner la priorité à la prévention, à l’accompagnement et à la réinsertion plutôt qu’à l’alourdissement des sanctions','faire de la sanction et de l’exécution des peines un levier prioritaire par rapport aux politiques de prévention et de réinsertion'],
            29:['accroître les pouvoirs de contrôle et de surveillance de la police afin de lutter contre la criminalité','encadrer strictement les pouvoirs de police afin de préserver les libertés individuelles même si cela limite certains moyens de contrôle'],
            30:['appliquer des clauses miroir ou des interdictions d’importation lorsque les produits étrangers ne respectent pas les normes imposées aux producteurs nationaux, même au prix d’un renchérissement','préserver davantage l’ouverture commerciale et les prix bas plutôt qu’interdire largement les importations produites selon des normes différentes'],
            32:['faire de la réduction des émissions une priorité même lorsqu’elle pèse sur la croissance à court terme','subordonner davantage l’effort climatique à la compétitivité, au pouvoir d’achat ou à la croissance économique'],
            33:['accepter une hausse importante du prix des énergies fossiles pour accélérer les changements de consommation et d’investissement','limiter la hausse du coût des énergies fossiles et privilégier d’autres instruments de transition afin de protéger le pouvoir d’achat et la compétitivité'],
            34:['transférer une partie du financement social des cotisations sur les salaires vers la TVA afin d’alléger le coût du travail','refuser une TVA sociale et conserver un financement davantage assis sur les cotisations ou des prélèvements plus progressifs'],
            35:['utiliser prioritairement le prix du carbone, les incitations et l’innovation plutôt que des interdictions générales','recourir davantage aux normes, obligations et interdictions écologiques qu’aux seuls signaux de prix'],
            36:['interdire certains produits ou usages très polluants même lorsqu’une demande des consommateurs demeure','éviter les interdictions générales et privilégier l’information, l’innovation ou les alternatives laissant davantage de choix aux consommateurs'],
            37:['faire supporter aux pays riches une part particulièrement importante du financement de la transition climatique mondiale','répartir plus largement le coût de la transition entre pays et limiter les transferts financiers supplémentaires à la charge des économies riches'],
