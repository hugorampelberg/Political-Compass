            39:['préserver autant que possible la souveraineté décisionnelle nationale même lorsqu’une action européenne commune pourrait accroître l’influence collective','accepter davantage de décisions communes européennes lorsqu’elles renforcent l’influence et la capacité d’action de la France'],
            40:['considérer que les bénéfices économiques et politiques de l’euro l’emportent sur la perte d’autonomie monétaire','regretter la perte d’instruments monétaires nationaux et considérer qu’elle réduit trop fortement la marge de manœuvre économique'],
