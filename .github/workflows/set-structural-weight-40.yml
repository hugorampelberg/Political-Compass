name: Set structural weight to 40

on:
  push:
    paths:
      - '.github/scripts/set-structural-weight-40.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/set-structural-weight-40.py
      - name: Validate syntax
        run: node --check scripts/app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Set axis structural weighting to 40 percent"
          git push origin main
