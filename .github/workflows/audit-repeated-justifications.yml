name: Audit repeated justifications
on:
  push:
    paths: ['.github/workflows/audit-repeated-justifications.yml']
permissions: { contents: write }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat > /tmp/a.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function load(p,n){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(p,'utf8')+`\nthis.x=${n}`,c);return c.x}
          const q=load('data/questionnaire.js','QUESTIONNAIRE_DATA').questions;
          const es=[...load('data/parties.js','PARTIES_DATA'),...load('data/governments.js','GOVERNMENTS_DATA')];
          const m=new Map();
          es.forEach(e=>q.forEach((qq,i)=>{const j=String(e.justifications?.[i]||'').trim(); const arr=m.get(j)||[]; arr.push(`${e.shortName}|Q${qq.id}|${e.responses[i]}|${e.sources?.[i]||''}`); m.set(j,arr)}));
          const rows=[...m].filter(([j,a])=>a.length>=2).sort((a,b)=>b[1].length-a[1].length);
          let out='count\tjustification\texamples\n';
          const esc=s=>String(s).replace(/\t|\r?\n/g,' ');
          for(const [j,a] of rows) out+=`${a.length}\t${esc(j)}\t${esc(a.slice(0,12).join(' || '))}\n`;
          fs.writeFileSync('audit/repeated-justifications.tsv',out);
          console.log('repeated templates',rows.length,'top',rows.slice(0,20).map(x=>[x[1].length,x[0]]));
          NODE
          node /tmp/a.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/repeated-justifications.tsv
          git rm .github/workflows/audit-repeated-justifications.yml
          git commit -m 'Generate repeated justification audit report'
          git push
