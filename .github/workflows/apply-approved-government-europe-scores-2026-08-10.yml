name: Apply approved government Europe score updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved government Europe scores
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          function loadConst(path, name) {
            const src = fs.readFileSync(path, 'utf8') + `\n;globalThis.__value = ${name};`;
            const ctx = {};
            vm.createContext(ctx);
            vm.runInContext(src, ctx);
            return ctx.__value;
          }

          const questionnaire = loadConst('data/questionnaire.js', 'QUESTIONNAIRE_DATA');
          const governments = loadConst('data/governments.js', 'GOVERNMENTS_DATA');
          const questions = questionnaire.questions;
          const qIndex = new Map(questions.map((q, i) => [q.id, i]));
          const govById = new Map(governments.map(g => [g.id, g]));

          const changes = [
            {
              gov: 'danemark', q: 40, old: 0, value: -3,
              justification: "Désaccord fort : le Danemark conserve volontairement la couronne danoise et bénéficie d'une dérogation permanente à l'euro ; le maintien de cette monnaie nationale traduit un refus net d'abandonner cet instrument au profit de la monnaie unique."
            },
            {
              gov: 'royaume-uni', q: 40, old: 0, value: -3,
              justification: "Désaccord fort : le Royaume-Uni conserve la livre sterling et n'a jamais adopté l'euro ; sa ligne gouvernementale ne vise pas à rejoindre la monnaie unique européenne. Pour cette question normative sur le bénéfice de l'euro malgré la perte d'instruments nationaux, le choix britannique correspond à un désaccord maximal."
            },
            {
              gov: 'danemark', q: 88, old: 2, value: 3,
              justification: "Accord fort : en mars 2026, le gouvernement Frederiksen a rejoint le dialogue stratégique français sur la dissuasion nucléaire européenne, en acceptant consultations et participation à des exercices tout en laissant inchangée la maîtrise française de sa dissuasion ; la correspondance avec la question est presque exacte."
            }
          ];

          const before = new Map(governments.map(g => [g.id, {
            responses: [...g.responses],
            confidence: [...g.confidence],
            sources: [...g.sources],
            justifications: [...g.justifications]
          }]));

          for (const c of changes) {
            const g = govById.get(c.gov);
            if (!g) throw new Error(`Government not found: ${c.gov}`);
            const idx = qIndex.get(c.q);
            if (idx === undefined) throw new Error(`Question not found: Q${c.q}`);
            if (g.responses[idx] !== c.old) {
              throw new Error(`${c.gov} Q${c.q}: expected old ${c.old}, found ${g.responses[idx]}`);
            }
            g.responses[idx] = c.value;
            g.justifications[idx] = c.justification;
          }

          // Verify that only the three requested responses and corresponding justifications changed.
          const allowed = new Set(changes.map(c => `${c.gov}:${qIndex.get(c.q)}`));
          for (const g of governments) {
            const b = before.get(g.id);
            for (let i = 0; i < g.responses.length; i++) {
              const key = `${g.id}:${i}`;
              if (g.responses[i] !== b.responses[i] && !allowed.has(key)) {
                throw new Error(`Unexpected response change ${key}`);
              }
              if (g.justifications[i] !== b.justifications[i] && !allowed.has(key)) {
                throw new Error(`Unexpected justification change ${key}`);
              }
              if (g.confidence[i] !== b.confidence[i]) throw new Error(`Unexpected confidence change ${key}`);
              if (g.sources[i] !== b.sources[i]) throw new Error(`Unexpected source change ${key}`);
            }
          }

          // Recalculate every axis for every government from the current questionnaire.
          const axes = ['economy', 'authority', 'europe', 'ecology', 'immigration', 'democracy'];
          for (const g of governments) {
            const scores = {};
            for (const axis of axes) {
              let numerator = 0;
              let mass = 0;
              for (let i = 0; i < questions.length; i++) {
                const coeff = Number(questions[i].coefficients?.[axis] || 0);
                numerator += g.responses[i] * coeff;
                mass += Math.abs(coeff);
              }
              scores[axis] = mass ? 10 * numerator / (3 * mass) : 0;
            }
            g.axisScores = scores;
          }

          const output = `// Profils documentés des gouvernements et pays de comparaison.\nconst GOVERNMENTS_DATA = ${JSON.stringify(governments, null, 2)};\n`;
          fs.writeFileSync('data/governments.js', output);

          for (const c of changes) {
            const g = govById.get(c.gov);
            console.log(`${g.shortName} Q${c.q} = ${c.value}`);
          }
          for (const id of ['danemark', 'royaume-uni']) {
            const g = govById.get(id);
            console.log(`${g.shortName} axisScores = ${JSON.stringify(g.axisScores)}`);
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/governments.js
          git diff --cached --check
          git commit -m "Update approved government Europe scores"
          git push
