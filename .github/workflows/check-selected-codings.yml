name: Check selected codings
on:
  push:
    paths: ['.github/workflows/check-selected-codings.yml']
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat >/tmp/a.js <<'NODE'
          const fs=require('fs'),vm=require('vm');function load(p,n){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(p,'utf8')+`\nthis.x=${n}`,c);return c.x}
          const qs=load('data/questionnaire.js','QUESTIONNAIRE_DATA').questions;const ps=load('data/parties.js','PARTIES_DATA');
          const ids=[32,34,35,43,45,64,78]; let out='party\tqid\tscore\tconfidence\tsource\tjustification\n';
          const clean=s=>String(s??'').replace(/\t|\r?\n/g,' ');
          for(const p of ps) for(const qid of ids){const i=qs.findIndex(q=>q.id===qid);out+=[p.id,qid,p.responses[i],p.confidence[i],p.sources[i],p.justifications[i]].map(clean).join('\t')+'\n';}
          fs.writeFileSync('audit/selected-codings.tsv',out);
          NODE
          node /tmp/a.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/selected-codings.tsv
          git rm .github/workflows/check-selected-codings.yml
          git commit -m 'Export selected codings for source audit'
          git push
