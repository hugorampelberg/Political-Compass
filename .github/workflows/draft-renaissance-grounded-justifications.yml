name: Draft grounded Renaissance justifications
on:
  push:
    paths: ['.github/workflows/draft-renaissance-grounded-justifications.yml']
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q transformers==4.48.3 torch sentencepiece accelerate
      - name: Generate grounded drafts from extracted evidence
        run: |
          cat > /tmp/draft.py <<'PY'
          import csv,os,re
          from transformers import AutoTokenizer,AutoModelForCausalLM
          import torch
          src='audit/question-specific/evidence-fast/renaissance.tsv'; out='audit/question-specific/generated';os.makedirs(out,exist_ok=True)
          rows=list(csv.DictReader(open(src,encoding='utf8'),delimiter='\t'))
          model_id='Qwen/Qwen2.5-0.5B-Instruct'
          tok=AutoTokenizer.from_pretrained(model_id)
          model=AutoModelForCausalLM.from_pretrained(model_id,torch_dtype=torch.float32,low_cpu_mem_usage=True)
          labels={-3:'désaccord très fort',-2:'désaccord net',-1:'réserve modérée',0:'position intermédiaire',1:'accord modéré',2:'accord net',3:'accord très fort'}
          outputs=[]
          for r in rows:
            evidence='\n'.join(x for x in [r.get('evidence_1',''),r.get('evidence_2',''),r.get('evidence_3','')] if x)[:4500]
            score=int(r['score'])
            prompt=f'''Rédige une justification publique en français pour un questionnaire politique.\nEntité : Renaissance.\nQuestion : {r['question']}\nNote : {score:+d} ({labels[score]}).\nPassages de la source officielle :\n{evidence}\n\nRègles impératives : 1 ou 2 phrases, 45 à 90 mots. Explique le lien précis entre les passages et CETTE question. Ne parle jamais de confiance documentaire, codage, audit, preuve ou méthodologie. N'invente aucun fait absent des passages. Si les passages ne permettent pas de justifier directement la note, dis précisément ce qu'ils établissent et ce qu'ils ne tranchent pas. Ne cite pas mot pour mot plus de 8 mots consécutifs. Ne répète pas le texte de la question. Ne termine pas par une formule générique. Commence par « {labels[score].capitalize()} : ».'''
            msgs=[{'role':'system','content':'Tu es un rédacteur factuel et prudent. Tu ne déduis rien qui ne soit étayé par le texte fourni.'},{'role':'user','content':prompt}]
            text=tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True)
            inp=tok(text,return_tensors='pt')
            with torch.no_grad(): gen=model.generate(**inp,max_new_tokens=150,do_sample=False,repetition_penalty=1.08)
            ans=tok.decode(gen[0][inp['input_ids'].shape[1]:],skip_special_tokens=True).strip().replace('\n',' ')
            outputs.append({**r,'draft':re.sub(r'\s+',' ',ans)})
          with open(out+'/renaissance.tsv','w',encoding='utf8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=outputs[0].keys(),delimiter='\t',lineterminator='\n');w.writeheader();w.writerows(outputs)
          PY
          python /tmp/draft.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/question-specific/generated/renaissance.tsv
          git commit -m 'Draft grounded Renaissance justifications' || exit 0
          git push
