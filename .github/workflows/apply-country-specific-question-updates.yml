name: Apply country-specific question updates

on:
  push:
    paths:
      - '.github/scripts/apply-country-specific-question-updates.js'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply updates
        run: node .github/scripts/apply-country-specific-question-updates.js
      - name: Validate JavaScript syntax
        run: node --check data/governments.js
      - name: Validate targeted responses and recalculated axes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const c={}; vm.createContext(c);
          for (const p of ['data/questionnaire.js','data/governments.js']) {
            vm.runInContext(fs.readFileSync(p,'utf8').replace(/^const /gm,'var '), c, {filename:p});
          }
          const qi=new Map(c.QUESTIONNAIRE_DATA.questions.map((q,i)=>[q.id,i]));
          const gm=new Map(c.GOVERNMENTS_DATA.map(g=>[g.id,g]));
          const expected={
            allemagne:{15:-2,85:1}, espagne:{15:-2,81:1}, suisse:{15:-2,81:3},
            finlande:{15:-2}, 'royaume-uni':{15:-2,81:1}, danemark:{15:-2,48:1,81:3},
            'pays-bas':{15:-2,85:0}, pologne:{15:-2}
          };
          for (const [id, qs] of Object.entries(expected)) for (const [qid,v] of Object.entries(qs)) {
            const got=gm.get(id).responses[qi.get(Number(qid))];
            if (got!==v) throw new Error(`${id} Q${qid}: ${got} != ${v}`);
          }
          const axes=c.QUESTIONNAIRE_DATA.axes.map(a=>a.key);
          for (const g of c.GOVERNMENTS_DATA) for (const axis of axes) {
            let num=0,mass=0;
            c.QUESTIONNAIRE_DATA.questions.forEach((q,i)=>{const x=q.coefficients[axis]||0;num+=g.responses[i]*x;mass+=Math.abs(x);});
            const score=mass?10*num/(3*mass):0;
            if (Math.abs(g.axisScores[axis]-score)>1e-10) throw new Error(`${g.id} ${axis} stale`);
          }
          console.log('Validation passed');
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/governments.js
          git diff --cached --quiet && exit 0
          git commit -m "Update country-specific government codings"
          git push origin main
