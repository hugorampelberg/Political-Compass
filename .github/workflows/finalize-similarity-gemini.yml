name: Finalize similarity and Gemini integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-similarity-gemini.yml'
      - '.github/scripts/finalize-similarity-gemini.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/finalize-similarity-gemini.py

      - name: Validate syntax
        run: |
          node --check scripts/app.js
          node --check lib/gemini.js

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app.js lib/gemini.js
          git commit -m "Finalize similarity scoring and Gemini drivers"
          git push
