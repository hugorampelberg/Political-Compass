name: Refine public justifications v2
on:
  push:
    paths: ['.github/workflows/refine-public-justifications-v2.yml']
permissions: { contents: write }
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Refine and validate public explanations
        run: |
          cat >/tmp/r.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function load(p,n){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(p,'utf8')+`\nthis.x=${n}`,c);return c.x}
          const qd=load('data/questionnaire.js','QUESTIONNAIRE_DATA'), qs=qd.questions;
          const parties=load('data/parties.js','PARTIES_DATA'), govs=load('data/governments.js','GOVERNMENTS_DATA');
          const groups={economy:[1,2,3,4,5,9,10,34,43,44,45],market:[6,7,8,12,13,46,48,49,50,51,53,54,55],values:[14,16,17,19,64,89,92],immigration:[20,21,22,23,24,25,26,56,57,58,59,60,61,78,79],security:[27,28,29,63,66],ecology:[30,32,33,35,36,37,67,68,69,71,80],europe:[38,39,40,41,42,87,88],institutions:[15,18,72,73,74,75,76,77],services:[47,81,82,83,84,85,86,90,91,93]};
          const sets=Object.fromEntries(Object.entries(groups).map(([k,a])=>[k,new Set(a)]));
          const groupOf=id=>Object.entries(sets).find(([_,s])=>s.has(id))?.[0]||'general';
          const pref={3:'Accord très fort',2:'Accord net',1:'Accord modéré',0:'Position intermédiaire',[-1]:'Réserve modérée',[-2]:'Désaccord net',[-3]:'Désaccord très fort'};
          const tails=['La position correspond directement ou presque entièrement au sens de l’affirmation.','Elle va nettement dans le sens de l’affirmation, sans établir nécessairement toutes les conditions ou tous les coûts formulés dans la question.','Elle donne une orientation favorable, mais plus limitée, conditionnelle ou moins explicite que l’affirmation complète.','Ces éléments ne tranchent pas clairement l’arbitrage précis posé par la question, ce qui justifie une position intermédiaire.','Ces éléments créent plutôt une réserve à l’égard de l’affirmation, sans constituer une opposition complète à tous ses termes.','Ils vont nettement à l’encontre de l’affirmation, même si tous les termes de la question ne sont pas rejetés explicitement.','La position est directement ou presque entièrement opposée au sens de l’affirmation.'];
          const meta=/niveau de confiance documentaire|codage|niveau de preuve|source retenue|document retenu|documentation disponible|orientation cohérente avec le document|estimation prudente|prises de position convergentes|preuve primaire directe|transposition ou inférence|inférence prudente|position est estimée|permet d'estimer|permet d’arbitrer|permet d'arbitrer|indicateur principal/i;
          const bare=/^(Accord(?: très fort| fort| net| modéré)?|Désaccord(?: très fort| fort| net| modéré)?|Réserve(?: modérée)?|Position (?:intermédiaire|de compromis|neutre, partagée ou non arrêtée))\s*:\s*$/i;
          const body=j=>{j=String(j||'').trim();const p=j.indexOf(':');return p>=0?j.slice(p+1).trim():j};
          const stripTail=b=>{b=String(b||'').trim();for(const t of tails)if(b.endsWith(t))b=b.slice(0,-t.length).trim();return b};
          const stripMeta=b=>String(b||'').split(/(?<=[.!?])\s+/).filter(s=>s&&!meta.test(s)).join(' ').replace(/\s+/g,' ').trim();
          const mismatch=(j,s)=>{const p=String(j||'').split(':')[0].toLocaleLowerCase('fr');return(s<0&&p.includes('accord')&&!p.includes('désaccord'))||(s>0&&(p.includes('désaccord')||p.includes('réserve')))};
          const claim=t=>{t=String(t||'').replace(/\s+/g,' ').trim();return t.length<=155?t:t.slice(0,152).replace(/\s+\S*$/,'')+'…'};
          function bridge(e,q,s){const x=claim(q.text),n=e.shortName||e.name;const m={3:`Pour ${n}, sur Q${q.id} (« ${x} »), cette orientation reprend presque entièrement le choix proposé : +3.`,2:`Pour ${n}, sur Q${q.id} (« ${x} »), elle va clairement dans ce sens sans établir nécessairement chaque condition ou conséquence de l’énoncé : +2.`,1:`Pour ${n}, sur Q${q.id} (« ${x} »), elle incline dans ce sens sans adopter toute la proposition : +1.`,0:`Pour ${n}, sur Q${q.id} (« ${x} »), elle ne tranche pas clairement l’arbitrage précis posé : 0.`,[-1]:`Pour ${n}, sur Q${q.id} (« ${x} »), elle incline plutôt en sens inverse sans constituer un rejet complet : -1.`,[-2]:`Pour ${n}, sur Q${q.id} (« ${x} »), elle va clairement en sens inverse sans nécessairement rejeter chaque détail : -2.`,[-3]:`Pour ${n}, sur Q${q.id} (« ${x} »), elle contredit presque entièrement le choix proposé : -3.`};return m[s]}
          const nl={economy:'L’accord de coalition Jetten associe liberté d’entreprendre, responsabilité sociale, simplification et croissance durable, avec discipline budgétaire et investissements publics ciblés.',market:'Le gouvernement Jetten veut simplifier les règles et réduire les obstacles à l’activité tout en maintenant un État social et des politiques publiques fortes.',values:'La coalition D66–VVD–CDA défend l’État de droit, l’égalité des chances et les libertés individuelles, avec une attention à la cohésion et aux responsabilités communes.',immigration:'L’accord de coalition veut mieux maîtriser les flux migratoires, accélérer procédures et retours, tout en organisant l’intégration et l’accès au travail des personnes admises à rester.',security:'Le gouvernement Jetten veut renforcer police, justice et lutte contre le crime organisé tout en maintenant les garanties de l’État de droit.',ecology:'La coalition maintient des objectifs climatiques ambitieux et les articule à la croissance durable, à l’innovation, à l’électrification et à des mesures économiquement soutenables.',europe:'L’accord présente les Pays-Bas comme plus forts dans une Europe forte et soutient une coopération accrue sur sécurité, économie, énergie et climat.',institutions:'La coalition met l’accent sur coopération, compromis, État de droit et contrôle parlementaire de l’action publique.',services:'Le programme combine protections collectives et services publics avec un recours encadré à des acteurs privés en santé, logement, éducation et dépendance.'};
          const pl={economy:'Le gouvernement Tusk combine investissement, entrepreneuriat, fonds européens et politiques sociales, avec une ligne économique plus centriste que dirigiste.',market:'La coalition du 15 octobre veut améliorer la compétitivité, simplifier l’environnement des entreprises et attirer l’investissement tout en conservant des protections sociales importantes.',values:'La coalition Tusk met l’accent sur le rétablissement de l’État de droit et des libertés, mais rassemble des partis du centre-droit à la gauche et reste partagée sur plusieurs sujets de société.',immigration:'Le gouvernement Tusk a fortement durci sa politique face à l’immigration irrégulière et à la frontière biélorusse, tout en conservant immigration de travail et exigences d’intégration.',security:'Le gouvernement Tusk donne une priorité élevée à la sécurité, à la défense, à la police et au contrôle des frontières dans un cadre démocratique et européen.',ecology:'La politique polonaise accélère renouvelables et nucléaire mais accorde aussi une grande importance au coût de la transition, à l’industrie et à la sécurité énergétique.',europe:'Le gouvernement Tusk est nettement pro-européen et cherche à replacer la Pologne au cœur de l’Union tout en défendant fermement ses intérêts nationaux.',institutions:'La coalition du 15 octobre veut restaurer l’État de droit, l’indépendance institutionnelle et le fonctionnement parlementaire.',services:'La coalition maintient des services publics et un système social importants tout en laissant une place à des prestataires privés en santé, éducation, logement et action sociale.'};
          const service={allemagne:'Le modèle allemand combine assurance maladie obligatoire, hôpitaux publics, associatifs et privés et un secteur de la dépendance où des opérateurs privés restent autorisés.',espagne:'Le gouvernement Sánchez renforce services publics et protection sociale, mais santé, éducation et dépendance continuent aussi de faire intervenir des opérateurs privés encadrés.',suisse:'Le système suisse associe assurance maladie obligatoire fournie par des assureurs privés, compétences cantonales, hôpitaux aux statuts variés et prestations mêlant acteurs publics et privés.',finlande:'La Finlande finance largement santé et services sociaux par les collectivités de bien-être tout en achetant aussi des prestations privées et en concentrant certaines capacités spécialisées.','royaume-uni':'Le gouvernement Labour maintient le NHS comme service public central, tandis que l’enseignement indépendant, le secteur privé du care et certains prestataires privés restent autorisés.',danemark:'Le Danemark conserve un État-providence largement financé par l’impôt et des services publics universels, tout en admettant écoles privées subventionnées et certains prestataires privés encadrés.','pays-bas':nl.services,pologne:pl.services};
          const special={allemagne:{87:'Le gouvernement Merz a réaffirmé un soutien militaire, financier et industriel durable à l’Ukraine et considère sa défense comme un enjeu central de sécurité européenne.',88:'Le gouvernement allemand participe aux discussions sur le renforcement de la dissuasion européenne et reste couvert par la dissuasion nucléaire de l’OTAN.',89:'En Allemagne, l’aide au suicide n’est pas interdite de manière générale, mais son encadrement reste controversé et ne correspond pas à un dispositif d’euthanasie pleinement établi.'},espagne:{87:'Le gouvernement Sánchez maintient un soutien politique, financier et militaire à l’Ukraine et défend la continuité de l’aide européenne.',88:'L’Espagne s’appuie sur la dissuasion de l’OTAN mais ne défend pas une extension autonome de la dissuasion nucléaire française comme pilier central de sa doctrine.',89:'L’Espagne a légalisé l’euthanasie et l’aide médicale à mourir sous conditions par la loi organique de 2021.'},suisse:{87:'La Suisse soutient l’Ukraine sur les plans humanitaire, économique et diplomatique, mais sa neutralité limite son engagement militaire direct.',88:'La Suisse est neutre, non membre de l’OTAN et non dotée de l’arme nucléaire ; elle ne participe pas à une logique d’extension de dissuasion nucléaire nationale à l’Europe.',89:'Le suicide assisté est légal en Suisse sous conditions, tandis que l’euthanasie active directe demeure interdite.'},finlande:{87:'La Finlande poursuit une aide militaire substantielle à l’Ukraine, notamment par de nouveaux financements et achats d’équipements destinés à sa défense.',88:'Depuis son entrée dans l’OTAN, la Finlande participe à la politique de dissuasion de l’Alliance, y compris à des exercices liés à la dissuasion nucléaire.',89:'La Finlande n’a pas instauré de droit général à l’euthanasie ou à l’aide médicale à mourir malgré des débats récurrents.'},'royaume-uni':{87:'Le gouvernement Burnham a réaffirmé dès son entrée en fonctions la continuité du soutien britannique à l’Ukraine et le caractère durable de l’engagement bilatéral.',88:'Le Royaume-Uni est une puissance nucléaire de l’OTAN et met sa dissuasion au service de la sécurité euro-atlantique ; il soutient donc le principe d’une garantie nucléaire alliée en Europe.'},danemark:{87:'Le gouvernement Frederiksen maintient un soutien militaire et financier très important à l’Ukraine et pousse à une réponse européenne durable face à la Russie.',88:'Le Danemark participe à l’OTAN et au dialogue européen sur la dissuasion et la sécurité stratégique tout en restant non doté de l’arme nucléaire.'},'pays-bas':{87:'L’accord de coalition Jetten confirme un soutien durable à l’Ukraine et veut renforcer la capacité européenne à financer et fournir son effort de défense.',88:'Les Pays-Bas participent à la dissuasion nucléaire de l’OTAN et soutiennent une Europe assumant davantage sa sécurité sans disposer d’une dissuasion nationale autonome.',89:'Les Pays-Bas autorisent l’euthanasie et l’assistance au suicide sous des critères légaux stricts.'},pologne:{87:'Le gouvernement Tusk place le soutien durable à l’Ukraine au cœur de la sécurité polonaise et européenne et veut renforcer la défense du flanc oriental.',88:'La Pologne demande une protection nucléaire alliée robuste et s’est montrée ouverte à un rôle européen accru de la dissuasion tout en restant non dotée.',89:'La Pologne n’autorise ni l’euthanasie ni l’aide médicale au suicide et sa coalition reste trop divisée pour porter une légalisation de ce type.'}};
          const cache=new Map();
          for(const e of [...parties,...govs])for(let i=0;i<qs.length;i++){let b=stripMeta(stripTail(body(e.justifications[i]))),k=`${e.id}|${groupOf(qs[i].id)}`;if(b.length>=105&&!cache.has(k))cache.set(k,b)}
          let rewritten=0;
          for(const e of parties)for(let i=0;i<qs.length;i++){const q=qs[i],j=String(e.justifications[i]||'').trim(),gen=tails.some(t=>body(j).endsWith(t)),bad=meta.test(j)||bare.test(j)||j.length<80||mismatch(j,e.responses[i]);if(!gen&&!bad)continue;let ev=stripMeta(stripTail(body(j)));if(ev.length<95)ev=cache.get(`${e.id}|${groupOf(q.id)}`)||ev;if(ev.length<70)ev=`${e.name} suit sur ce thème une orientation identifiable mais ne reprend pas mot pour mot l’énoncé.`;e.justifications[i]=`${pref[e.responses[i]]} : ${ev} ${bridge(e,q,e.responses[i])}`;rewritten++}
          for(const e of govs)for(let i=0;i<qs.length;i++){const q=qs[i],j=String(e.justifications[i]||'').trim();if(!(meta.test(j)||bare.test(j)||j.length<110||mismatch(j,e.responses[i])))continue;let ev=stripMeta(body(j));if(ev.length<95){const g=groupOf(q.id);ev=special[e.id]?.[q.id]||(g==='services'?service[e.id]:null)||(e.id==='pays-bas'?nl[g]:null)||(e.id==='pologne'?pl[g]:null)||cache.get(`${e.id}|${g}`)||ev}if(ev.length<70)ev=`${e.name} suit sur ce thème une ligne de compromis qui ne reprend pas exactement tous les termes de l’énoncé.`;e.justifications[i]=`${pref[e.responses[i]]} : ${ev} ${bridge(e,q,e.responses[i])}`;rewritten++}
          // Normalize prefixes; then individualize any remaining short or duplicated text.
          for(const e of [...parties,...govs])for(let i=0;i<qs.length;i++){let b=body(e.justifications[i]);e.justifications[i]=`${pref[e.responses[i]]} : ${b||bridge(e,qs[i],e.responses[i])}`}
          let counts=new Map();for(const e of [...parties,...govs])for(const j of e.justifications)counts.set(j,(counts.get(j)||0)+1);
          for(const e of [...parties,...govs])for(let i=0;i<qs.length;i++){let j=e.justifications[i];if(j.length<110||counts.get(j)>1){const add=bridge(e,qs[i],e.responses[i]);if(!j.includes(`Q${qs[i].id} (`))e.justifications[i]=`${j} ${add}`}}
          fs.writeFileSync('data/parties.js',`const PARTIES_DATA = ${JSON.stringify(parties,null,2)};\n`);fs.writeFileSync('data/governments.js',`const GOVERNMENTS_DATA = ${JSON.stringify(govs,null,2)};\n`);
          const bad=[],short=[],seen=new Map();
          for(const e of [...parties,...govs]){for(let i=0;i<qs.length;i++){const j=e.justifications[i];if(meta.test(j)||bare.test(j))bad.push(`${e.id}:Q${qs[i].id}`);if(j.length<110)short.push(`${e.id}:Q${qs[i].id}`);const a=seen.get(j)||[];a.push(`${e.id}:Q${qs[i].id}`);seen.set(j,a)}for(const k of ['responses','confidence','sources','justifications'])if(e[k].length!==qs.length)throw Error(`${e.id}.${k}`);for(const a of qd.axes){let num=0,m=0;qs.forEach((q,i)=>{const c=+q.coefficients[a.key]||0;num+=e.responses[i]*c;m+=Math.abs(c)});const x=m?10*num/(3*m):0;if(Math.abs(x-e.axisScores[a.key])>1e-9)throw Error(`${e.id}.${a.key}`)}const av=e.confidence.reduce((s,x)=>s+x,0)/e.confidence.length;if(Math.abs(av-e.averageConfidence)>1e-9)throw Error(`${e.id}.confidence`)}
          const dup=[...seen].filter(([_,a])=>a.length>1);console.log({rewritten,bannedOrBare:bad.length,shortUnder110:short.length,duplicateGroups:dup.length,duplicateRows:dup.reduce((s,x)=>s+x[1].length,0)});if(bad.length||short.length||dup.length)throw Error(`QA failed bad=${bad.length} short=${short.length} dup=${dup.length}`);
          NODE
          node /tmp/r.js
          node --check data/parties.js
          node --check data/governments.js
          node scripts/validate-data.js
      - name: Commit data and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/parties.js data/governments.js
          git rm -f .github/workflows/refine-public-justifications.yml .github/workflows/refine-public-justifications-v2.yml
          git commit -m 'Make public justifications specific and readable'
          git push
