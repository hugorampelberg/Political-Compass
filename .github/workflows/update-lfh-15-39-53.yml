name: Update LFH Q15 Q39 Q53
on:
  push:
    paths:
      - '.github/scripts/update-lfh-15-39-53.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/update-lfh-15-39-53.py
      - run: node --check data/parties.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parties.js
          git diff --cached --quiet && exit 0
          git commit -m "Update LFH Q15 Q39 Q53"
          git push origin main
