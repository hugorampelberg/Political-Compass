          const profiles={lfi:LFI,pcf:PCF,'les-ecologistes':ECO,ps:PS,renaissance:REN,modem:MODEM,horizons:HORIZONS,'france-humaniste':LFH,lr:LR,'nouvelle-energie':NE,udr:UDR,rn:RN,reconquete:REC};
          const banned=[/niveau de confiance documentaire/i,/orientation cohérente avec le document officiel retenu/i,/estimation prudente/i,/sources officielles et prises de position convergentes/i,/preuve primaire directe ou proposition officielle très proche/i,/codage cohérent/i,/codage fondé/i,/niveau de preuve/i,/réévalué indépendamment/i,/sans passage isolé directement équivalent/i,/formulation parfaitement équivalente/i];
          const intensity={3:'Accord très fort',2:'Accord net',1:'Accord modéré',0:'Position intermédiaire',[-1]:'Réserve modérée',[-2]:'Désaccord net',[-3]:'Désaccord très fort'};
          const relation={
            3:'La position correspond directement ou presque entièrement au sens de l’affirmation.',
            2:'Elle va nettement dans le sens de l’affirmation, sans établir nécessairement toutes les conditions ou tous les coûts formulés dans la question.',
