          const REC={
            economy:['https://programme.ericzemmour.fr/','Le programme d’Éric Zemmour défend une baisse marquée des impôts et charges sur les travailleurs et les entreprises, la réduction de la dépense publique et une politique favorable au travail, à l’industrie et à la propriété.'],
            market:['https://programme.ericzemmour.fr/','Reconquête défend l’initiative privée, la baisse des normes et des prélèvements et la compétitivité, tout en assumant une intervention de l’État pour la souveraineté industrielle, énergétique et stratégique.'],
            values:['https://www.parti-reconquete.fr/','Reconquête place l’identité, les libertés, la transmission culturelle, l’instruction et l’indépendance parmi ses priorités et adopte une ligne nettement conservatrice sur les questions de société et d’assimilation.'],
            immigration:['https://programme.ericzemmour.fr/immigration','Le programme d’Éric Zemmour veut réduire très fortement l’immigration, durcir le séjour et la nationalité, privilégier l’assimilation et expulser plus systématiquement les étrangers en situation irrégulière ou délinquants.'],
            security:['https://programme.ericzemmour.fr/securite','Reconquête défend une ligne de forte fermeté pénale, davantage d’autorité pour les forces de l’ordre et une politique de sécurité centrée sur la sanction et la lutte contre la récidive.'],
            ecology:['https://programme.ericzemmour.fr/environnement','Reconquête privilégie le nucléaire, la souveraineté énergétique, la technologie et une écologie non punitive, et s’oppose à plusieurs restrictions qu’il estime pénaliser les automobilistes, l’agriculture ou l’industrie.'],
            europe:['https://programme.ericzemmour.fr/europe','Reconquête défend la primauté de la souveraineté française sur les institutions supranationales et refuse une intégration européenne qui réduirait la capacité nationale de décider.'],
            institutions:['https://programme.ericzemmour.fr/democratie','Reconquête veut renforcer le recours au référendum et la souveraineté populaire tout en défendant un exécutif fort et une réduction du pouvoir des institutions et juges supranationaux.'],
            services:['https://programme.ericzemmour.fr/','Reconquête veut réduire la dépense et la bureaucratie tout en conservant ou renforçant les fonctions jugées essentielles de l’État dans la sécurité, l’école, la santé et la souveraineté.']
