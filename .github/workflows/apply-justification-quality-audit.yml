name: Apply justification quality audit
on:
  push:
    paths: ['.github/workflows/apply-justification-quality-audit.yml']
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Improve weak user-visible justifications
        run: |
          cat > /tmp/update.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function load(path,name){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(path,'utf8')+`\nthis.__out=${name};`,c);return c.__out;}
          const qd=load('data/questionnaire.js','QUESTIONNAIRE_DATA');
          const parties=load('data/parties.js','PARTIES_DATA');
          const govs=load('data/governments.js','GOVERNMENTS_DATA');
          const qs=qd.questions;
          const qIndex=new Map(qs.map((q,i)=>[q.id,i]));
          const groups={
            economy:new Set([1,2,3,4,5,9,10,34,43,44,45]),
            market:new Set([6,7,8,12,13,46,48,49,50,51,53,54,55]),
            values:new Set([14,16,17,19,64,89,92]),
            immigration:new Set([20,21,22,23,24,25,26,56,57,58,59,60,61,78,79]),
            security:new Set([27,28,29,63,66]),
            ecology:new Set([30,32,33,35,36,37,67,68,69,71,80]),
            europe:new Set([38,39,40,41,42,87,88]),
            institutions:new Set([15,18,72,73,74,75,76,77]),
            services:new Set([47,81,82,83,84,85,86,90,91,93])
