            institutions:['https://programme.lafranceinsoumise.fr/livrets/6e-republique/','LFI défend une VIe République, davantage de contrôle parlementaire et citoyen, le référendum d’initiative citoyenne et une réduction du caractère présidentiel des institutions.'],
            services:['https://lafranceinsoumise.fr/wp-content/uploads/2024/06/Programme-nouveaufrontpopulaire.pdf','LFI défend l’extension des services publics et de la protection sociale, un accès plus égalitaire à la santé, à l’école et au logement, ainsi qu’un encadrement accru des acteurs privés dans les secteurs essentiels.']
