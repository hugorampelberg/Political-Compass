            institutions:['https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf','Les Écologistes veulent une République écologique et citoyenne, plus parlementaire et participative, avec davantage de souveraineté populaire et des contre-pouvoirs renforcés.'],
