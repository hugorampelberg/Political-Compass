          };
          function genericProfile(e,q){
            if(e.category==='government') return null;
            const p=profiles[e.id]; if(!p) return null; return p[groupOf(q.id)]||p.general||Object.values(p)[0];
          }
          function needsRewrite(j){j=String(j||'').trim();return !j||banned.some(r=>r.test(j));}
          function applyEntity(e){
            let responsesChanged=false, confidenceChanged=false, rewritten=0, sourcesChanged=0;
            for(let i=0;i<qs.length;i++){
              const q=qs[i]; const ov=overrides[e.id]?.[q.id];
              if(ov){
                if(e.responses[i]!==ov.score){e.responses[i]=ov.score;responsesChanged=true;}
                if(e.confidence[i]!==ov.confidence){e.confidence[i]=ov.confidence;confidenceChanged=true;}
                if(e.sources[i]!==ov.source){e.sources[i]=ov.source;sourcesChanged++;}
                e.justifications[i]=ov.just; rewritten++; continue;
              }
              if(!needsRewrite(e.justifications[i])) continue;
              if(e.category==='government'){
                // Remove audit/meta language from the very small number of government rows without inventing a new policy claim.
                let j=String(e.justifications[i]||'').replace(/\s*(?:Le niveau de confiance documentaire[^.]*\.|Niveau de preuve[^.]*\.|Codage[^.]*\.)/gi,' ').replace(/\s+/g,' ').trim();
                if(j && !banned.some(r=>r.test(j))){e.justifications[i]=j;rewritten++;}
                continue;
              }
              const pr=genericProfile(e,q); if(!pr) continue;
              e.sources[i]=pr[0]; sourcesChanged++;
              e.justifications[i]=`${intensity[e.responses[i]]} : ${pr[1]} ${relation[e.responses[i]]}`;
              rewritten++;
            }
            if(responsesChanged){
              const scores={};
              for(const a of qd.axes){
                let num=0,mass=0;
                qs.forEach((q,i)=>{const c=Number(q.coefficients[a.key]||0);num+=e.responses[i]*c;mass+=Math.abs(c);});
                scores[a.key]=mass?10*num/(3*mass):0;
              }
              e.axisScores=scores;
            }
            if(confidenceChanged){e.averageConfidence=e.confidence.reduce((a,b)=>a+b,0)/e.confidence.length;}
            return {rewritten,sourcesChanged,responsesChanged,confidenceChanged};
          }
          const stats={rewritten:0,sourcesChanged:0,responseEntities:[],confidenceEntities:[]};
          for(const e of [...parties,...govs]){const s=applyEntity(e);stats.rewritten+=s.rewritten;stats.sourcesChanged+=s.sourcesChanged;if(s.responsesChanged)stats.responseEntities.push(e.id);if(s.confidenceChanged)stats.confidenceEntities.push(e.id);}
          function serialize(name,data){return `const ${name} = ${JSON.stringify(data,null,2)};\n`;}
          fs.writeFileSync('data/parties.js',serialize('PARTIES_DATA',parties));
          fs.writeFileSync('data/governments.js',serialize('GOVERNMENTS_DATA',govs));
          const leftovers=[];
          for(const e of [...parties,...govs]) e.justifications.forEach((j,i)=>{if(banned.some(r=>r.test(String(j||''))))leftovers.push(`${e.id} Q${qs[i].id}: ${j}`);});
          if(leftovers.length){console.error(leftovers.slice(0,50).join('\n'));throw new Error(`Remaining banned meta justifications: ${leftovers.length}`);}
          for(const e of [...parties,...govs]){
            for(const k of ['responses','confidence','sources','justifications']) if(!Array.isArray(e[k])||e[k].length!==qs.length) throw new Error(`${e.id} ${k} length`);
            if(e.responses.some(v=>!Number.isInteger(v)||v<-3||v>3)) throw new Error(`${e.id} response range`);
            if(e.confidence.some(v=>!Number.isInteger(v)||v<1||v>3)) throw new Error(`${e.id} confidence range`);
            for(const a of qd.axes){let num=0,mass=0;qs.forEach((q,i)=>{const c=Number(q.coefficients[a.key]||0);num+=e.responses[i]*c;mass+=Math.abs(c);});const expected=mass?10*num/(3*mass):0;if(Math.abs(expected-e.axisScores[a.key])>1e-9)throw new Error(`${e.id} axis ${a.key}`);}
            const avg=e.confidence.reduce((a,b)=>a+b,0)/e.confidence.length;if(Math.abs(avg-e.averageConfidence)>1e-9)throw new Error(`${e.id} averageConfidence`);
          }
          fs.writeFileSync('/tmp/stats.json',JSON.stringify(stats,null,2));
          console.log(stats);
          NODE
          node /tmp/update.js
          node --check data/parties.js
          node --check data/governments.js
          node --check scripts/app.js
          cat /tmp/stats.json
      - name: Remove temporary audit files and commit
        run: |
          rm -rf audit
          rm -f .github/workflows/README-TEMP-AUDIT.txt .github/workflows/cleanup-audit-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/apply-justification-quality-audit.yml
          git commit -m 'Improve documentary justifications and sources'
          git push
