            values:['https://www.pcf.fr/pacte_2025_republique','Le PCF lie son projet républicain à l’égalité des droits, à la lutte contre les discriminations et à l’émancipation sociale, tout en défendant un cadre commun laïque.'],
            immigration:['https://www.pcf.fr/pacte_2025_republique','Le PCF défend la régularisation des travailleurs sans papiers, l’égalité des droits et l’intégration par le travail, les services publics et l’apprentissage de la langue plutôt qu’une politique de préférence nationale.'],
            security:['https://www.pcf.fr/pacte_2025_republique','Le PCF demande des moyens pour la justice et la sécurité de proximité mais insiste sur la prévention, les garanties de l’État de droit et le refus d’une logique principalement punitive ou de surveillance généralisée.'],
            ecology:['https://www.pcf.fr/le_programme','Le PCF défend une planification écologique et industrielle, de lourds investissements publics, le nucléaire avec les renouvelables et des normes environnementales compatibles avec la souveraineté productive.'],
