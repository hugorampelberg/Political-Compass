            immigration:['https://projet-socialiste.fr/projet/refaire-societe/','Le Projet socialiste 2026 veut régulariser par le travail, renforcer les voies légales d’entrée et le droit d’asile, défendre l’AME et développer dès la demande de titre l’apprentissage du français et la formation civique.'],
            security:['https://projet-socialiste.fr/projet/etre-en-securites/','Le PS défend une sécurité de proximité articulant police, prévention et justice, avec des moyens publics renforcés mais sous contrôle de l’État de droit et sans faire de la seule répression le principe directeur.'],
