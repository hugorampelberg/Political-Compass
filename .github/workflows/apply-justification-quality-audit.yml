            immigration:['https://www.mouvementdemocrate.fr/node/2315','Le MoDem défend une approche migratoire pragmatique combinant coopération avec les pays d’origine, harmonisation européenne de l’asile, conditions d’accueil et aide au développement plutôt qu’une logique d’ouverture ou de fermeture absolue.'],
            security:['https://www.mouvementdemocrate.fr/programme/democratie-et-citoyennete-2424','Le MoDem privilégie l’équilibre entre efficacité de l’action publique, libertés fondamentales et contrôle démocratique, ce qui le conduit généralement à des positions de sécurité plus modérées que les partis répressifs.'],
