name: Update party scores 2026-08-09

on:
  push:
    branches:
      - update-parties-scores-2026-08-09

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-parties-scores-2026-08-09
          fetch-depth: 0

      - name: Apply response changes and recalculate axis scores
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function parseConstFile(path, constName) {
            const text = fs.readFileSync(path, 'utf8');
            const marker = `const ${constName} = `;
            const start = text.indexOf(marker);
            if (start < 0) throw new Error(`Missing ${constName} in ${path}`);
            const jsonStart = start + marker.length;
            const end = text.lastIndexOf(';');
            if (end < jsonStart) throw new Error(`Missing trailing semicolon in ${path}`);
            return { text, value: JSON.parse(text.slice(jsonStart, end).trim()) };
          }

          function labelFor(value) {
            return ({
              '-3': 'Désaccord fort',
              '-2': 'Désaccord net',
              '-1': 'Réserve',
              '0': 'Position équilibrée ou non tranchée',
              '1': 'Accord modéré',
              '2': 'Accord net',
              '3': 'Accord fort'
            })[String(value)];
          }

          const questionnaire = parseConstFile('data/questionnaire.js', 'QUESTIONNAIRE_DATA').value;
          const parsedParties = parseConstFile('data/parties.js', 'PARTIES_DATA');
          const parties = parsedParties.value;
          const qIndex = new Map(questionnaire.questions.map((q, i) => [q.id, i]));
          const byId = new Map(parties.map(p => [p.id, p]));

          const changes = [
            ['lfi', 58, -1],
            ['lfi', 78, 0],
            ['pcf', 58, -2],
            ['pcf', 78, -1],
            ['les-ecologistes', 78, -1],
            ['ps', 24, -2],
            ['renaissance', 78, 3],
            ['lr', 56, -1],
            ['les-ecologistes', 59, -2],
            ['lr', 61, -1],
            ['nouvelle-energie', 61, -2],
            ['udr', 22, -2],
            ['udr', 58, 1],
          ];

          const affected = new Set();
          const audit = [];
          for (const [partyId, questionId, newValue] of changes) {
            const party = byId.get(partyId);
            const idx = qIndex.get(questionId);
            if (!party) throw new Error(`Unknown party ${partyId}`);
            if (idx === undefined) throw new Error(`Unknown question Q${questionId}`);
            const oldValue = party.responses[idx];
            party.responses[idx] = newValue;

            const justification = party.justifications[idx] || '';
            const colon = justification.indexOf(':');
            const body = colon >= 0 ? justification.slice(colon + 1).trim() : justification.trim();
            party.justifications[idx] = `${labelFor(newValue)} : ${body || 'codage mis à jour.'}`;

            affected.add(partyId);
            audit.push(`${party.name} Q${questionId}: ${oldValue} -> ${newValue} (responses[${idx}])`);
          }

          for (const partyId of affected) {
            const party = byId.get(partyId);
            const scores = {};
            for (const axis of questionnaire.axes) {
              const key = axis.key;
              const den = 3 * questionnaire.questions.reduce(
                (sum, q) => sum + Math.abs(q.coefficients[key]), 0
              );
              const num = questionnaire.questions.reduce(
                (sum, q, i) => sum + (party.responses[i] ?? 0) * q.coefficients[key], 0
              );
              scores[key] = den ? 10 * num / den : 0;
            }
            party.axisScores = scores;
          }

          const output = '// Profils documentés des partis politiques français.\nconst PARTIES_DATA = ' + JSON.stringify(parties, null, 2) + ';\n';
          fs.writeFileSync('data/parties.js', output, 'utf8');

          console.log('Applied changes:');
          for (const line of audit) console.log(`- ${line}`);
          console.log('Recalculated parties:', [...affected].join(', '));
          for (const partyId of affected) {
            console.log(`${partyId} axisScores=${JSON.stringify(byId.get(partyId).axisScores)}`);
          }
          NODE

      - name: Validate data
        shell: bash
        run: |
          node scripts/validate-data.js
          git diff --check

      - name: Commit updated parties.js
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parties.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update party responses and axis scores"
          git push origin HEAD:update-parties-scores-2026-08-09
