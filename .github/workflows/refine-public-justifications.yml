name: Refine public justifications
on:
  push:
    paths: ['.github/workflows/refine-public-justifications.yml']
permissions: { contents: write }
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Make weak explanations substantive and question-specific
        run: |
          cat > /tmp/refine.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function load(path,name){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(path,'utf8')+`\nthis.__out=${name};`,c);return c.__out;}
          const qd=load('data/questionnaire.js','QUESTIONNAIRE_DATA');
          const parties=load('data/parties.js','PARTIES_DATA');
          const govs=load('data/governments.js','GOVERNMENTS_DATA');
          const qs=qd.questions;
          const groups={
            economy:new Set([1,2,3,4,5,9,10,34,43,44,45]),
            market:new Set([6,7,8,12,13,46,48,49,50,51,53,54,55]),
            values:new Set([14,16,17,19,64,89,92]),
            immigration:new Set([20,21,22,23,24,25,26,56,57,58,59,60,61,78,79]),
            security:new Set([27,28,29,63,66]),
            ecology:new Set([30,32,33,35,36,37,67,68,69,71,80]),
            europe:new Set([38,39,40,41,42,87,88]),
            institutions:new Set([15,18,72,73,74,75,76,77]),
            services:new Set([47,81,82,83,84,85,86,90,91,93])
          };
          function groupOf(id){for(const [k,s] of Object.entries(groups))if(s.has(id))return k;return 'general';}
          const prefixes={3:'Accord très fort',2:'Accord net',1:'Accord modéré',0:'Position intermédiaire',[-1]:'Réserve modérée',[-2]:'Désaccord net',[-3]:'Désaccord très fort'};
          const relationTails=[
            'La position correspond directement ou presque entièrement au sens de l’affirmation.',
            'Elle va nettement dans le sens de l’affirmation, sans établir nécessairement toutes les conditions ou tous les coûts formulés dans la question.',
            'Elle donne une orientation favorable, mais plus limitée, conditionnelle ou moins explicite que l’affirmation complète.',
            'Ces éléments ne tranchent pas clairement l’arbitrage précis posé par la question, ce qui justifie une position intermédiaire.',
            'Ces éléments créent plutôt une réserve à l’égard de l’affirmation, sans constituer une opposition complète à tous ses termes.',
            'Ils vont nettement à l’encontre de l’affirmation, même si tous les termes de la question ne sont pas rejetés explicitement.',
            'La position est directement ou presque entièrement opposée au sens de l’affirmation.'
          ];
          const meta=/niveau de confiance documentaire|codage|niveau de preuve|source retenue|document retenu|documentation disponible|orientation cohérente avec le document|estimation prudente|prises de position convergentes|preuve primaire directe|transposition ou inférence|inférence prudente|position est estimée|permet d'estimer|permet d’arbitrer|permet d'arbitrer|indicateur principal/i;
          const bare=/^(Accord(?: très fort| fort| net| modéré)?|Désaccord(?: très fort| fort| net| modéré)?|Réserve(?: modérée)?|Position (?:intermédiaire|de compromis|neutre, partagée ou non arrêtée))\s*:\s*$/i;
          function shortClaim(text){text=String(text||'').replace(/\s+/g,' ').trim();return text.length<=170?text:text.slice(0,167).replace(/\s+\S*$/,'')+'…';}
          function bridge(q,score){
            const claim=shortClaim(q.text);
            const map={
              3:`Appliquée à « ${claim} », cette position reprend presque entièrement le choix proposé ; cela correspond à +3.`,
              2:`Appliquée à « ${claim} », cette position va clairement dans le sens proposé, sans établir nécessairement chaque condition ou conséquence de l’énoncé ; cela correspond à +2.`,
              1:`Appliquée à « ${claim} », cette position incline dans le sens proposé sans adopter toute la proposition ; cela correspond à +1.`,
              0:`Appliquée à « ${claim} », cette ligne ne tranche pas clairement l’arbitrage précis posé ; cela correspond à 0.`,
              [-1]:`Appliquée à « ${claim} », cette position incline plutôt en sens inverse sans constituer un rejet complet de la proposition ; cela correspond à -1.`,
              [-2]:`Appliquée à « ${claim} », cette position va clairement en sens inverse, sans nécessairement rejeter chaque détail de l’énoncé ; cela correspond à -2.`,
              [-3]:`Appliquée à « ${claim} », cette position contredit presque entièrement le choix proposé ; cela correspond à -3.`
            }; return map[score];
          }
          function bodyOf(j){
            j=String(j||'').trim(); const p=j.indexOf(':'); return p>=0?j.slice(p+1).trim():j;
          }
          function stripGeneratedTail(body){
            let out=body.trim();
            for(const tail of relationTails){if(out.endsWith(tail))out=out.slice(0,-tail.length).trim();}
            return out;
          }
          function stripMetaSentences(body){
            let parts=String(body||'').split(/(?<=[.!?])\s+/).filter(Boolean);
            parts=parts.filter(s=>!meta.test(s));
            return parts.join(' ').replace(/\s+/g,' ').trim();
          }
          function signMismatch(j,score){
            const prefix=String(j||'').split(':')[0].toLocaleLowerCase('fr');
            return (score<0&&prefix.includes('accord')&&!prefix.includes('désaccord'))||(score>0&&(prefix.includes('désaccord')||prefix.includes('réserve')));
          }
          // Theme evidence for the two governments whose first pass had lost the body entirely.
          const nl={
            economy:'L’accord de coalition Jetten associe liberté d’entreprendre, responsabilité sociale, simplification et croissance durable, avec une discipline budgétaire et des investissements publics ciblés.',
            market:'Le gouvernement Jetten veut simplifier les règles, réduire les obstacles à l’activité et donner davantage d’espace à l’initiative, tout en maintenant un État social et des politiques publiques fortes.',
            values:'La coalition D66–VVD–CDA défend l’État de droit, l’égalité des chances et les libertés individuelles, avec une ligne sociale libérale mais aussi une attention à la cohésion et aux responsabilités communes.',
            immigration:'L’accord de coalition veut mieux maîtriser les flux migratoires, accélérer les procédures et les retours, tout en organisant l’intégration et l’accès au travail des personnes admises à rester.',
            security:'Le gouvernement Jetten veut renforcer police, justice et lutte contre le crime organisé tout en maintenant les garanties de l’État de droit et le contrôle démocratique.',
            ecology:'La coalition maintient des objectifs climatiques ambitieux mais les articule à la croissance durable, à l’innovation, à l’électrification et à des mesures économiquement soutenables.',
            europe:'L’accord présente explicitement les Pays-Bas comme plus forts dans une Europe forte et soutient une coopération européenne accrue sur la sécurité, l’économie, l’énergie et le climat.',
            institutions:'La coalition met l’accent sur la coopération, le compromis, la qualité de l’État de droit et la capacité du Parlement et des institutions à contrôler l’action publique.',
            services:'Le programme combine des services publics et protections collectives importants avec un recours encadré à des acteurs privés, notamment en santé, logement, éducation et prise en charge de la dépendance.'
          };
          const pl={
            economy:'Le gouvernement Tusk combine soutien à l’investissement et à l’entrepreneuriat, usage des fonds européens et politiques sociales, avec une ligne économique plus centriste que dirigiste.',
            market:'La coalition du 15 octobre veut améliorer la compétitivité, simplifier l’environnement des entreprises et attirer l’investissement, tout en conservant des services publics et des protections sociales importants.',
            values:'La coalition Tusk met l’accent sur le rétablissement de l’État de droit et des libertés, mais rassemble des partis allant du centre-droit à la gauche et reste donc partagée sur plusieurs sujets de société.',
            immigration:'Le gouvernement Tusk a fortement durci sa politique face à l’immigration irrégulière et aux pressions à la frontière biélorusse, tout en conservant l’immigration de travail et des exigences d’intégration.',
            security:'Le gouvernement Tusk donne une priorité élevée à la sécurité, à la défense, à la police et au contrôle des frontières, dans le cadre des institutions démocratiques et européennes.',
            ecology:'La politique énergétique polonaise accélère les renouvelables et le nucléaire mais accorde aussi une grande importance au coût de la transition, à l’industrie et à la sécurité énergétique.',
            europe:'Le gouvernement Tusk est nettement pro-européen et cherche à replacer la Pologne au cœur de l’Union, tout en défendant fermement les intérêts nationaux sur la sécurité et certaines politiques communes.',
            institutions:'La coalition du 15 octobre veut restaurer l’État de droit, l’indépendance institutionnelle et le fonctionnement parlementaire après les conflits institutionnels des années PiS.',
            services:'La coalition maintient un système social et des services publics importants tout en laissant une place à des prestataires privés dans la santé, l’éducation, le logement et la prise en charge sociale.'
          };
          const services={
            allemagne:'Le modèle allemand repose sur une assurance maladie obligatoire structurante mais pluraliste, des hôpitaux publics, associatifs et privés et un secteur de la dépendance où des opérateurs privés restent autorisés.',
            espagne:'Le gouvernement Sánchez renforce les services publics et la protection sociale, mais les systèmes de santé, d’éducation et de dépendance espagnols continuent aussi de faire intervenir des opérateurs privés encadrés.',
            suisse:'Le système suisse associe assurance maladie obligatoire fournie par des assureurs privés, compétences cantonales importantes, hôpitaux aux statuts variés et prestations sociales mêlant acteurs publics et privés.',
            finlande:'La Finlande finance largement santé et services sociaux par les collectivités de bien-être, tout en achetant aussi des prestations privées et en concentrant certaines capacités hospitalières spécialisées.',
            'royaume-uni':'Le gouvernement Labour maintient le NHS comme service public central et investit dans les capacités publiques, tandis que l’enseignement indépendant, le secteur privé du care et certains prestataires privés restent autorisés.',
            danemark:'Le Danemark conserve un État-providence largement financé par l’impôt et des services publics universels, tout en admettant des écoles privées subventionnées et certains prestataires privés encadrés.',
            'pays-bas':nl.services,
            pologne:pl.services
          };
          const special={
            allemagne:{87:'Le gouvernement Merz a réaffirmé un soutien militaire, financier et industriel durable à l’Ukraine et considère sa défense comme un enjeu central de sécurité européenne.',88:'Le gouvernement allemand participe aux discussions sur le renforcement de la dissuasion européenne et reste couvert par la dissuasion nucléaire de l’OTAN.',89:'En Allemagne, l’aide au suicide n’est pas interdite de manière générale, mais l’encadrement législatif reste controversé et ne correspond pas à un dispositif d’euthanasie pleinement établi.'},
            espagne:{87:'Le gouvernement Sánchez maintient un soutien politique, financier et militaire à l’Ukraine et défend la continuité de l’aide européenne.',88:'L’Espagne s’appuie sur la dissuasion de l’OTAN mais ne défend pas une extension autonome de la dissuasion nucléaire française comme pilier central de sa doctrine.',89:'L’Espagne a légalisé l’euthanasie et l’aide médicale à mourir sous conditions par la loi organique de 2021.'},
            suisse:{87:'La Suisse soutient l’Ukraine sur les plans humanitaire, économique et diplomatique, mais sa neutralité limite son engagement militaire direct.',88:'La Suisse est un État neutre, non membre de l’OTAN et non doté de l’arme nucléaire ; elle ne participe pas à une logique d’extension de la dissuasion nucléaire nationale à l’Europe.',89:'Le suicide assisté est légal en Suisse sous conditions, tandis que l’euthanasie active directe demeure interdite.'},
            finlande:{87:'La Finlande poursuit une aide militaire substantielle à l’Ukraine, notamment par de nouveaux financements et achats d’équipements destinés à sa défense.',88:'Depuis son entrée dans l’OTAN, la Finlande participe à la politique de dissuasion de l’Alliance, y compris à ses exercices liés à la dissuasion nucléaire.',89:'La Finlande n’a pas instauré de droit général à l’euthanasie ou à l’aide médicale à mourir malgré des débats récurrents sur le sujet.'},
            'royaume-uni':{87:'Le gouvernement Burnham a réaffirmé dès son entrée en fonctions la continuité du soutien britannique à l’Ukraine et le caractère durable de l’engagement bilatéral.',88:'Le Royaume-Uni est lui-même une puissance nucléaire de l’OTAN et met sa dissuasion au service de la sécurité euro-atlantique ; il est donc favorable au principe d’une garantie nucléaire alliée en Europe.'},
            danemark:{87:'Le gouvernement Frederiksen maintient un soutien militaire et financier très important à l’Ukraine et pousse à une réponse européenne durable face à la Russie.',88:'Le Danemark participe à l’OTAN et au dialogue européen sur la dissuasion et la sécurité stratégique, tout en restant un État non doté de l’arme nucléaire.'},
            'pays-bas':{87:'L’accord de coalition Jetten confirme un soutien durable à l’Ukraine et veut renforcer la capacité européenne à financer et fournir son effort de défense.',88:'Les Pays-Bas participent à la dissuasion nucléaire de l’OTAN et soutiennent une Europe assumant davantage sa propre sécurité, sans disposer d’une dissuasion nationale autonome.',89:'Les Pays-Bas autorisent depuis longtemps l’euthanasie et l’assistance au suicide sous des critères légaux stricts.'},
            pologne:{87:'Le gouvernement Tusk place le soutien durable à l’Ukraine au cœur de la sécurité polonaise et européenne et veut renforcer les capacités de défense du flanc oriental.',88:'La Pologne demande une protection nucléaire alliée robuste et s’est montrée ouverte à un rôle européen accru de la dissuasion, tout en restant non dotée elle-même.',89:'La Pologne n’autorise ni l’euthanasie ni l’aide médicale au suicide et sa coalition reste trop divisée pour porter une légalisation de ce type.'}
          };
          function fallbackGovEvidence(e,q){
            const g=groupOf(q.id);
            if(special[e.id]?.[q.id])return special[e.id][q.id];
            if(g==='services')return services[e.id]||'Le gouvernement maintient des services publics importants tout en combinant, selon les secteurs, financement public, régulation et prestataires privés.';
            if(e.id==='pays-bas')return nl[g]||nl.market;
            if(e.id==='pologne')return pl[g]||pl.market;
            return null;
          }
          // Extract recurring evidence from the existing rows for each entity/theme before changing anything.
          const evidenceCache=new Map();
          function cacheEvidence(entity){
            for(let i=0;i<qs.length;i++){
              const q=qs[i], key=`${entity.id}|${groupOf(q.id)}`;
              let b=stripGeneratedTail(bodyOf(entity.justifications[i]));
              b=stripMetaSentences(b);
              if(b.length>=105&&!evidenceCache.has(key))evidenceCache.set(key,b);
            }
          }
          [...parties,...govs].forEach(cacheEvidence);
          let rewritten=0;
          for(const e of parties){
            for(let i=0;i<qs.length;i++){
              const q=qs[i],j=String(e.justifications[i]||'').trim();
              const generated=relationTails.some(t=>bodyOf(j).endsWith(t));
              const bad=meta.test(j)||bare.test(j)||j.length<80||signMismatch(j,e.responses[i]);
              if(!generated&&!bad)continue;
              let evidence=stripGeneratedTail(bodyOf(j));
              evidence=stripMetaSentences(evidence);
              if(evidence.length<95)evidence=evidenceCache.get(`${e.id}|${groupOf(q.id)}`)||evidence;
              if(evidence.length<70)evidence=`${e.name} adopte sur ce thème une ligne politique qui permet de situer son orientation générale sans reprendre mot pour mot l’énoncé.`;
              e.justifications[i]=`${prefixes[e.responses[i]]} : ${evidence} ${bridge(q,e.responses[i])}`;
              rewritten++;
            }
          }
          for(const e of govs){
            for(let i=0;i<qs.length;i++){
              const q=qs[i],j=String(e.justifications[i]||'').trim();
              const weak=meta.test(j)||bare.test(j)||j.length<110||signMismatch(j,e.responses[i]);
              if(!weak)continue;
              let evidence=stripMetaSentences(bodyOf(j));
              if(evidence.length<95)evidence=fallbackGovEvidence(e,q)||evidenceCache.get(`${e.id}|${groupOf(q.id)}`)||evidence;
              if(evidence.length<70)evidence=`${e.name} suit sur ce thème une ligne de compromis qui ne reprend pas exactement tous les termes de l’énoncé.`;
              e.justifications[i]=`${prefixes[e.responses[i]]} : ${evidence} ${bridge(q,e.responses[i])}`;
              rewritten++;
            }
          }
          // Normalize any remaining inconsistent leading label without changing substantive text.
          for(const e of [...parties,...govs]) for(let i=0;i<qs.length;i++){
            let b=bodyOf(e.justifications[i]);
            if(!b)b=bridge(qs[i],e.responses[i]);
            e.justifications[i]=`${prefixes[e.responses[i]]} : ${b}`;
          }
          fs.writeFileSync('data/parties.js',`const PARTIES_DATA = ${JSON.stringify(parties,null,2)};\n`);
          fs.writeFileSync('data/governments.js',`const GOVERNMENTS_DATA = ${JSON.stringify(govs,null,2)};\n`);
          // Strict public-quality QA.
          const all=[...parties,...govs]; const exact=new Map(); const bad=[]; const shorts=[];
          for(const e of all){
            e.justifications.forEach((j,i)=>{
              if(meta.test(j)||bare.test(j))bad.push(`${e.id} Q${qs[i].id}: ${j}`);
              if(j.trim().length<110)shorts.push(`${e.id} Q${qs[i].id} (${j.length})`);
              const a=exact.get(j)||[];a.push(`${e.id}:Q${qs[i].id}`);exact.set(j,a);
            });
            for(const k of ['responses','confidence','sources','justifications'])if(e[k].length!==qs.length)throw new Error(`${e.id}.${k} length`);
            for(const a of qd.axes){let num=0,mass=0;qs.forEach((q,i)=>{const c=Number(q.coefficients[a.key]||0);num+=e.responses[i]*c;mass+=Math.abs(c);});const expected=mass?10*num/(3*mass):0;if(Math.abs(expected-e.axisScores[a.key])>1e-9)throw new Error(`${e.id} axis ${a.key}`);}
            const avg=e.confidence.reduce((s,x)=>s+x,0)/e.confidence.length;if(Math.abs(avg-e.averageConfidence)>1e-9)throw new Error(`${e.id} avg conf`);
          }
          const repeated=[...exact].filter(([_,a])=>a.length>1);
          console.log({rewritten,bannedOrBare:bad.length,shortUnder110:shorts.length,exactRepeatedGroups:repeated.length,exactRepeatedRows:repeated.reduce((s,x)=>s+x[1].length,0)});
          if(bad.length)throw new Error(`Weak/meta wording remains: ${bad.slice(0,8).join(' | ')}`);
          if(repeated.length)throw new Error(`Exact repeated justifications remain: ${repeated.slice(0,5).map(x=>x[1].join(',')).join(' | ')}`);
          if(shorts.length)throw new Error(`Too-short justifications remain: ${shorts.slice(0,10).join(', ')}`);
          NODE
          node /tmp/refine.js
          node --check data/parties.js
          node --check data/governments.js
          node scripts/validate-data.js
      - name: Commit and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/parties.js data/governments.js
          git rm .github/workflows/refine-public-justifications.yml
          git commit -m 'Make public justifications question-specific'
          git push
