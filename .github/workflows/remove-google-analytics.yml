name: Remove Google Analytics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-google-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-google-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove Google Analytics and update privacy policy
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import json

          # 1) Homepage: remove Google Tag Manager (used for Google Analytics),
          # while deliberately keeping AdSense and Vercel Web Analytics.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(
              r'\s*<!-- Google Tag Manager -->\s*<script>.*?</script>\s*<!-- End Google Tag Manager -->\s*',
              '\n',
              index,
              count=1,
              flags=re.S,
          )
          index = re.sub(
              r'\s*<!-- Google Tag Manager \(noscript\) -->\s*<noscript><iframe.*?</iframe></noscript>\s*<!-- End Google Tag Manager \(noscript\) -->\s*',
              '\n',
              index,
              count=1,
              flags=re.S,
          )
          if 'GTM-N7HJVRJQ' in index or 'googletagmanager.com' in index:
              raise SystemExit('Google Tag Manager remained in index.html')
          if '/analytics.js' not in index:
              raise SystemExit('Vercel Analytics loader was unexpectedly removed')
          if 'ca-pub-6201499207692945' not in index:
              raise SystemExit('AdSense was unexpectedly removed')
          index_path.write_text(index, encoding='utf-8')

          # 2) CSP: remove only Google Analytics / Tag Manager endpoints.
          # Keep Vercel Analytics and Google advertising/CMP endpoints.
          vercel_path = Path('vercel.json')
          data = json.loads(vercel_path.read_text(encoding='utf-8'))
          for rule in data.get('headers', []):
              for header in rule.get('headers', []):
                  if header.get('key') == 'Content-Security-Policy-Report-Only':
                      csp = header['value']
                      for token in [
                          ' https://www.googletagmanager.com',
                          ' https://*.google-analytics.com',
                          ' https://*.analytics.google.com',
                      ]:
                          csp = csp.replace(token, '')
                      header['value'] = csp
          rendered = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          if 'googletagmanager.com' in rendered or 'google-analytics.com' in rendered or 'analytics.google.com' in rendered:
              raise SystemExit('Analytics/GTM domain remained in vercel.json')
          if 'vitals.vercel-analytics.com' not in rendered or 'va.vercel-scripts.com' not in rendered:
              raise SystemExit('Vercel Analytics CSP endpoints were unexpectedly removed')
          if 'googlesyndication.com' not in rendered or 'doubleclick.net' not in rendered:
              raise SystemExit('Advertising CSP endpoints were unexpectedly removed')
          vercel_path.write_text(rendered, encoding='utf-8')

          # 3) Privacy policy: describe the new current state.
          privacy_path = Path('confidentialite.html')
          privacy = privacy_path.read_text(encoding='utf-8')
          privacy = privacy.replace('Dernière mise à jour : 16/08/2026', 'Dernière mise à jour : 21/08/2026')
          privacy = privacy.replace(
              'envoyés ni à Vercel Web Analytics, ni à Google Analytics, ni à Google\n      AdSense.',
              'envoyés ni à Vercel Web Analytics, ni à Google AdSense.'
          )

          analytics_section = re.compile(
              r'\n\s*<h3>Google Tag Manager et Google Analytics</h3>.*?'
              r'La base légale des traceurs Analytics\n\s*soumis au consentement est le consentement de l’utilisateur\.\n\s*</p>\n',
              re.S,
          )
          replacement = '''\n    <p>\n      <strong>Google Analytics et Google Tag Manager ne sont pas utilisés pour\n      la mesure d’audience du site.</strong> La mesure d’audience conservée est\n      assurée par Vercel Web Analytics selon les modalités décrites ci-dessus.\n    </p>\n'''
          privacy, n = analytics_section.subn(replacement, privacy, count=1)
          if n != 1:
              raise SystemExit('Could not replace Google Analytics privacy section')

          privacy = privacy.replace(
              '<td>Google Analytics et AdSense</td>\n            <td>Mesure d’audience et publicité selon la configuration des services</td>\n            <td>Consentement lorsque celui-ci est requis</td>',
              '<td>Google AdSense</td>\n            <td>Publicité, mesure publicitaire et prévention de la fraude selon la configuration du service</td>\n            <td>Consentement lorsque celui-ci est requis</td>'
          )
          privacy = privacy.replace(
              'cookies de Google Analytics ou de Google AdSense dépendent du chargement\n      des services et des choix exprimés dans le message Google.',
              'cookies ou technologies similaires de Google AdSense dépendent du chargement\n      du service et des choix exprimés dans le message Google.'
          )
          privacy = privacy.replace(
              'concernées pour Tag Manager, Analytics, AdSense et Gemini.',
              'concernées pour AdSense et Gemini.'
          )
          privacy = re.sub(
              r'\n\s*<li>Google Analytics permet une conservation des données utilisateur et d’événement configurée sur 2 ou 14 mois pour une propriété standard ; la durée applicable dépend du réglage de la propriété\.</li>',
              '',
              privacy,
              count=1,
          )
          privacy_path.write_text(privacy, encoding='utf-8')

          # 4) Keep sitemap metadata accurate after the substantive privacy update.
          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          sitemap = re.sub(
              r'(<loc>https://www\.frenchpoliticalcompass\.com/confidentialite\.html</loc>\s*<lastmod>)[^<]+(</lastmod>)',
              r'\g<1>2026-08-21\g<2>',
              sitemap,
              count=1,
          )
          sitemap_path.write_text(sitemap, encoding='utf-8')

          generator_path = Path('scripts/generate-seo-pages.mjs')
          generator = generator_path.read_text(encoding='utf-8')
          generator = re.sub(
              r"\['/confidentialite\.html', '\d{4}-\d{2}-\d{2}'\]",
              "['/confidentialite.html', '2026-08-21']",
              generator,
              count=1,
          )
          generator_path.write_text(generator, encoding='utf-8')

          # Final safeguards.
          index_now = index_path.read_text(encoding='utf-8')
          privacy_now = privacy_path.read_text(encoding='utf-8')
          if 'GTM-N7HJVRJQ' in index_now or 'googletagmanager.com' in index_now:
              raise SystemExit('GTM still present on homepage')
          if '<h3>Google Tag Manager et Google Analytics</h3>' in privacy_now:
              raise SystemExit('Old Analytics privacy section still present')
          if '/analytics.js' not in index_now:
              raise SystemExit('Vercel Analytics no longer loaded')
          PY

          npm test

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/remove-google-analytics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Google Analytics and update privacy policy"
          git push origin HEAD:main
