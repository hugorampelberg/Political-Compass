name: Refine question-specific rationales
on:
  push:
    paths: ['.github/workflows/refine-question-specific-rationales.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Replace generic fallbacks with policy-specific rationales
        run: |
          cat > /tmp/refine.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function load(path,name){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(path,'utf8')+`\nthis.__out=${name};`,c);return c.__out;}
          const qd=load('data/questionnaire.js','QUESTIONNAIRE_DATA'), qs=qd.questions;
          const parties=load('data/parties.js','PARTIES_DATA'), govs=load('data/governments.js','GOVERNMENTS_DATA');
          const stance={
            1:'une baisse des prélèvements sur le travail et le capital accompagnée d’économies sur certaines dépenses publiques',
            2:'l’idée que des écarts économiques peuvent être légitimes lorsqu’ils résultent principalement du travail, du mérite ou de la prise de risque',
            3:'une fiscalité plus forte sur les hauts revenus et les gros patrimoines afin de réduire les inégalités',
            4:'un plafonnement légal de l’écart entre la rémunération des dirigeants et celle des salariés les moins payés',
            5:'une hausse significative du salaire minimum',
            6:'une place plus importante du privé dans la fourniture de biens et services, y compris dans certains secteurs essentiels',
            7:'la possibilité pour l’État de prendre le contrôle d’une entreprise privée lorsqu’une activité stratégique l’exige',
            8:'la concurrence comme outil prioritaire pour améliorer prix, qualité et innovation plutôt qu’un encadrement réglementaire détaillé',
            9:'une réduction de certaines dépenses ou politiques sociales afin de rétablir les comptes publics',
            10:'un niveau élevé de protection sociale financé au besoin par une fiscalité importante',
            12:'une intervention publique renforcée lorsque le marché produit des résultats socialement jugés indésirables',
            13:'davantage de liberté individuelle dans l’utilisation de l’argent consacré à la retraite, à la santé ou à la protection sociale plutôt que des dispositifs obligatoires',
            14:'une large acceptation des modes de vie qui s’éloignent des normes traditionnelles',
            15:'la possibilité pour l’exécutif de faire adopter un budget sans vote parlementaire en l’absence de majorité stable',
            16:'la possibilité de limiter certaines libertés individuelles lorsque cela est jugé nécessaire pour réduire les inégalités',
            17:'des politiques publiques destinées à corriger activement les discriminations historiques ou structurelles',
            18:'un pouvoir normatif plus important des régions afin qu’elles puissent appliquer des règles économiques, sociales ou environnementales différentes',
            19:'la préservation de certaines traditions et valeurs culturelles même lorsqu’elles évoluent moins vite que le reste de la société',
            20:'une réduction du volume global d’immigration accueilli chaque année',
            21:'l’idée que l’immigration économique apporte globalement un bénéfice à l’économie',
            22:'l’égalité d’accès aux prestations sociales et au logement social entre citoyens et étrangers légalement installés de longue date, sans priorité liée à la nationalité',
            23:'un durcissement des conditions d’accès à la nationalité',
            24:'une politique d’expulsion nettement plus stricte pour les étrangers condamnés pour des crimes graves',
            25:'la possibilité de limiter l’immigration pour préserver la cohésion culturelle même lorsqu’elle est économiquement utile',
            26:'un accueil accru des réfugiés fuyant guerre ou persécution même lorsqu’il entraîne un coût économique',
            27:'des peines de prison effectives plus sévères même au prix d’une hausse importante de la population carcérale',
            28:'la priorité donnée à la prévention et à la réinsertion plutôt qu’au durcissement des sanctions',
            29:'des pouvoirs policiers plus étendus pour lutter contre la criminalité même si certaines libertés sont davantage contrôlées',
            30:'l’interdiction d’importer des produits agricoles fabriqués selon des normes interdites aux producteurs nationaux, y compris au prix d’une hausse ou d’une réduction de l’offre bon marché',
            32:'la priorité climatique même lorsqu’elle réduit la croissance économique à court terme',
            33:'une hausse importante du prix des énergies fossiles pour accélérer la transition',
            34:'un transfert d’une partie du financement de la protection sociale des cotisations sur les salaires vers la TVA afin de réduire le coût du travail, malgré la hausse des prix à la consommation',
            35:'des politiques écologiques reposant d’abord sur les signaux-prix et mécanismes de marché plutôt que sur des interdictions',
            36:'l’interdiction de produits ou comportements très polluants même lorsqu’ils restent demandés par les consommateurs',
            37:'une contribution financière prépondérante des pays riches à la transition écologique mondiale',
            38:'un transfert supplémentaire de compétences nationales vers l’Union européenne',
            39:'la préservation maximale de la souveraineté nationale même si cela réduit l’influence exercée au niveau européen',
            40:'un jugement globalement positif sur l’euro malgré la perte d’instruments monétaires nationaux',
            41:'davantage de règles européennes communes imposables aux États membres',
            42:'la possibilité de désobéir à certaines règles européennes lorsque les intérêts économiques nationaux l’exigent',
            43:'la suppression de l’IFI et de toute surtaxation spécifique du patrimoine immobilier',
            44:'une taxation accrue des héritages au-delà d’un seuil de patrimoine transmis',
            45:'le maintien d’une imposition nationale sur le patrimoine mondial des très grandes fortunes même après leur départ du pays',
            46:'des sanctions significatives sur les allocations chômage après plusieurs refus d’emplois raisonnablement adaptés',
            47:'une intervention financière durable de l’État pour limiter l’écart de prix des produits essentiels entre l’outre-mer et le territoire continental',
            48:'un assouplissement de la protection associée au contrat de travail permanent afin de faciliter les embauches et remplacements',
            49:'un système de retraite combinant progressivement répartition et capitalisation',
            50:'une indexation de l’âge légal de départ à la retraite sur l’espérance de vie',
            51:'un conditionnement important des prestations sociales à la durée de cotisation ou de participation au marché du travail',
            53:'des restrictions sur dividendes et rémunérations dirigeantes pour les entreprises recevant des aides publiques massives',
            54:'l’utilisation du pouvoir d’actionnaire de l’État pour orienter les grandes entreprises vers des objectifs industriels de long terme',
            55:'une forte réduction des normes administratives sur les entreprises même si certaines protections sociales ou environnementales sont assouplies',
            56:'la régularisation possible d’un étranger sans titre durablement inséré par le travail et sans condamnation pénale',
            57:'une limitation importante de l’accès aux prestations sociales pendant les premières années suivant l’arrivée d’un immigré',
            58:'une priorité donnée à l’immigration économique qualifiée, avec moins d’entrées peu qualifiées si nécessaire',
            59:'l’acquisition automatique de la nationalité à la majorité pour une personne née et ayant grandi dans le pays de parents étrangers, sans exigence particulière d’attachement',
            60:'la possibilité de refuser l’entrée à un candidat à l’immigration légale lorsqu’un refus d’intégration culturelle est fortement probable',
            61:'l’acceptation de pratiques culturelles ou religieuses très différentes de celles de la majorité dès lors que la loi est respectée',
            63:'la surveillance préventive de personnes présentant un risque terroriste sérieux même sans éléments suffisants pour engager des poursuites',
            64:'une protection large des propos offensants par la liberté d’expression tant qu’ils n’appellent ni à la violence ni à une infraction',
            66:'la possibilité pour la police d’utiliser une arme à feu contre un conducteur en fuite même lorsque le danger immédiat pour la vie des policiers n’est pas établi',
            67:'le maintien d’une taxe carbone efficace même lorsqu’elle réduit le pouvoir d’achat des ménages modestes, à condition de les compenser',
            68:'l’interdiction progressive de la vente de voitures thermiques même si elle renchérit temporairement le prix moyen des véhicules',
            69:'la priorité donnée au nucléaire même si cela réduit certains investissements dans les énergies renouvelables',
            71:'la poursuite d’une forte réduction nationale des émissions même si elle coûte plusieurs points de PIB et que les autres pays ne font pas d’effort comparable',
            72:'un transfert de certaines décisions économiques complexes vers des institutions indépendantes d’experts',
            73:'la capacité d’un gouvernement à prendre une décision économiquement jugée nécessaire malgré une forte impopularité immédiate',
            74:'un recours beaucoup plus fréquent au référendum, y compris sur des sujets techniquement complexes',
            75:'l’attribution d’un poids politique supérieur aux citoyens démontrant davantage de connaissances institutionnelles ou économiques',
            76:'un renforcement des pouvoirs du président afin qu’il puisse appliquer son programme avec moins de blocages parlementaires',
            77:'la proportionnelle intégrale même si elle augmente le recours aux coalitions et le risque d’instabilité gouvernementale',
            78:'le conditionnement du séjour durable à des efforts concrets d’apprentissage du français, de compréhension des règles et de participation à la vie collective',
            79:'une explication principalement sociale et économique, plutôt que culturelle, des écarts de délinquance observés',
            80:'l’interdiction nationale d’un produit agricole jugé trop polluant même lorsque les concurrents étrangers peuvent encore l’utiliser',
            81:'la limitation du conventionnement de nouveaux médecins dans les zones déjà bien dotées afin de favoriser leur installation dans les déserts médicaux',
            82:'le remboursement intégral des soins essentiels par l’assurance maladie publique avec un rôle fortement réduit des complémentaires',
            83:'la fermeture ou le regroupement de petites maternités et de certains services d’urgence afin de concentrer équipes et équipements',
            84:'davantage d’autonomie des chefs d’établissement pour recruter une partie des enseignants et participer à leur évaluation',
            85:'le conditionnement du financement public des établissements privés sous contrat à des objectifs mesurables de mixité sociale',
            86:'le pouvoir pour une commune d’interdire la location touristique régulière d’une résidence secondaire dans les zones où le logement manque',
            87:'le maintien d’une aide militaire et financière importante à l’Ukraine tant que son territoire reste occupé',
            88:'l’extension de la protection de la dissuasion nucléaire française aux partenaires européens tout en laissant la décision finale à la France',
            89:'l’accès à une aide médicale à mourir pour un majeur atteint d’une maladie grave et incurable avec souffrances insupportables, dans un cadre strict',
            90:'la disparition progressive des EHPAD gérés par des groupes privés lucratifs au profit d’acteurs publics ou non lucratifs',
            91:'des allocations familiales universelles dépendant du nombre d’enfants et non du revenu des parents',
            92:'l’interdiction des réseaux sociaux aux moins de 15 ans même avec l’accord parental',
            93:'la préférence des administrations publiques pour des modèles d’intelligence artificielle hébergés en Europe même s’ils sont momentanément plus chers ou moins performants'
          };
          const fallbackPattern=/les positions publiques de|les positions disponibles de|aucune position publique suffisamment précise|aucune prise de position publique n’a été trouvée/i;
          const label=s=>({3:'Accord très fort',2:'Accord net',1:'Accord modéré',0:'Position intermédiaire',[-1]:'Désaccord modéré',[-2]:'Désaccord net',[-3]:'Désaccord très fort'})[s];
          function name(e){return e.shortName||e.name}
          function rationale(e,q,score,conf){
            const s=stance[q.id]; if(!s) throw new Error(`Missing stance Q${q.id}`);
            if(score===0) return `Position intermédiaire : les positions de ${name(e)} combinent des éléments allant dans les deux sens sur ${s}, ou ne tranchent pas suffisamment ce point. Une note neutre est donc préférable à une extrapolation idéologique.`;
            if(score>0){
              if(score===3) return `${label(score)} : ${name(e)} soutient très clairement ${s}. Les mesures ou déclarations associées couvrent l’essentiel de l’arbitrage posé par la question, ce qui justifie une note maximale.`;
              if(score===2) return `${label(score)} : ${name(e)} se montre clairement favorable à ${s}. L’orientation est nette, mais au moins une condition, une conséquence ou le degré d’intensité formulé dans la question n’est pas repris de façon assez absolue pour retenir +3.`;
              return `${label(score)} : ${name(e)} va plutôt dans le sens de ${s}, mais la position est partielle, conditionnelle ou moins ambitieuse que l’énoncé ; cela justifie +1 plutôt qu’un accord plus marqué.`;
            }
            if(score===-3) return `${label(score)} : ${name(e)} s’oppose très clairement à ${s} et défend une orientation inverse sur l’essentiel de l’arbitrage ; -3 correspond donc à un rejet presque complet de l’affirmation.`;
            if(score===-2) return `${label(score)} : ${name(e)} est clairement opposé à ${s}. Le désaccord est net, mais tous les termes ou toutes les conséquences de la question ne sont pas nécessairement rejetés explicitement, d’où -2.`;
            return `${label(score)} : ${name(e)} se montre plutôt réservé ou défavorable à ${s}, sans opposition assez explicite ou générale pour aller au-delà de -1.`;
          }
          let changed=0;
          for(const e of [...parties,...govs])for(let i=0;i<qs.length;i++){
            if(!fallbackPattern.test(String(e.justifications[i]||'')))continue;
            e.justifications[i]=rationale(e,qs[i],e.responses[i],e.confidence[i]); changed++;
          }
          // Ensure the three manually researched Q2 rationales remain substantive and untouched by automation.
          const qi=qs.findIndex(q=>q.id===2);
          const ren=parties.find(e=>e.id==='renaissance'), dk=govs.find(e=>e.id==='danemark'), ch=govs.find(e=>e.id==='suisse');
          if(ren.responses[qi]!==2||dk.responses[qi]!==1||ch.responses[qi]!==2)throw new Error('Q2 overrides missing');
          if(!/mérite.*travail.*prise de risque/i.test(ren.justifications[qi]))throw new Error('Renaissance Q2 not specific');
          if(!/État-providence|redistributif/i.test(dk.justifications[qi]))throw new Error('Denmark Q2 not specific');
          if(!/liberté économique|marchés ouverts/i.test(ch.justifications[qi]))throw new Error('Swiss Q2 not specific');
          const bad=/niveau de confiance documentaire|réévalué indépendamment|codage fondé|codage cohérent|niveau de preuve|orientation cohérente avec le document officiel retenu|sources officielles et prises de position convergentes|estimation prudente|transposition ou inférence prudente|La convention économique 2025 de Renaissance.*Q2|Le programme combine baisse de l’impôt.*Q2/i;
          const leftovers=[];for(const e of [...parties,...govs])for(let i=0;i<qs.length;i++)if(bad.test(String(e.justifications[i]||'')))leftovers.push(`${e.id} Q${qs[i].id}`);
          if(leftovers.length)throw new Error('Bad public rationales remain: '+leftovers.slice(0,20).join(', '));
          const serialize=(n,d)=>`const ${n} = ${JSON.stringify(d,null,2)};\n`;
          fs.writeFileSync('data/parties.js',serialize('PARTIES_DATA',parties));
          fs.writeFileSync('data/governments.js',serialize('GOVERNMENTS_DATA',govs));
          console.log(`Refined ${changed} question-specific rationales`);
          NODE
          node /tmp/refine.js
          node --check data/parties.js
          node --check data/governments.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/parties.js data/governments.js
          git commit -m 'Refine weak rationales by question policy'
          git rm .github/workflows/refine-question-specific-rationales.yml
          git commit -m 'Remove temporary rationale workflow'
          git push
