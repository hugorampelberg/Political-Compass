name: Adjust Denmark Q40

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adjust Denmark Q40 and recalculate axes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          function loadConst(path, name) {
            const src = fs.readFileSync(path, 'utf8') + `\n;globalThis.__value = ${name};`;
            const ctx = {};
            vm.createContext(ctx);
            vm.runInContext(src, ctx);
            return ctx.__value;
          }
          const questionnaire = loadConst('data/questionnaire.js', 'QUESTIONNAIRE_DATA');
          const governments = loadConst('data/governments.js', 'GOVERNMENTS_DATA');
          const questions = questionnaire.questions;
          const idx = questions.findIndex(q => q.id === 40);
          if (idx < 0) throw new Error('Q40 not found');
          const denmark = governments.find(g => g.id === 'danemark');
          if (!denmark) throw new Error('Denmark not found');
          if (denmark.responses[idx] !== -3) throw new Error(`Expected Denmark Q40=-3, found ${denmark.responses[idx]}`);
          denmark.responses[idx] = -2;
          denmark.justifications[idx] = "Désaccord net : le Danemark conserve volontairement la couronne danoise et bénéficie d'une dérogation permanente à l'euro. Le choix de rester hors de la monnaie unique indique un désaccord clair avec l'idée que l'euro serait globalement bénéfique malgré la perte d'instruments nationaux, sans pour autant traduire une hostilité générale à l'intégration européenne.";
          const axes = ['economy','authority','europe','ecology','immigration','democracy'];
          for (const g of governments) {
            const scores = {};
            for (const axis of axes) {
              let numerator = 0, mass = 0;
              for (let i = 0; i < questions.length; i++) {
                const c = Number(questions[i].coefficients?.[axis] || 0);
                numerator += g.responses[i] * c;
                mass += Math.abs(c);
              }
              scores[axis] = mass ? 10 * numerator / (3 * mass) : 0;
            }
            g.axisScores = scores;
          }
          fs.writeFileSync('data/governments.js', `// Profils documentés des gouvernements et pays de comparaison.\nconst GOVERNMENTS_DATA = ${JSON.stringify(governments, null, 2)};\n`);
          console.log(`Denmark Q40=${denmark.responses[idx]}`);
          console.log(JSON.stringify(denmark.axisScores));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/governments.js
          git diff --cached --check
          git commit -m "Adjust Denmark euro score"
          git push
