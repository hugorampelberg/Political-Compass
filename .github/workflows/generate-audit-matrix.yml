name: Generate audit score matrix

on:
  push:
    branches:
      - audit/final-full-verification-2026-08-10
    paths:
      - '.github/workflows/generate-audit-matrix.yml'

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-full-verification-2026-08-10
          fetch-depth: 0
      - shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function load(path,name){const s=fs.readFileSync(path,'utf8');const c={};vm.runInNewContext(`${s}\nthis.v=${name};`,c);return c.v;}
          const q=load('data/questionnaire.js','QUESTIONNAIRE_DATA');
          const p=load('data/parties.js','PARTIES_DATA');
          const g=load('data/governments.js','GOVERNMENTS_DATA');
          const e=[...p,...g];
          const clean=x=>String(x??'').replace(/\t/g,' ').replace(/\r?\n/g,' ').trim();
          const rows=[];
          rows.push(['qid','theme','question',...e.flatMap(x=>[`${x.shortName}_score`,`${x.shortName}_conf`])].join('\t'));
          q.questions.forEach((qq,i)=>rows.push([qq.id,qq.theme,qq.text,...e.flatMap(x=>[x.responses[i],x.confidence[i]])].map(clean).join('\t')));
          fs.writeFileSync('audit/score-matrix.tsv',rows.join('\n')+'\n');
          NODE
      - shell: bash
        run: |
          rm .github/workflows/generate-audit-matrix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/score-matrix.tsv .github/workflows/generate-audit-matrix.yml
          git commit -m "Generate audit score matrix"
          git push origin HEAD:audit/final-full-verification-2026-08-10
