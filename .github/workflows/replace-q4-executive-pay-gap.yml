name: Replace Q4 with executive pay-gap question

on:
  push:
    paths:
      - '.github/scripts/replace-q4-executive-pay-gap.js'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Q4 replacement and recodings
        run: node .github/scripts/replace-q4-executive-pay-gap.js
      - name: Validate JavaScript syntax
        run: |
          node --check data/questionnaire.js
          node --check data/parties.js
          node --check data/governments.js
      - name: Validate Q4, entity codings and recalculated scores
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const c={}; vm.createContext(c);
          for (const p of ['data/questionnaire.js','data/parties.js','data/governments.js']) {
            vm.runInContext(fs.readFileSync(p,'utf8').replace(/^const /gm,'var '), c, {filename:p});
          }
          const q=c.QUESTIONNAIRE_DATA;
          const i=q.questions.findIndex(x=>x.id===4);
          if (i<0) throw new Error('Q4 missing');
          if (q.questions[i].text !== 'Les entreprises devraient être obligées de limiter l’écart entre la rémunération de leurs dirigeants et celle de leurs salariés les moins bien payés.') throw new Error('Q4 text incorrect');
          if (q.questions[i].coefficients.economy !== -0.7) throw new Error('Q4 coefficient changed');
          const masses={economy:23.4,authority:21.6,europe:6.2,ecology:8.5,immigration:11.1,democracy:7};
          for (const [axis,m] of Object.entries(masses)) if (Math.abs(q.axisMasses[axis]-m)>1e-9) throw new Error(`${axis} mass incorrect`);
          const expectedParties={lfi:3,pcf:3,'les-ecologistes':3,ps:3,renaissance:-3,modem:-1,horizons:-3,'france-humaniste':0,lr:-3,'nouvelle-energie':-3,udr:-3,rn:-2,reconquete:-3};
          const expectedGov={allemagne:0,espagne:1,suisse:-2,finlande:-2,'royaume-uni':0,danemark:0,'pays-bas':-1,pologne:0};
          for (const e of c.PARTIES_DATA) if (e.responses[i]!==expectedParties[e.id]) throw new Error(`${e.id} Q4 incorrect`);
          for (const e of c.GOVERNMENTS_DATA) if (e.responses[i]!==expectedGov[e.id]) throw new Error(`${e.id} Q4 incorrect`);
          const axes=q.axes.map(a=>a.key);
          for (const e of [...c.PARTIES_DATA,...c.GOVERNMENTS_DATA]) {
            for (const axis of axes) {
              let num=0,mass=0;
              q.questions.forEach((qq,j)=>{const x=qq.coefficients[axis]||0;num+=e.responses[j]*x;mass+=Math.abs(x);});
              const score=mass?10*num/(3*mass):0;
              if (Math.abs(e.axisScores[axis]-score)>1e-10) throw new Error(`${e.id} ${axis} stale`);
            }
            const avg=e.confidence.reduce((s,x)=>s+x,0)/e.confidence.length;
            if (Math.abs(e.averageConfidence-avg)>1e-12) throw new Error(`${e.id} averageConfidence stale`);
          }
          console.log('Validation passed');
          NODE
      - name: Commit Q4 replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questionnaire.js data/parties.js data/governments.js
          git diff --cached --quiet && exit 0
          git commit -m "Replace Q4 with executive pay-gap question"
          git push origin main
