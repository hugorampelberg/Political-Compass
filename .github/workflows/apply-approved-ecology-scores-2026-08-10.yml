name: Apply approved ecology score updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-ecology-scores-2026-08-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved ecology scores
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const context = {};
          vm.createContext(context);
          for (const path of ['data/questionnaire.js', 'data/parties.js']) {
            const source = fs.readFileSync(path, 'utf8');
            vm.runInContext(source.replace(/^const /gm, 'var '), context, { filename: path });
          }

          const questionnaire = context.QUESTIONNAIRE_DATA;
          const parties = context.PARTIES_DATA;
          const questionIndex = new Map(questionnaire.questions.map((q, i) => [q.id, i]));
          const original = JSON.parse(JSON.stringify(parties));

          const changes = [
            { shortName: 'LFI', q: 35, from: -2, to: -3,
              justification: "Désaccord fort : LFI privilégie la planification écologique, la réglementation et des interdictions ciblées plutôt qu'une politique reposant principalement sur les mécanismes de marché comme la taxe carbone." },
            { shortName: 'LFI', q: 67, from: 1, to: -1,
              justification: "Désaccord modéré : LFI refuse que la transition écologique se traduise par une hausse du coût de l'énergie supportée par les ménages ; la compensation ciblée prévue par la question atténue toutefois ce désaccord." },
            { shortName: 'PCF', q: 69, from: 2, to: 1,
              justification: "Accord modéré : le PCF est fortement favorable au nucléaire mais défend simultanément le développement des renouvelables et refuse de les opposer ; +1 traduit une préférence nucléaire sans valider clairement une baisse des investissements renouvelables." },
            { shortName: 'Renaissance', q: 69, from: 2, to: 1,
              justification: "Accord modéré : Renaissance soutient fortement la relance nucléaire mais conserve une stratégie de développement conjoint des énergies renouvelables ; l'arbitrage explicite au détriment des renouvelables n'est donc que partiellement soutenu." },
            { shortName: 'MoDem', q: 69, from: 2, to: 1,
              justification: "Accord modéré : le MoDem présente le nucléaire comme un socle du mix énergétique tout en jugeant les renouvelables indispensables ; +1 reflète mieux cette préférence sans exagérer l'opposition entre les deux." },
            { shortName: 'Horizons', q: 69, from: 3, to: 1,
              justification: "Accord modéré : Horizons veut relancer le nucléaire mais aussi développer les renouvelables et électrifier les usages ; le parti n'adhère donc pas fortement à une réduction des investissements renouvelables au profit du nucléaire." },
            { shortName: 'LFH', q: 67, from: 3, to: 2,
              justification: "Accord net : Dominique de Villepin défend un prix du carbone dont le produit est redistribué aux ménages afin de préserver la justice sociale ; la formulation de la question est légèrement plus exigeante, d'où +2 plutôt que +3." },
            { shortName: 'LFH', q: 80, from: 1, to: 2,
              justification: "Accord net : Dominique de Villepin refuse le retour de pesticides jugés dangereux et préfère répondre à la concurrence étrangère par des clauses miroir et des protections commerciales plutôt que par un recul des normes françaises." },
            { shortName: 'Nouvelle Énergie', q: 33, from: 1, to: -2,
              justification: "Désaccord net : Nouvelle Énergie veut réduire les émissions mais fait du prix bas de l'énergie, de la compétitivité et du pouvoir d'achat une priorité ; le parti s'oppose aux dispositifs qui renchérissent fortement les carburants et énergies fossiles." },
            { shortName: 'Nouvelle Énergie', q: 67, from: 2, to: 0,
              justification: "Position équilibrée ou non tranchée : Nouvelle Énergie est très réservée sur la fiscalité carbone qui renchérit l'énergie, mais aucune position récente suffisamment précise ne permet de trancher le cas particulier d'une taxe intégralement compensée pour les ménages modestes." }
          ];

          const changedKeys = new Set();
          for (const change of changes) {
            const party = parties.find(p => p.shortName === change.shortName);
            if (!party) throw new Error(`Parti introuvable: ${change.shortName}`);
            const index = questionIndex.get(change.q);
            if (index === undefined) throw new Error(`Question introuvable: Q${change.q}`);
            if (party.responses[index] !== change.from) {
              throw new Error(`${change.shortName} Q${change.q}: attendu ${change.from}, trouvé ${party.responses[index]}`);
            }
            party.responses[index] = change.to;
            party.justifications[index] = change.justification;
            changedKeys.add(`${party.id}:${index}`);
          }

          // Aucune autre réponse, confiance, source ou justification ne doit changer.
          for (let p = 0; p < parties.length; p++) {
            const now = parties[p];
            const before = original[p];
            if (now.id !== before.id) throw new Error('Ordre des partis modifié');
            for (let i = 0; i < now.responses.length; i++) {
              const key = `${now.id}:${i}`;
              if (!changedKeys.has(key) && now.responses[i] !== before.responses[i]) {
                throw new Error(`Réponse non autorisée modifiée: ${now.id} index ${i}`);
              }
              if (now.confidence[i] !== before.confidence[i]) {
                throw new Error(`Confiance modifiée: ${now.id} index ${i}`);
              }
              if (now.sources[i] !== before.sources[i]) {
                throw new Error(`Source modifiée: ${now.id} index ${i}`);
              }
              if (!changedKeys.has(key) && now.justifications[i] !== before.justifications[i]) {
                throw new Error(`Justification non autorisée modifiée: ${now.id} index ${i}`);
              }
            }
          }

          // Recalcule systématiquement les six axes pour tous les partis.
          const axes = questionnaire.axes.map(axis => axis.key);
          for (const party of parties) {
            for (const axis of axes) {
              let numerator = 0;
              let mass = 0;
              questionnaire.questions.forEach((question, index) => {
                const coefficient = question.coefficients[axis] || 0;
                numerator += party.responses[index] * coefficient;
                mass += Math.abs(coefficient);
              });
              party.axisScores[axis] = mass ? 10 * numerator / (3 * mass) : 0;
            }
            party.averageConfidence = party.confidence.reduce((sum, value) => sum + value, 0)
              / (questionnaire.questions.length * 3);
          }

          // Contrôles structurels et contrôle indépendant des six scores d'axe.
          for (const party of parties) {
            for (const field of ['responses', 'confidence', 'justifications', 'sources']) {
              if (party[field].length !== questionnaire.questions.length) {
                throw new Error(`${party.id}.${field}: longueur incohérente`);
              }
            }
            for (const axis of axes) {
              let numerator = 0;
              let mass = 0;
              questionnaire.questions.forEach((question, index) => {
                const coefficient = question.coefficients[axis] || 0;
                numerator += party.responses[index] * coefficient;
                mass += Math.abs(coefficient);
              });
              const expected = mass ? 10 * numerator / (3 * mass) : 0;
              if (Math.abs(party.axisScores[axis] - expected) > 1e-12) {
                throw new Error(`${party.id}.${axis}: score d'axe incohérent`);
              }
            }
          }

          for (const change of changes) {
            const party = parties.find(p => p.shortName === change.shortName);
            const index = questionIndex.get(change.q);
            if (party.responses[index] !== change.to) {
              throw new Error(`Validation finale échouée: ${change.shortName} Q${change.q}`);
            }
          }

          const output = `// Profils documentés des partis politiques français.\nconst PARTIES_DATA = ${JSON.stringify(parties, null, 2)};\n`;
          fs.writeFileSync('data/parties.js', output, 'utf8');
          console.log('Validation ciblée OK : 10 réponses écologie modifiées, autres réponses/confiances/sources inchangées, six axes recalculés.');
          NODE

          if git diff --quiet -- data/parties.js; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parties.js
          git commit -m "Update approved ecology party scores"
          git push origin HEAD:main
