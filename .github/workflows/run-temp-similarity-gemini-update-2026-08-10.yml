name: Run similarity and Gemini migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: node scripts/tmp-update-similarity-gemini-confidence-2026-08-10.cjs
      - name: Validate syntax and targeted changes
        run: |
          node --check scripts/app.js
          node --check lib/gemini.js
          grep -q "QUESTION_SIMILARITY_SHARE = 0.8" scripts/app.js
          grep -q "AXIS_COORDINATE_SIMILARITY_SHARE = 0.2" scripts/app.js
          grep -q "top_government_drivers:topGovernmentDrivers" scripts/app.js
          grep -q "documentaryConfidencePercent(e)" scripts/app.js
          grep -q "top_government_drivers" lib/gemini.js
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app.js lib/gemini.js
          git diff --cached --check
          git commit -m "Improve similarity scoring and international AI analysis"
          git push
