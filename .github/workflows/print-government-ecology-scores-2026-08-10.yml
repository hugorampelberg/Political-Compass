name: Print government ecology scores

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print ecology responses
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          function loadConst(path, name) {
            const src = fs.readFileSync(path, 'utf8') + `\n;globalThis.__value = ${name};`;
            const ctx = {};
            vm.createContext(ctx);
            vm.runInContext(src, ctx);
            return ctx.__value;
          }
          const q = loadConst('data/questionnaire.js', 'QUESTIONNAIRE_DATA').questions;
          const g = loadConst('data/governments.js', 'GOVERNMENTS_DATA');
          const ids = [32,33,35,36,37,67,68,69,71,80];
          const map = new Map(q.map((x,i)=>[x.id,i]));
          console.log('QUESTIONS');
          for (const id of ids) {
            const x=q[map.get(id)];
            console.log(`Q${id}|${x.text}|ecology=${x.coefficients.ecology}|authority=${x.coefficients.authority||0}|economy=${x.coefficients.economy||0}`);
          }
          console.log('GOVERNMENTS');
          for (const gov of g) {
            console.log(`${gov.id}|${ids.map(id=>`Q${id}=${gov.responses[map.get(id)]}`).join('|')}|ecologyScore=${gov.axisScores.ecology}`);
          }
          NODE
