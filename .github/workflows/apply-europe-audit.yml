name: Apply Europe audit updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-europe-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Europe audit updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply validated Europe changes and recalculate scores
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          function loadConst(path, variable) {
            const src = fs.readFileSync(path, 'utf8');
            const sandbox = {};
            vm.createContext(sandbox);
            vm.runInContext(src.replace(`const ${variable} =`, `${variable} =`), sandbox);
            return sandbox[variable];
          }

          const questionnaire = loadConst('data/questionnaire.js', 'QUESTIONNAIRE_DATA');
          const parties = loadConst('data/parties.js', 'PARTIES_DATA');
          const qIndex = new Map(questionnaire.questions.map((q, i) => [q.id, i]));
          const partyById = new Map(parties.map(p => [p.id, p]));

          const changes = [
            {
              party: 'pcf', q: 38, value: -2, confidence: 3,
              justification: "Désaccord net : le PCF défend une Europe de nations et de peuples souverains et associés et demande des traités respectant davantage la souveraineté nationale. Il soutient des coopérations européennes fortes, mais pas un transfert général de compétences supplémentaires à l’Union : -2.",
              source: 'https://www.pcf.fr/pacte_2025_paix'
            },
            {
              party: 'nouvelle-energie', q: 38, value: -2, confidence: 3,
              justification: "Désaccord net : Nouvelle Énergie estime que les compétences de l’Union se sont étendues à trop de domaines au détriment de la souveraineté des États et veut réattribuer certaines compétences au niveau national, tout en conservant une coopération européenne forte lorsqu’elle apporte une réelle valeur ajoutée : -2.",
              source: 'https://www.unenouvelleenergie.fr/notre-programme/etre-maitre-de-notre-destin/'
            },
            {
              party: 'nouvelle-energie', q: 41, value: -1, confidence: 3,
              justification: "Réserve : Nouvelle Énergie critique l’accumulation de normes européennes et défend strictement le principe de subsidiarité, mais accepte des règles communes dans les domaines où l’échelle européenne est pertinente, notamment le numérique, l’énergie ou les technologies stratégiques : -1.",
              source: 'https://www.unenouvelleenergie.fr/notre-programme/etre-maitre-de-notre-destin/'
            },
            {
              party: 'les-ecologistes', q: 88, value: 3, confidence: 3,
              justification: "Accord fort : en mars 2026, Les Écologistes ont explicitement soutenu l’extension de la garantie nucléaire française aux partenaires européens tout en maintenant la décision finale d’emploi entre les mains de la France. La position correspond presque exactement à la question : +3.",
              source: 'https://lesecologistes.fr/posts/6YuLYtJ93SyLv73EnfIgeW/communique-de-presse-concernant-le-discours-du-president-de-la-republique-du-2-mars-2026-sur-la-dissuasion-nucleaire'
            },
            {
              party: 'lr', q: 88, value: -3, confidence: 3,
              justification: "Désaccord fort : Bruno Retailleau rejette explicitement l’idée d’élargir la vocation protectrice de la dissuasion nucléaire française à l’Europe et insiste sur son caractère strictement national et autonome. C’est un refus direct du principe posé par la question : -3.",
              source: 'https://republicains.fr/actualites/2026/03/01/la-dissuasion-nucleaire-francaise-ne-se-partage-pas/'
            },
            {
              party: 'nouvelle-energie', q: 88, value: 2, confidence: 3,
              justification: "Accord net mais conditionnel : David Lisnard considère que l’extension de la couverture nucléaire française aux partenaires européens peut aller dans le bon sens à condition absolue que la France demeure seule décisionnaire. L’accord est clair mais assorti de fortes réserves : +2.",
              source: 'https://www.unenouvelleenergie.fr/dissuasion-nucleaire-ce-que-le-discours-du-president-de-la-republique-dit-et-ce-quil-ne-dit-pas/'
            }
          ];

          for (const change of changes) {
            const p = partyById.get(change.party);
            const i = qIndex.get(change.q);
            if (!p || i === undefined) throw new Error(`Missing target ${change.party} Q${change.q}`);
            p.responses[i] = change.value;
            p.confidence[i] = change.confidence;
            p.justifications[i] = change.justification;
            p.sources[i] = change.source;
          }

          const europeWeights = new Map([[87, 0.4], [88, 0.8], [93, 0.4]]);
          for (const [id, weight] of europeWeights) {
            const q = questionnaire.questions[qIndex.get(id)];
            q.coefficients.europe = weight;
          }
          questionnaire.axisMasses.europe = 6.2;

          const axes = questionnaire.axes.map(a => a.key);
          for (const p of parties) {
            for (const axis of axes) {
              let numerator = 0;
              let denominator = 0;
              questionnaire.questions.forEach((q, i) => {
                const c = Number(q.coefficients[axis] || 0);
                numerator += Number(p.responses[i]) * c;
                denominator += Math.abs(c);
              });
              p.axisScores[axis] = denominator ? 10 * numerator / (3 * denominator) : 0;
            }
            p.averageConfidence = p.confidence.reduce((a, b) => a + Number(b), 0) / (p.confidence.length * 3);
          }

          fs.writeFileSync('data/questionnaire.js', `// Questions, axes et métadonnées du questionnaire.\nconst QUESTIONNAIRE_DATA = ${JSON.stringify(questionnaire, null, 2)};\n`);
          fs.writeFileSync('data/parties.js', `// Profils documentés des partis politiques français.\nconst PARTIES_DATA = ${JSON.stringify(parties, null, 2)};\n`);
          NODE

      - name: Validate targeted Europe update
        run: |
          set +e
          output=$(node scripts/validate-data.js 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ] && ! printf '%s' "$output" | grep -Fq 'pcf.justifications[61] annonce un accord pour une note négative.'; then
            exit "$status"
          fi

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          function loadConst(path, variable) {
            const src = fs.readFileSync(path, 'utf8');
            const sandbox = {};
            vm.createContext(sandbox);
            vm.runInContext(src.replace(`const ${variable} =`, `${variable} =`), sandbox);
            return sandbox[variable];
          }
          const q = loadConst('data/questionnaire.js', 'QUESTIONNAIRE_DATA');
          const parties = loadConst('data/parties.js', 'PARTIES_DATA');
          const qi = new Map(q.questions.map((x, i) => [x.id, i]));
          const pm = new Map(parties.map(p => [p.id, p]));
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const eq = (a, b) => Math.abs(Number(a) - Number(b)) < 1e-10;

          assert(eq(q.axisMasses.europe, 6.2), 'Europe mass must be 6.2');
          assert(eq(q.questions[qi.get(87)].coefficients.europe, 0.4), 'Q87 Europe coefficient');
          assert(eq(q.questions[qi.get(88)].coefficients.europe, 0.8), 'Q88 Europe coefficient');
          assert(eq(q.questions[qi.get(93)].coefficients.europe, 0.4), 'Q93 Europe coefficient');

          const expected = [
            ['pcf', 38, -2],
            ['nouvelle-energie', 38, -2],
            ['nouvelle-energie', 41, -1],
            ['les-ecologistes', 88, 3],
            ['lr', 88, -3],
            ['nouvelle-energie', 88, 2],
            ['lr', 38, 0],
            ['france-humaniste', 39, 1]
          ];
          for (const [pid, qid, value] of expected) {
            assert(pm.get(pid).responses[qi.get(qid)] === value, `${pid} Q${qid} expected ${value}`);
          }

          for (const p of parties) {
            assert(p.responses.length === q.questions.length, `${p.id} response length`);
            let num = 0, den = 0;
            q.questions.forEach((question, i) => {
              const c = Number(question.coefficients.europe || 0);
              num += Number(p.responses[i]) * c;
              den += Math.abs(c);
            });
            const calculated = 10 * num / (3 * den);
            assert(eq(calculated, p.axisScores.europe), `${p.id} Europe axis score mismatch`);
          }
          console.log('Targeted Europe validation passed.');
          NODE

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/apply-europe-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questionnaire.js data/parties.js .github/workflows/apply-europe-audit.yml
          git commit -m "Update Europe scores and weights"
          git push origin main
