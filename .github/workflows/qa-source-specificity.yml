name: QA source specificity
on:
  push:
    paths: ['.github/workflows/qa-source-specificity.yml']
permissions: { contents: write }
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat >/tmp/q.js <<'NODE'
          const fs=require('fs'),vm=require('vm');function load(p,n){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(p,'utf8')+`\nthis.x=${n}`,c);return c.x}
          const qs=load('data/questionnaire.js','QUESTIONNAIRE_DATA').questions,es=[...load('data/parties.js','PARTIES_DATA'),...load('data/governments.js','GOVERNMENTS_DATA')];
          let roots=0;for(const e of es){const arr=[];e.sources.forEach((s,i)=>{try{const u=new URL(s);if(u.pathname==='/'||u.pathname===''){arr.push(`Q${qs[i].id}=${s}`);roots++;}}catch{}});if(arr.length)console.log(e.id,arr.length,arr.join(' | '));}console.log('ROOT_TOTAL',roots);
          NODE
          node /tmp/q.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/qa-source-specificity.yml
          git commit -m 'Remove one-shot source specificity audit'
          git push
