name: Normalize confidence values to 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-confidence-to-3.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize confidence values and averages
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          function loadConst(path, variableName) {
            const source = fs.readFileSync(path, 'utf8');
            const context = {};
            vm.runInNewContext(`${source}\nthis.__value = ${variableName};`, context, { filename: path });
            return context.__value;
          }

          const parties = loadConst('data/parties.js', 'PARTIES_DATA');
          const governments = loadConst('data/governments.js', 'GOVERNMENTS_DATA');

          let changed = 0;
          function normalize(entity) {
            entity.confidence = entity.confidence.map(value => {
              if (value === 4) {
                changed += 1;
                return 3;
              }
              return value;
            });
            if (entity.confidence.some(value => !Number.isInteger(value) || value < 1 || value > 3)) {
              throw new Error(`${entity.shortName}: confiance hors plage 1-3`);
            }
            entity.averageConfidence = entity.confidence.reduce((sum, value) => sum + value, 0) / entity.confidence.length;
          }

          [...parties, ...governments].forEach(normalize);
          if (!changed) throw new Error('Aucune confiance à 4 trouvée');
          console.log(`Confiances 4 -> 3 modifiées: ${changed}`);

          fs.writeFileSync('data/parties.js', `// Données de comparaison avec les partis politiques français.\nconst PARTIES_DATA = ${JSON.stringify(parties, null, 2)};\n`);
          fs.writeFileSync('data/governments.js', `// Données de comparaison avec les gouvernements étrangers.\nconst GOVERNMENTS_DATA = ${JSON.stringify(governments, null, 2)};\n`);
          NODE

          node scripts/validate-data.js

      - name: Commit changes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/normalize-confidence-to-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parties.js data/governments.js .github/workflows/normalize-confidence-to-3.yml
          git diff --cached --check
          git commit -m "Normalize confidence values to 3"
          git push origin HEAD:main
