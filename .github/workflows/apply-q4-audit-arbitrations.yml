name: Apply Q4 audit arbitrations

on:
  push:
    paths:
      - '.github/scripts/apply-q4-audit-arbitrations.js'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved Q4 changes
        run: node .github/scripts/apply-q4-audit-arbitrations.js
      - name: Validate JavaScript syntax
        run: |
          node --check data/parties.js
          node --check data/governments.js
      - name: Validate Q4 scope and recalculated metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const c={}; vm.createContext(c);
          for (const p of ['data/questionnaire.js','data/parties.js','data/governments.js']) {
            vm.runInContext(fs.readFileSync(p,'utf8').replace(/^const /gm,'var '),c,{filename:p});
          }
          const qi=new Map(c.QUESTIONNAIRE_DATA.questions.map((q,i)=>[q.id,i]));
          const i=qi.get(4);
          const all=[...c.PARTIES_DATA,...c.GOVERNMENTS_DATA];
          const byId=new Map(all.map(e=>[e.id,e]));
          const expectedResponses={
            'nouvelle-energie':-2,
            'reconquete':-3,
            'finlande':-1,
            'royaume-uni':-1,
            'pays-bas':0,
            'allemagne':0,
            'suisse':-2
          };
          const expectedConfidence={allemagne:3,suisse:4};
          for(const [id,v] of Object.entries(expectedResponses)) if(byId.get(id).responses[i]!==v) throw new Error(`${id} Q4 ${byId.get(id).responses[i]} != ${v}`);
          for(const [id,v] of Object.entries(expectedConfidence)) if(byId.get(id).confidence[i]!==v) throw new Error(`${id} Q4 confidence ${byId.get(id).confidence[i]} != ${v}`);
          const axes=c.QUESTIONNAIRE_DATA.axes.map(a=>a.key);
          for(const id of ['nouvelle-energie','finlande','royaume-uni','pays-bas','allemagne','suisse']) {
            const e=byId.get(id);
            for(const axis of axes){let n=0,m=0;c.QUESTIONNAIRE_DATA.questions.forEach((q,j)=>{const x=q.coefficients[axis]||0;n+=e.responses[j]*x;m+=Math.abs(x)});const s=m?10*n/(3*m):0;if(Math.abs(e.axisScores[axis]-s)>1e-10) throw new Error(`${id} ${axis} stale`)}
            const avg=e.confidence.reduce((a,b)=>a+b,0)/e.confidence.length;
            if(Math.abs(e.averageConfidence-avg)>1e-12) throw new Error(`${id} averageConfidence stale`);
          }
          console.log('Q4 audit validation passed');
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parties.js data/governments.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply approved Q4 audit corrections"
          git push origin main
