name: Add full note details UI

on:
  push:
    branches: [feature/entity-all-notes-detail]
    paths:
      - '.github/workflows/add-all-notes-detail.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/entity-all-notes-detail
          fetch-depth: 0

      - name: Add full note details table
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('scripts/app.js')
          css_path = Path('styles/main.css')
          app = app_path.read_text()
          css = css_path.read_text()

          helper_marker = 'function openEntity(id){'
          assert helper_marker in app, 'openEntity marker missing'
          helpers = r'''function detailedAnswerMarkup(value, variant='', unansweredCopy='Non répondue'){
            if(value===null || value===undefined){
              return `<span class="all-notes-note is-empty">—</span><small>${esc(unansweredCopy)}</small>`;
            }
            const label=SCALE_LABELS[String(value)] || '';
            return `<span class="all-notes-note ${variant}">${formatAnswer(value)}</span>${label?`<small>${esc(label)}</small>`:''}`;
          }

          function renderAllNotesSection(entity){
            const unansweredCopy=state.mode===QUIZ_MODES.QUICK ? 'Non répondue dans le questionnaire rapide' : 'Non répondue';
            const rows=DATA.questions.map((q,i)=>{
              const source=entity.sources?.[i];
              const justification=entity.justifications?.[i] || 'Justification non renseignée.';
              return `<tr>
                <td data-label="Question"><span class="all-notes-question-meta">Q${q.id} · ${esc(q.theme)}</span><strong>${esc(q.text)}</strong></td>
                <td data-label="Votre note" class="all-notes-score-cell">${detailedAnswerMarkup(state.answers[i],'is-user',unansweredCopy)}</td>
                <td data-label="${esc(entity.shortName)}" class="all-notes-score-cell">${detailedAnswerMarkup(entity.responses?.[i],'is-entity')}</td>
                <td data-label="Justification"><span class="all-notes-justification">${esc(justification)}</span></td>
                <td data-label="Source">${source?`<a class="all-notes-source" href="${esc(source)}" target="_blank" rel="noopener">Voir la source</a>`:'<span class="all-notes-no-source">—</span>'}</td>
              </tr>`;
            }).join('');
            return `<section class="all-notes-section">
              <button class="btn btn-secondary all-notes-toggle" id="entity-notes-toggle" type="button" aria-expanded="false" aria-controls="entity-notes-panel">
                <span class="all-notes-toggle-label">Détail de toutes les notes</span>
                <span class="all-notes-chevron" aria-hidden="true">⌄</span>
              </button>
              <div class="all-notes-panel hidden" id="entity-notes-panel">
                <p class="all-notes-intro">Comparaison question par question sur les ${DATA.questions.length} questions du questionnaire. Les questions non posées en mode rapide sont indiquées comme non répondues.</p>
                <div class="all-notes-table-wrap">
                  <table class="all-notes-table">
                    <thead><tr><th>Question</th><th>Votre note</th><th>${esc(entity.shortName)}</th><th>Justification de la note</th><th>Source</th></tr></thead>
                    <tbody>${rows}</tbody>
                  </table>
                </div>
              </div>
            </section>`;
          }

          '''
          app = app.replace(helper_marker, helpers + helper_marker, 1)

          sources_marker = '${uniqueSources.length?`<h3 style="margin-top:26px">Sources documentaires</h3>'
          assert sources_marker in app, 'sources marker missing'
          app = app.replace(sources_marker, '${renderAllNotesSection(e)}' + sources_marker, 1)

          listener_marker = "  $('#modal-backdrop').classList.remove('hidden'); document.body.style.overflow='hidden';"
          assert listener_marker in app, 'modal listener marker missing'
          listener_code = r'''  const notesToggle=$('#entity-notes-toggle');
            const notesPanel=$('#entity-notes-panel');
            const modal=$('#modal-backdrop .modal');
            modal?.classList.remove('notes-expanded');
            if(notesToggle && notesPanel){
              notesToggle.addEventListener('click',()=>{
                const opening=notesPanel.classList.contains('hidden');
                notesPanel.classList.toggle('hidden',!opening);
                notesToggle.setAttribute('aria-expanded',String(opening));
                notesToggle.querySelector('.all-notes-toggle-label').textContent=opening?'Masquer le détail de toutes les notes':'Détail de toutes les notes';
                modal?.classList.toggle('notes-expanded',opening);
                if(opening) notesPanel.scrollIntoView({behavior:'smooth',block:'nearest'});
              });
            }
            $('#modal-backdrop').classList.remove('hidden'); document.body.style.overflow='hidden';'''
          app = app.replace(listener_marker, listener_code, 1)

          css_marker = '.source-list { margin: 20px 0 0; padding-left: 18px; word-break: break-word; font-size: .82rem; }'
          assert css_marker in css, 'CSS source-list marker missing'
          styles = r'''.modal.notes-expanded { width: min(1240px, 100%); }
          .all-notes-section { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
          .all-notes-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: left; }
          .all-notes-chevron { font-size: 1.15rem; line-height: 1; transition: transform .2s ease; }
          .all-notes-toggle[aria-expanded="true"] .all-notes-chevron { transform: rotate(180deg); }
          .all-notes-panel { margin-top: 16px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #fff; }
          .all-notes-intro { margin: 0; padding: 14px 16px; color: var(--muted); background: #f8f8f4; border-bottom: 1px solid var(--line); font-size: .82rem; }
          .all-notes-table-wrap { max-height: min(62vh, 720px); overflow: auto; }
          .all-notes-table { width: 100%; min-width: 1040px; border-collapse: separate; border-spacing: 0; font-size: .8rem; }
          .all-notes-table th { position: sticky; top: 0; z-index: 1; padding: 11px 12px; background: #f1f2ed; color: var(--ink-2); border-bottom: 1px solid var(--line); text-align: left; font-size: .74rem; letter-spacing: .01em; }
          .all-notes-table td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
          .all-notes-table tbody tr:last-child td { border-bottom: 0; }
          .all-notes-table th:nth-child(1), .all-notes-table td:nth-child(1) { width: 30%; }
          .all-notes-table th:nth-child(2), .all-notes-table td:nth-child(2), .all-notes-table th:nth-child(3), .all-notes-table td:nth-child(3) { width: 10%; }
          .all-notes-table th:nth-child(4), .all-notes-table td:nth-child(4) { width: 38%; }
          .all-notes-table th:nth-child(5), .all-notes-table td:nth-child(5) { width: 12%; }
          .all-notes-question-meta { display: block; margin-bottom: 5px; color: var(--muted); font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
          .all-notes-table td > strong { display: block; line-height: 1.4; color: var(--ink); }
          .all-notes-score-cell small { display: block; margin-top: 5px; color: var(--muted); font-size: .68rem; line-height: 1.25; }
          .all-notes-note { display: inline-flex; min-width: 34px; min-height: 28px; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 999px; font-weight: 900; font-variant-numeric: tabular-nums; }
          .all-notes-note.is-user { background: var(--gold-soft); color: #785b18; }
          .all-notes-note.is-entity { background: var(--teal-soft); color: #176d68; }
          .all-notes-note.is-empty { background: #efeee8; color: var(--muted); }
          .all-notes-justification { display: block; line-height: 1.48; }
          .all-notes-source { display: inline-flex; font-weight: 800; white-space: nowrap; }
          .all-notes-no-source { color: var(--muted); }

          '''
          css = css.replace(css_marker, styles + css_marker, 1)

          mobile_marker = '  .modal-body, .modal-head { padding: 20px; }'
          assert mobile_marker in css, 'mobile modal marker missing'
          mobile_styles = r'''  .modal.notes-expanded { width: 100%; }
            .all-notes-panel { border-radius: 16px; }
            .all-notes-table-wrap { max-height: none; overflow: visible; }
            .all-notes-table { min-width: 0; display: block; font-size: .82rem; }
            .all-notes-table thead { display: none; }
            .all-notes-table tbody, .all-notes-table tr, .all-notes-table td { display: block; width: 100%; }
            .all-notes-table tr { padding: 15px; border-bottom: 1px solid var(--line); }
            .all-notes-table tr:last-child { border-bottom: 0; }
            .all-notes-table td { position: relative; min-height: 30px; padding: 6px 0 6px 112px; border: 0; }
            .all-notes-table td::before { content: attr(data-label); position: absolute; left: 0; top: 7px; width: 100px; color: var(--muted); font-size: .69rem; font-weight: 850; }
            .all-notes-table td[data-label="Question"] { padding: 0 0 10px; }
            .all-notes-table td[data-label="Question"]::before { display: none; }
            .all-notes-table th:nth-child(n), .all-notes-table td:nth-child(n) { width: 100%; }
            .all-notes-source { white-space: normal; }
          '''
          css = css.replace(mobile_marker, mobile_styles + mobile_marker, 1)

          assert app.count('function renderAllNotesSection(entity)') == 1
          assert app.count('id="entity-notes-toggle"') == 1
          assert 'Détail de toutes les notes' in app
          assert css.count('.all-notes-table {') == 2
          app_path.write_text(app)
          css_path.write_text(css)
          PY

          node --check scripts/app.js
          git diff --check

      - name: Verify expected UI markers
        shell: bash
        run: |
          grep -q 'function renderAllNotesSection(entity)' scripts/app.js
          grep -q 'Détail de toutes les notes' scripts/app.js
          grep -q 'Justification de la note' scripts/app.js
          grep -q 'class="all-notes-table"' scripts/app.js
          grep -q '.all-notes-table' styles/main.css

      - name: Commit implementation and remove workflow
        shell: bash
        run: |
          rm .github/workflows/add-all-notes-detail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app.js styles/main.css .github/workflows/add-all-notes-detail.yml
          git diff --cached --check
          git commit -m "Add full question note details to entity modal"
          git push origin HEAD:feature/entity-all-notes-detail
