name: Replace Q30 agricultural reciprocity

on:
  push:
    paths:
      - '.github/scripts/replace-q30-agricultural-reciprocity.js'
      - '.github/triggers/replace-q30-agricultural-reciprocity.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace Q30 and recode entities
        run: node .github/scripts/replace-q30-agricultural-reciprocity.js
      - name: Validate JavaScript syntax
        run: |
          node --check data/questionnaire.js
          node --check data/parties.js
          node --check data/governments.js
      - name: Validate Q30, masses and scores
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const c={}; vm.createContext(c);
          for (const p of ['data/questionnaire.js','data/parties.js','data/governments.js']) {
            vm.runInContext(fs.readFileSync(p,'utf8').replace(/^const /gm,'var '),c,{filename:p});
          }
          const qd=c.QUESTIONNAIRE_DATA;
          const i=qd.questions.findIndex(q=>q.id===30);
          if(i<0) throw new Error('Q30 missing');
          const q=qd.questions[i];
          const expectedText='La France devrait pouvoir interdire l’importation de produits agricoles fabriqués selon des normes qu’elle interdit à ses propres agriculteurs, même si cela faisait disparaître des rayons les produits alimentaires les moins chers.';
          if(q.text!==expectedText) throw new Error('Q30 text mismatch');
          if(q.coefficients.economy!==-0.6 || q.coefficients.authority!==0.3) throw new Error('Q30 coefficients mismatch');
          const expectedMass={economy:24.3,authority:19.7,europe:6.2,ecology:8.5,immigration:11.4,democracy:7.8};
          for(const [a,v] of Object.entries(expectedMass)) if(Math.abs(qd.axisMasses[a]-v)>1e-9) throw new Error(`${a} mass ${qd.axisMasses[a]} != ${v}`);
          const expected={
            lfi:3,pcf:3,'les-ecologistes':3,ps:3,renaissance:2,modem:2,horizons:2,'france-humaniste':2,lr:3,'nouvelle-energie':3,udr:3,rn:3,reconquete:3,
            allemagne:-1,espagne:2,suisse:1,finlande:-1,'royaume-uni':1,danemark:0,'pays-bas':0,pologne:3
          };
          const all=[...c.PARTIES_DATA,...c.GOVERNMENTS_DATA];
          const byId=new Map(all.map(e=>[e.id,e]));
          for(const [id,v] of Object.entries(expected)) {
            if(!byId.has(id)) throw new Error(`${id} missing`);
            if(byId.get(id).responses[i]!==v) throw new Error(`${id} Q30 ${byId.get(id).responses[i]} != ${v}`);
          }
          const axes=qd.axes.map(a=>a.key);
          for(const e of all){
            if(e.responses.length!==qd.questions.length || e.confidence.length!==qd.questions.length || e.justifications.length!==qd.questions.length || e.sources.length!==qd.questions.length) throw new Error(`${e.id}: array length mismatch`);
            for(const axis of axes){
              let n=0,m=0;
              qd.questions.forEach((qq,j)=>{const x=qq.coefficients[axis]||0;n+=e.responses[j]*x;m+=Math.abs(x);});
              const expectedScore=m?10*n/(3*m):0;
              if(Math.abs(e.axisScores[axis]-expectedScore)>1e-10) throw new Error(`${e.id} ${axis} stale`);
            }
            const avg=e.confidence.reduce((a,b)=>a+b,0)/e.confidence.length;
            if(Math.abs(e.averageConfidence-avg)>1e-12) throw new Error(`${e.id} averageConfidence stale`);
          }
          console.log('Q30 agricultural reciprocity validation passed');
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questionnaire.js data/parties.js data/governments.js
          git diff --cached --quiet && exit 0
          git commit -m "Replace Q30 with agricultural reciprocity question"
          git push origin main
