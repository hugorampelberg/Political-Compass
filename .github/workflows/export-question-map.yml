name: Export question map
on:
  push:
    paths: ['.github/workflows/export-question-map.yml']
permissions: { contents: write }
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat >/tmp/q.js <<'NODE'
          const fs=require('fs'),vm=require('vm'); const c={}; vm.createContext(c); vm.runInContext(fs.readFileSync('data/questionnaire.js','utf8')+'\nthis.q=QUESTIONNAIRE_DATA.questions',c);
          const clean=s=>String(s??'').replace(/\t|\r?\n/g,' ');
          fs.writeFileSync('audit/questions.tsv','qid\ttheme\tquestion\n'+c.q.map(q=>[q.id,q.theme,q.text].map(clean).join('\t')).join('\n')+'\n');
          NODE
          node /tmp/q.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/questions.tsv
          git rm .github/workflows/export-question-map.yml
          git commit -m 'Export questionnaire map for audit'
          git push
