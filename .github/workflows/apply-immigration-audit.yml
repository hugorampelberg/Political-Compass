name: Apply immigration score audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-immigration-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply validated immigration scores
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const context = {};
          vm.createContext(context);
          for (const path of ['data/questionnaire.js', 'data/parties.js']) {
            const source = fs.readFileSync(path, 'utf8');
            vm.runInContext(source.replace(/^const /gm, 'var '), context, { filename: path });
          }

          const questionnaire = context.QUESTIONNAIRE_DATA;
          const parties = context.PARTIES_DATA;
          const questionIndex = new Map(questionnaire.questions.map((question, index) => [question.id, index]));

          const changes = {
            pcf: { 21: 2, 24: -2 },
            'les-ecologistes': { 59: 3 },
            modem: { 25: 2, 58: 0, 60: 1, 61: -1, 79: 0 },
            horizons: { 57: 1, 58: 1 },
            lr: { 56: -2, 59: -2 },
            'nouvelle-energie': { 59: -3 },
            udr: { 22: -3 },
            rn: { 21: -2 }
          };

          const justifications = {
            'pcf:21': "Accord net : le PCF souligne la contribution économique, fiscale et sociale positive de l’immigration, tout en refusant d’en faire le seul critère de la politique migratoire ; +2 plutôt que +3.",
            'pcf:24': "Désaccord net : le PCF critique la double peine et les expulsions automatiques après condamnation ; la mention spécifique des crimes graves empêche toutefois de retenir une opposition maximale.",
            'les-ecologistes:59': "Accord fort : Les Écologistes défendent explicitement le droit du sol et s’opposent à la suppression de l’acquisition de la nationalité à la majorité pour les personnes nées et ayant grandi en France.",
            'modem:25': "Accord net : François Bayrou défend un accueil proportionné et estime que des flux trop importants peuvent déstabiliser les repères et la cohésion d’une communauté, sans faire de la fermeture culturelle un principe absolu.",
            'modem:58': "Position équilibrée ou non tranchée : le MoDem défend une immigration de travail maîtrisée, mais aucune préférence claire et générale pour les immigrés qualifiés au détriment des peu qualifiés n’est établie.",
            'modem:60': "Accord modéré : le MoDem exige une intégration réelle autour de la langue et des principes communs, mais ne propose pas explicitement de refuser l’entrée sur la seule anticipation d’un défaut d’intégration culturelle.",
            'modem:61': "Désaccord modéré : François Bayrou considère que le respect de la loi ne suffit pas à lui seul à définir l’intégration et insiste aussi sur la langue, les usages et les repères communs, tout en acceptant le pluralisme culturel.",
            'modem:79': "Position équilibrée ou non tranchée : le MoDem mobilise à la fois des facteurs sociaux, éducatifs, économiques, démographiques et culturels pour expliquer la délinquance, sans établir que les inégalités sociales expliquent davantage les écarts que la culture d’origine.",
            'horizons:57': "Accord modéré : Horizons défend des restrictions ciblées de prestations pour certains étrangers, notamment délinquants, mais ne propose pas une limitation générale et forte de l’accès aux aides pour tous les immigrés durant leurs premières années.",
            'horizons:58': "Accord modéré : Horizons veut choisir davantage l’immigration économique au moyen de quotas, mais la priorité spécifique aux travailleurs qualifiés par rapport aux peu qualifiés n’est pas formulée de manière assez nette pour +2.",
            'lr:56': "Désaccord net : LR lie explicitement naturalisation et assimilation et souhaite rendre les naturalisations plus exigeantes ; travail, langue et respect des lois restent néanmoins des critères positifs, ce qui écarte -3.",
            'lr:59': "Désaccord net : LR défend un durcissement du droit du sol et plusieurs responsables du parti ont proposé d’étendre les restrictions au-delà de Mayotte ; cela s’oppose clairement à l’automaticité décrite, sans aller aussi loin que les partis qui veulent la supprimer partout.",
            'nouvelle-energie:59': "Désaccord fort : Nouvelle Énergie propose explicitement de mettre fin à l’automaticité du droit du sol ; c’est l’opposé direct de la proposition.",
            'udr:22': "Désaccord fort : l’UDR revendique explicitement une préférence nationale et européenne pour certaines prestations ; la proposition d’égalité d’accès sans priorité fondée sur la nationalité est donc directement contraire à sa ligne.",
            'rn:21': "Désaccord net : le RN présente l’immigration comme une charge ou une pression sur les équilibres économiques et sociaux et rejette l’idée d’y recourir davantage pour répondre aux besoins de main-d’œuvre, sans nier tout bénéfice économique possible."
          };

          for (const party of parties) {
            const partyChanges = changes[party.id];
            if (partyChanges) {
              for (const [questionIdText, score] of Object.entries(partyChanges)) {
                const questionId = Number(questionIdText);
                const index = questionIndex.get(questionId);
                if (index === undefined) throw new Error(`Question ${questionId} introuvable`);
                party.responses[index] = score;
                const key = `${party.id}:${questionId}`;
                if (justifications[key]) party.justifications[index] = justifications[key];
              }
            }

            for (const axis of questionnaire.axes.map(axis => axis.key)) {
              let numerator = 0;
              let mass = 0;
              questionnaire.questions.forEach((question, index) => {
                const coefficient = question.coefficients[axis] || 0;
                numerator += party.responses[index] * coefficient;
                mass += Math.abs(coefficient);
              });
              party.axisScores[axis] = mass ? 10 * numerator / (3 * mass) : 0;
            }

            party.averageConfidence = party.confidence.reduce((sum, value) => sum + value, 0)
              / (questionnaire.questions.length * 3);
          }

          const output = `// Profils documentés des partis politiques français.\nconst PARTIES_DATA = ${JSON.stringify(parties, null, 2)};\n`;
          fs.writeFileSync('data/parties.js', output, 'utf8');
          NODE

          node scripts/validate-data.js

          if git diff --quiet -- data/parties.js; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parties.js
          git commit -m "Update immigration party scores"
          git push origin HEAD:main
