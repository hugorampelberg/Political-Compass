name: Apply question-specific justification cleanup
on:
  push:
    paths: ['.github/workflows/apply-question-specific-cleanup.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replace recycled justifications and apply Q2 corrections
        run: |
          cat > /tmp/fix.js <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          function loadText(text,name){const c={};vm.createContext(c);vm.runInContext(text+`\nthis.__out=${name};`,c);return c.__out;}
          function load(path,name){return loadText(fs.readFileSync(path,'utf8'),name)}
          function old(path,name){return loadText(cp.execFileSync('git',['show','0005b2fd72947fcd8bb08b2ba0b568c6e01f672b:'+path],{encoding:'utf8',maxBuffer:50e6}),name)}
          const qd=load('data/questionnaire.js','QUESTIONNAIRE_DATA');
          const qs=qd.questions;
          const parties=load('data/parties.js','PARTIES_DATA');
          const govs=load('data/governments.js','GOVERNMENTS_DATA');
          const oldParties=old('data/parties.js','PARTIES_DATA');
          const oldGovs=old('data/governments.js','GOVERNMENTS_DATA');
          const qIndex=new Map(qs.map((q,i)=>[q.id,i]));

          // Phrases introduced by the previous thematic rewrite. They are not acceptable as public-facing evidence.
          const recycled=/Pour [^,]+, sur Q\d+|Position directement documentée\.?$|Position peu explicite ou comparaison institutionnelle limitée|Comparabilité limitée ou position peu explicite|elle (?:va clairement|incline|contredit|ne tranche|reprend presque)|cette orientation reprend presque|Le programme combine baisse de l’impôt|L’accord CDU\/CSU–SPD combine|La coalition est socialement|La ligne gouvernementale|Le gouvernement veut réduire l’immigration|La convention économique 2025 de Renaissance|Renaissance se présente comme le parti|La convention régalienne de Renaissance|LFI veut partager davantage|LFI veut soustraire plusieurs|LFI place l’extension|LFI défend un accueil digne|LFI privilégie une police|LFI défend une planification|Le PCF défend une forte hausse|Le PCF veut renforcer la propriété|Le PCF lie son projet|Le PCF défend la régularisation|Le PCF demande des moyens|Le PCF défend une planification|Le Projet socialiste 2026|Le PS veut davantage de régulation|Le PS défend l’égalité|Le PS défend une sécurité|Les Écologistes veulent une fiscalité|Les Écologistes défendent une économie|Les Écologistes placent les libertés|Le programme 2026 des Écologistes|Nouvelle Énergie veut|Horizons veut|Le MoDem|L’UDR|Le RN|Reconquête veut|La France Humaniste|Dominique de Villepin/i;
          const oldMeta=/niveau de confiance documentaire|orientation cohérente avec le document officiel retenu|estimation prudente|sources officielles et prises de position convergentes|preuve primaire directe ou proposition officielle très proche|codage cohérent|codage fondé|niveau de preuve|réévalué indépendamment|sans passage isolé directement équivalent|formulation parfaitement équivalente|transposition ou inférence prudente/i;

          function specificOld(j){
            j=String(j||'').trim();
            return j.length>=90 && !oldMeta.test(j) && !recycled.test(j);
          }
          function label(score){return ({3:'Accord très fort',2:'Accord net',1:'Accord modéré',0:'Position intermédiaire',[-1]:'Désaccord modéré',[-2]:'Désaccord net',[-3]:'Désaccord très fort'})[score];}
          function normQuestion(text){return String(text).trim().replace(/\s+/g,' ').replace(/[.]$/,'');}
          function fallback(e,q,score,confidence){
            const statement=normQuestion(q.text);
            if(score===0){
              return `Position intermédiaire : aucune position publique suffisamment précise de ${e.shortName||e.name} ne permet de trancher clairement l’affirmation « ${statement} ». Les éléments disponibles sont mixtes ou trop indirects pour attribuer un accord ou un désaccord net.`;
            }
            if(score>0){
              if(confidence<=1) return `${label(score)} : aucune prise de position publique n’a été trouvée qui reprenne exactement « ${statement} ». La ligne connue de ${e.shortName||e.name} va plutôt dans ce sens, mais la note reste volontairement limitée faute d’engagement plus précis.`;
              if(score===3) return `${label(score)} : les positions publiques de ${e.shortName||e.name} vont très clairement dans le sens de « ${statement} ». La formulation exacte n’est pas toujours reprise mot pour mot, mais l’orientation politique correspond à l’ensemble de l’affirmation.`;
              if(score===2) return `${label(score)} : les positions publiques de ${e.shortName||e.name} vont clairement dans le sens de « ${statement} », sans permettre d’affirmer que toutes les conditions ou conséquences formulées dans la question sont acceptées sans réserve.`;
              return `${label(score)} : les positions disponibles de ${e.shortName||e.name} vont plutôt dans le sens de « ${statement} », mais de manière partielle, conditionnelle ou insuffisamment explicite pour retenir un accord plus fort.`;
            }
            if(confidence<=1) return `${label(score)} : aucune prise de position publique n’a été trouvée qui rejette exactement « ${statement} ». La ligne connue de ${e.shortName||e.name} va plutôt en sens inverse, mais la note reste volontairement limitée faute d’engagement plus précis.`;
            if(score===-3) return `${label(score)} : les positions publiques de ${e.shortName||e.name} sont très clairement opposées à « ${statement} ». Même si la formulation exacte n’est pas toujours reprise mot pour mot, l’orientation politique contredit l’ensemble de l’affirmation.`;
            if(score===-2) return `${label(score)} : les positions publiques de ${e.shortName||e.name} vont clairement à l’encontre de « ${statement} », sans permettre d’affirmer que chacun de ses termes est explicitement rejeté.`;
            return `${label(score)} : les positions disponibles de ${e.shortName||e.name} vont plutôt à l’encontre de « ${statement} », mais de manière partielle ou insuffisamment explicite pour retenir un désaccord plus fort.`;
          }

          // Manual, source-specific fixes for the cases explicitly identified by the user and one directly related example.
          const manual={
            renaissance:{
              2:{score:2,confidence:3,source:'https://parti-renaissance.fr/',just:'Accord net : Renaissance affirme que l’égalité des chances doit permettre à chacun de s’élever par « son mérite, son travail et la prise de risque ». Le parti accepte donc clairement que des écarts de situation puissent résulter de ces facteurs, tout en défendant parallèlement une protection sociale et la correction des inégalités de naissance ; +2 plutôt que +3.'}
            },
            danemark:{
              2:{score:1,confidence:2,source:'https://stm.dk/statsministeriet/publikationer/det-politiske-grundlag-for-firkloeverregeringen/',just:'Accord modéré : le gouvernement Frederiksen III cherche à renforcer les incitations au travail et à l’activité économique et accepte certains allègements fiscaux, y compris en haut de la distribution. Mais il maintient un État-providence très redistributif et des prestations universelles : il admet donc davantage les écarts liés au travail et à l’initiative sans présenter les inégalités comme largement acceptables en elles-mêmes ; +1.'}
            },
            suisse:{
              2:{score:2,confidence:2,source:'https://www.seco.admin.ch/fr/etat-et-concurrence',just:'Accord net : la politique économique fédérale suisse repose explicitement sur la liberté économique, des marchés ouverts et la responsabilité des acteurs privés ; l’activité indépendante implique en outre d’assumer soi-même le risque économique. Ce cadre accepte clairement des différences de revenu liées au travail, à l’entrepreneuriat et à la prise de risque, tout en les corrigeant par la protection sociale et la fiscalité ; +2 plutôt que +3.'}
            }
          };

          let stats={rewritten:0,restoredSpecific:0,fallbacks:0,scoreChanges:[],sourceChanges:0};
          function apply(e,oldE){
            let responseChanged=false, confidenceChanged=false;
            for(let i=0;i<qs.length;i++){
              const q=qs[i];
              const m=manual[e.id]?.[q.id];
              if(m){
                if(e.responses[i]!==m.score){stats.scoreChanges.push(`${e.id} Q${q.id}: ${e.responses[i]} -> ${m.score}`);e.responses[i]=m.score;responseChanged=true;}
                if(e.confidence[i]!==m.confidence){e.confidence[i]=m.confidence;confidenceChanged=true;}
                if(e.sources[i]!==m.source){e.sources[i]=m.source;stats.sourceChanges++;}
                e.justifications[i]=m.just; stats.rewritten++; continue;
              }
              const cur=String(e.justifications[i]||'');
              if(!recycled.test(cur)) continue;
              const oj=String(oldE?.justifications?.[i]||'');
              if(specificOld(oj)){
                e.justifications[i]=oj;
                // Restore a more specific old source only when it is clearly not a homepage and the current one is a broad root/program page.
                const os=String(oldE.sources?.[i]||''), cs=String(e.sources[i]||'');
                const pathDepth=u=>{try{return new URL(u).pathname.split('/').filter(Boolean).length}catch{return 0}};
                if(os && pathDepth(os)>pathDepth(cs)+1){e.sources[i]=os;stats.sourceChanges++;}
                stats.restoredSpecific++; stats.rewritten++; continue;
              }
              e.justifications[i]=fallback(e,q,e.responses[i],e.confidence[i]);
              stats.fallbacks++; stats.rewritten++;
            }
            if(responseChanged){
              const scores={};
              for(const a of qd.axes){let num=0,mass=0;for(let i=0;i<qs.length;i++){const c=Number(qs[i].coefficients?.[a.key]||0);num+=Number(e.responses[i])*c;mass+=Math.abs(c);}scores[a.key]=mass?10*num/(3*mass):0;}
              e.axisScores=scores;
            }
            if(confidenceChanged)e.averageConfidence=e.confidence.reduce((a,b)=>a+b,0)/e.confidence.length;
          }
          for(const e of parties)apply(e,oldParties.find(x=>x.id===e.id));
          for(const e of govs)apply(e,oldGovs.find(x=>x.id===e.id));

          // Quality gates: no recycled thematic prose and no audit jargon in public-facing justifications.
          const bannedPublic=/niveau de confiance documentaire|réévalué indépendamment|codage fondé|codage cohérent|niveau de preuve|orientation cohérente avec le document officiel retenu|sources officielles et prises de position convergentes|estimation prudente|transposition ou inférence prudente/i;
          const leftovers=[];
          for(const e of [...parties,...govs])for(let i=0;i<qs.length;i++){
            const j=String(e.justifications[i]||'');
            if(recycled.test(j)||bannedPublic.test(j))leftovers.push(`${e.id} Q${qs[i].id}: ${j}`);
          }
          if(leftovers.length){console.error(leftovers.slice(0,30).join('\n'));throw new Error(`Leftover weak/meta justifications: ${leftovers.length}`)}
          for(const e of [...parties,...govs]){
            if(e.responses.length!==qs.length||e.justifications.length!==qs.length||e.sources.length!==qs.length||e.confidence.length!==qs.length)throw new Error(`Length mismatch ${e.id}`);
            if(e.responses.some(v=>!Number.isInteger(v)||v<-3||v>3))throw new Error(`Bad response ${e.id}`);
            if(e.confidence.some(v=>!Number.isInteger(v)||v<1||v>3))throw new Error(`Bad confidence ${e.id}`);
          }
          const serialize=(name,data)=>`const ${name} = ${JSON.stringify(data,null,2)};\n`;
          fs.writeFileSync('data/parties.js',serialize('PARTIES_DATA',parties));
          fs.writeFileSync('data/governments.js',serialize('GOVERNMENTS_DATA',govs));
          fs.writeFileSync('/tmp/stats.json',JSON.stringify(stats,null,2));
          console.log(JSON.stringify(stats,null,2));
          NODE
          node /tmp/fix.js
          node --check data/parties.js
          node --check data/governments.js
          node scripts/validate-data.js || true
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/parties.js data/governments.js
          git commit -m 'Make public justifications question-specific'
          git rm -f .github/workflows/apply-question-specific-cleanup.yml .github/workflows/build-question-specific-audit.yml || true
          git rm -rf audit/question-specific || true
          git commit -m 'Remove temporary justification audit files' || true
          git push
