name: Build final question-specific public rationales
on:
  push:
    paths: ['.github/workflows/build-final-question-rationales.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build final data from main
        run: |
          # Start from the production data, not from the two rejected experimental rewrites on this branch.
          git checkout origin/main -- data/parties.js data/governments.js
          cat > /tmp/finalize.js <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          function loadText(text,name){const c={};vm.createContext(c);vm.runInContext(text+`\nthis.__out=${name};`,c);return c.__out;}
          function load(path,name){return loadText(fs.readFileSync(path,'utf8'),name)}
          const qd=load('data/questionnaire.js','QUESTIONNAIRE_DATA'), qs=qd.questions;
          const parties=load('data/parties.js','PARTIES_DATA'), govs=load('data/governments.js','GOVERNMENTS_DATA');
          const manualRen=JSON.parse(cp.execFileSync('git',['show','7e9a47216edb33a4b8ecd7871b6045951946e67a:audit/question-specific/manual/renaissance.json'],{encoding:'utf8',maxBuffer:20e6}));
          const manualDk=JSON.parse(cp.execFileSync('git',['show','7e9a47216edb33a4b8ecd7871b6045951946e67a:audit/question-specific/manual/danemark.json'],{encoding:'utf8',maxBuffer:20e6}));
          const bad=/Pour [^,]+, sur Q\d+|Position directement documentée\.?$|Position peu explicite ou comparaison institutionnelle limitée|Comparabilité limitée ou position peu explicite|Le programme combine baisse de l’impôt|L’accord CDU\/CSU–SPD combine|La coalition est socialement|La ligne gouvernementale|Le gouvernement veut réduire l’immigration|La convention économique 2025 de Renaissance|Renaissance se présente comme le parti|La convention régalienne de Renaissance|LFI veut partager davantage|LFI veut soustraire plusieurs|LFI place l’extension|LFI défend un accueil digne|LFI privilégie une police|LFI défend une planification|Le PCF défend une forte hausse|Le PCF veut renforcer la propriété|Le PCF lie son projet|Le PCF défend la régularisation|Le PCF demande des moyens|Le PCF défend une planification|Le Projet socialiste 2026|Le PS veut davantage de régulation|Le PS défend l’égalité|Le PS défend une sécurité|Les Écologistes veulent une fiscalité|Les Écologistes défendent une économie|Les Écologistes placent les libertés|Le programme 2026 des Écologistes|Nouvelle Énergie veut|Horizons veut|Le MoDem|L’UDR|Le RN|Reconquête veut|La France Humaniste|Dominique de Villepin|niveau de confiance documentaire|orientation cohérente avec le document officiel retenu|estimation prudente|sources officielles et prises de position convergentes|preuve primaire directe ou proposition officielle très proche|codage cohérent|codage fondé|niveau de preuve|réévalué indépendamment|sans passage isolé directement équivalent|formulation parfaitement équivalente|transposition ou inférence prudente/i;

          // Each entry describes the actual policy divide of ONE question. These are deliberately question-specific,
          // so an economic argument for Q1 can never be recycled as the rationale for Q2, Q3, etc.
          const R={
            1:{p:'privilégie la baisse des prélèvements sur le travail et le capital et accepte de rechercher en contrepartie des économies dans la dépense publique',n:'privilégie le financement des services publics et de la protection sociale et refuse de faire dépendre une baisse générale des prélèvements de coupes dans ces dépenses',z:'combine des baisses ciblées de prélèvements avec le maintien d’un niveau élevé de dépenses publiques, sans arbitrage général conforme à l’énoncé'},
            2:{p:'valorise le mérite, le travail, l’entrepreneuriat ou la prise de risque comme facteurs légitimes de réussite et accepte qu’ils puissent produire des écarts de revenus',n:'considère que le mérite ou le travail ne suffisent pas à légitimer les inégalités et insiste davantage sur l’héritage, les rapports de pouvoir ou les structures économiques qui les produisent',z:'valorise à la fois les incitations liées au travail et à l’initiative et une forte correction redistributive des écarts, sans trancher nettement la légitimité générale des inégalités'},
            3:{p:'défend une contribution plus forte des hauts revenus et des gros patrimoines pour financer la redistribution et réduire les écarts économiques',n:'privilégie la stabilité ou la baisse de la fiscalité sur les revenus élevés et le patrimoine plutôt qu’une hausse destinée à réduire les inégalités',z:'combine certains prélèvements progressifs avec le refus d’une hausse générale de la taxation des hauts revenus et patrimoines'},
            4:{p:'accepte qu’une règle contraignante limite directement l’écart entre les plus hautes et les plus basses rémunérations d’une même entreprise',n:'refuse un ratio légal entre rémunérations dirigeantes et bas salaires et préfère laisser la politique salariale aux entreprises ou à leur gouvernance',z:'encadre la rémunération des dirigeants sans proposer de ratio légal directement lié au salaire le plus faible'},
            5:{p:'soutient une hausse importante du salaire minimum légal comme instrument direct d’augmentation des bas salaires',n:'préfère augmenter les revenus du travail par les baisses de charges, les négociations salariales ou les primes plutôt que par une forte hausse légale du salaire minimum',z:'cherche à relever les bas revenus mais sans position claire en faveur ou contre une forte hausse du salaire minimum légal'},
            6:{p:'accorde au secteur privé une place importante dans la fourniture de biens et services et lui attribue souvent davantage de souplesse ou d’efficacité, y compris dans certains domaines essentiels',n:'considère que les services essentiels doivent relever prioritairement du public ou du non-lucratif et rejette l’idée d’une supériorité générale de l’entreprise privée',z:'combine un secteur privé important avec un rôle public central dans les services essentiels, sans affirmer la supériorité générale de l’un sur l’autre'},
            7:{p:'accepte la prise de contrôle publique d’une entreprise lorsqu’une activité stratégique, la souveraineté ou la continuité d’un service essentiel l’exige',n:'privilégie la régulation, les contrats ou les participations minoritaires et rejette la nationalisation comme outil normal de politique industrielle',z:'admet une intervention publique forte dans les secteurs stratégiques sans position nette sur le recours à une nationalisation complète'},
            8:{p:'mise prioritairement sur la concurrence, l’ouverture des marchés et la liberté d’entreprendre pour stimuler les prix, la qualité et l’innovation',n:'privilégie l’encadrement public, les normes ou la planification et conteste que la concurrence produise généralement de meilleurs résultats',z:'combine concurrence et réglementation sans donner clairement la priorité générale à l’une des deux méthodes'},
            9:{p:'considère la maîtrise de la dépense et le retour à l’équilibre budgétaire comme prioritaires et accepte de revoir certaines politiques sociales pour y parvenir',n:'refuse de faire des politiques sociales la variable d’ajustement du déficit et privilégie les recettes, l’investissement ou le maintien de la protection sociale',z:'affiche à la fois un objectif de discipline budgétaire et la préservation des principales politiques sociales, sans accepter clairement l’arbitrage proposé'},
            10:{p:'assume un système de protection sociale étendu et accepte le niveau de prélèvements nécessaire pour le financer',n:'cherche à réduire le poids des prélèvements et à limiter ou cibler davantage la protection sociale plutôt qu’à garantir un niveau élevé à coût fiscal important',z:'défend une protection sociale importante tout en cherchant à réduire nettement sa charge fiscale, ce qui rend l’arbitrage partagé'},
            12:{p:'accepte des interventions publiques fortes — réglementation, prix, aides, prises de participation ou services publics — lorsque le marché produit des résultats jugés socialement mauvais',n:'préfère corriger les défaillances du marché par la concurrence, les incitations ou des interventions limitées plutôt que par une extension forte du rôle économique de l’État',z:'combine économie de marché et interventions correctrices ciblées sans défendre ni rejeter une hausse générale du rôle économique de l’État'},
            13:{p:'cherche à accroître le choix individuel dans la retraite, la santé ou la protection sociale, notamment par des comptes personnels, assurances ou composantes facultatives',n:'privilégie des régimes collectifs obligatoires et mutualisés et refuse qu’une part importante de la protection sociale dépende du choix individuel',z:'combine des régimes collectifs obligatoires avec certains choix ou compléments individuels sans bascule générale vers la liberté de choix'},
            14:{p:'défend une large liberté des modes de vie et l’égalité des droits lorsque les choix individuels s’écartent des normes traditionnelles',n:'accorde une place importante aux normes familiales, culturelles ou morales traditionnelles et se montre réservé face à leur remise en cause rapide',z:'concilie liberté des modes de vie et attachement à certaines normes traditionnelles sans donner une priorité nette à l’un des deux pôles'},
            15:{p:'accepte qu’un mécanisme constitutionnel permette à l’exécutif de faire entrer en vigueur un budget sans vote positif du Parlement lorsqu’un blocage durable menace les finances publiques',n:'considère qu’un budget doit obtenir l’approbation du Parlement et refuse qu’une absence de majorité permette à l’exécutif de contourner ce vote',z:'admet certains mécanismes de continuité budgétaire mais pas clairement l’adoption durable d’un nouveau budget sans vote parlementaire'},
            16:{p:'accepte que des politiques d’égalité imposent parfois des contraintes à des choix ou libertés individuels, par exemple par des obligations redistributives ou correctrices',n:'privilégie l’égalité des chances et la liberté individuelle et refuse d’utiliser la restriction des libertés comme instrument général de réduction des écarts',z:'accepte certaines contraintes redistributives tout en plaçant des limites fortes à leur emprise sur les libertés individuelles'},
            17:{p:'soutient des politiques actives visant à corriger les discriminations persistantes ou structurelles au-delà de la seule égalité juridique formelle',n:'privilégie l’égalité devant la loi et les mesures universalistes et se montre hostile aux politiques correctrices ciblant explicitement des groupes',z:'combat les discriminations mais sans position nette sur l’usage de politiques correctrices spécifiquement destinées à compenser des désavantages historiques'},
            18:{p:'accepte une différenciation territoriale importante et davantage de pouvoir normatif local ou régional dans des domaines économiques, sociaux ou environnementaux',n:'privilégie l’uniformité des règles nationales et l’égalité territoriale et se méfie des dérogations régionales importantes',z:'accorde une autonomie de gestion locale mais sans transfert clair d’un pouvoir normatif permettant des règles substantiellement différentes'},
            19:{p:'accorde une valeur politique à la transmission du patrimoine culturel, des traditions ou d’un cadre commun même lorsque ces références évoluent lentement',n:'privilégie l’évolution des normes sociales et l’autonomie individuelle et refuse que la tradition constitue en elle-même un motif pour ralentir le changement',z:'valorise certaines traditions tout en défendant fortement l’évolution des droits et des modes de vie'},
            20:{p:'cherche explicitement à réduire ou à plafonner une partie importante des flux migratoires plutôt qu’à seulement mieux les organiser',n:'refuse un objectif général de baisse des entrées et privilégie l’accueil, les voies légales et la régularisation ou l’intégration',z:'veut mieux contrôler ou sélectionner l’immigration sans fixer clairement comme objectif une baisse du volume total'},
            21:{p:'considère la main-d’œuvre immigrée comme utile à la croissance, aux secteurs en pénurie ou aux finances publiques et soutient une immigration économique organisée',n:'met davantage l’accent sur les coûts, la concurrence sur le travail ou la pression sur les services publics et conteste un bénéfice économique global',z:'reconnaît des bénéfices économiques à certains flux tout en soulignant des coûts importants, sans bilan global clairement positif ou négatif'},
            22:{p:'refuse une préférence durable fondée sur la nationalité pour les prestations et le logement social une fois qu’un étranger est légalement et durablement installé',n:'défend une priorité ou des restrictions durables liées à la nationalité même pour des étrangers installés légalement de longue date',z:'prévoit des délais ou conditions de résidence mais sans position claire sur une égalité complète après une installation durable'},
            23:{p:'veut renforcer les critères de résidence, de langue, d’intégration ou d’adhésion civique nécessaires à l’obtention de la nationalité',n:'souhaite faciliter ou maintenir des voies relativement accessibles d’acquisition de la nationalité et s’oppose à leur durcissement général',z:'maintient des critères d’intégration substantiels sans chercher clairement à les durcir ou à les assouplir'},
            24:{p:'veut faciliter et accélérer l’éloignement des étrangers condamnés pour des crimes graves et lever plusieurs obstacles pratiques ou juridiques aux expulsions',n:'refuse une politique générale d’expulsion renforcée des étrangers condamnés et insiste sur l’individualisation des peines et l’interdiction de la double peine',z:'accepte l’expulsion dans les cas graves sans défendre ni rejeter un durcissement général de la politique'},
            25:{p:'considère que la capacité d’intégration et la cohésion culturelle peuvent justifier de limiter certains flux même lorsque ceux-ci ont une utilité économique',n:'refuse de faire de l’homogénéité ou de la cohésion culturelle un motif autonome de restriction et privilégie les droits et l’intégration',z:'met en balance utilité économique, intégration et cohésion sans établir que le facteur culturel doit pouvoir l’emporter'},
            26:{p:'soutient une augmentation de l’accueil des personnes fuyant la guerre ou la persécution même si l’effort public et budgétaire doit augmenter',n:'cherche à réduire les admissions de réfugiés ou à externaliser davantage l’asile et refuse l’idée d’un accroissement de l’accueil indépendamment du coût',z:'maintient le droit d’asile et certaines capacités d’accueil sans proposer clairement d’augmenter le nombre de réfugiés accueillis'},
            27:{p:'souhaite alourdir les peines effectivement exécutées et développer les capacités carcérales même si cela conduit à davantage d’incarcérations',n:'refuse un durcissement général de l’emprisonnement et privilégie les peines alternatives, la prévention ou la réinsertion',z:'défend une réponse ferme à certains crimes mais sans objectif général d’allongement des peines ou d’augmentation de l’incarcération'},
            28:{p:'donne un rôle central à la prévention, au traitement des causes de la délinquance et à la réinsertion pour réduire la récidive plutôt qu’à l’alourdissement général des peines',n:'place la certitude et la sévérité de la sanction au premier plan et juge insuffisante une stratégie centrée sur la prévention ou la réinsertion',z:'combine durcissement de certaines sanctions et dispositifs substantiels de prévention et de réinsertion'},
            29:{p:'veut accroître les moyens de contrôle, de surveillance ou d’enquête de la police même lorsque cela augmente l’intrusion dans certaines libertés',n:'refuse l’extension générale des pouvoirs de police lorsqu’elle réduit les garanties individuelles et privilégie le contrôle judiciaire et les libertés publiques',z:'renforce certains pouvoirs policiers tout en posant des limites substantielles destinées à préserver les libertés'},
            30:{p:'défend des clauses miroir, interdictions ou sauvegardes contre des produits agricoles fabriqués selon des normes qui seraient interdites aux producteurs nationaux',n:'privilégie l’ouverture commerciale et l’application des règles communes existantes plutôt qu’une interdiction nationale des importations pour divergence de normes',z:'souhaite rapprocher les normes des importations de celles des producteurs nationaux sans soutenir clairement une interdiction même au prix d’une offre alimentaire plus chère'},
            32:{p:'accepte que les objectifs climatiques demeurent prioritaires même lorsqu’ils imposent des coûts économiques ou pèsent temporairement sur la croissance',n:'subordonne les politiques climatiques à la compétitivité, au pouvoir d’achat ou à la croissance et refuse qu’elles soient prioritaires en cas de coût économique important',z:'maintient des objectifs climatiques ambitieux mais cherche explicitement à éviter qu’ils réduisent la croissance, sans arbitrage clair en cas de conflit'},
            33:{p:'accepte un renchérissement substantiel du carbone ou des combustibles fossiles comme levier de transition, avec éventuellement des compensations',n:'refuse une hausse importante du coût des carburants et énergies fossiles et privilégie technologie, offre énergétique ou baisse des taxes',z:'utilise un prix du carbone mais cherche parallèlement à contenir fortement son effet sur le prix payé par les ménages'},
            34:{p:'accepte le principe d’une TVA sociale ou d’un transfert comparable : moins de cotisations sur les salaires financées par davantage de taxation de la consommation',n:'refuse de financer des baisses de cotisations sociales par une hausse de la TVA en raison de son caractère régressif ou du risque pour le financement social',z:'souhaite alléger les prélèvements sur le travail mais ne tranche pas le financement par une hausse de TVA'},
            35:{p:'privilégie le signal-prix, la taxe carbone, les incitations et l’innovation comme instruments écologiques plutôt qu’une politique dominée par les interdictions',n:'privilégie la planification, les normes et les interdictions ciblées et refuse de faire du marché l’instrument principal de la transition',z:'combine de manière équilibrée fiscalité carbone, normes, investissements et interdictions sans donner une priorité nette au marché'},
            36:{p:'accepte que certains usages ou produits particulièrement polluants soient interdits lorsque les objectifs environnementaux l’exigent malgré la demande des consommateurs',n:'rejette les interdictions de consommation qualifiées de punitives et privilégie le choix, l’innovation ou les alternatives technologiques',z:'accepte certaines interdictions environnementales mais les limite fortement au profit des incitations et des alternatives'},
            37:{p:'attribue aux économies riches une responsabilité financière accrue dans le financement de la transition climatique internationale',n:'refuse que les pays riches supportent une part prépondérante du coût mondial et insiste davantage sur la contribution de tous les grands émetteurs',z:'admet une contribution plus importante des pays riches tout en exigeant une participation substantielle des autres grandes économies'},
            38:{p:'veut renforcer l’intégration européenne en transférant ou mutualisant davantage de compétences dans plusieurs politiques stratégiques',n:'refuse de nouveaux transferts de compétences et veut restituer ou préserver davantage de décisions au niveau national',z:'soutient l’Union européenne mais sans position claire en faveur de nouveaux transferts substantiels de compétences'},
            39:{p:'place la conservation de la capacité nationale de décision au-dessus d’un gain potentiel d’influence obtenu par davantage d’intégration européenne',n:'considère qu’une souveraineté efficace passe souvent par l’action européenne commune et refuse de conserver des compétences nationales lorsque cela affaiblit la capacité d’agir',z:'défend à la fois une souveraineté nationale forte et une coopération européenne approfondie sans hiérarchie claire entre les deux'},
            40:{p:'juge l’euro globalement bénéfique et accepte la perte d’autonomie monétaire nationale comme contrepartie de la stabilité et de l’intégration économique',n:'considère la perte de souveraineté monétaire comme un coût supérieur aux avantages de l’euro ou choisit volontairement de rester hors de la monnaie unique',z:'accepte l’intégration monétaire européenne sans appréciation suffisamment claire du bilan global de l’euro pour l’économie nationale'},
            41:{p:'soutient davantage de normes ou politiques contraignantes communes au niveau de l’Union dans plusieurs domaines',n:'veut limiter le pouvoir normatif européen et redonner davantage de latitude réglementaire aux États membres',z:'accepte certaines règles communes tout en invoquant fortement la subsidiarité, sans volonté générale d’augmenter ou de réduire leur nombre'},
            42:{p:'accepte qu’un gouvernement national écarte certaines règles européennes lorsque celles-ci entrent directement en conflit avec des priorités nationales majeures',n:'rejette la désobéissance unilatérale et considère le respect du droit européen comme une condition du fonctionnement de l’Union',z:'conteste ou cherche à renégocier certaines règles européennes sans défendre clairement leur désapplication unilatérale'},
            43:{p:'veut supprimer l’IFI ou remplacer la taxation spécifique du patrimoine immobilier par une fiscalité ordinaire moins ciblée',n:'défend le maintien, le rétablissement ou le renforcement d’une taxation spécifique des patrimoines immobiliers ou des grandes fortunes',z:'souhaite modifier l’IFI sans trancher entre suppression complète et maintien d’une taxation patrimoniale spécifique'},
            44:{p:'veut accroître la taxation des transmissions importantes au-delà d’un seuil afin de limiter les inégalités patrimoniales',n:'cherche à réduire les droits de succession ou à faciliter davantage les transmissions familiales, y compris pour des patrimoines importants',z:'combine allègements pour la majorité des transmissions et taxation accrue de certains très gros héritages'},
            45:{p:'accepte le principe d’une imposition liée au pays d’origine qui continue de viser le patrimoine mondial de très grandes fortunes après leur expatriation',n:'rejette une fiscalité extraterritoriale sur le patrimoine des contribuables partis à l’étranger et met davantage l’accent sur l’attractivité et le risque de fuite des capitaux',z:'se prononce sur la taxation des grandes fortunes mais sans position claire sur le mécanisme extraterritorial après expatriation'},
            46:{p:'impose des obligations réelles de recherche et d’acceptation d’emplois aux chômeurs et prévoit des baisses ou suspensions d’allocation en cas de refus répétés',n:'protège largement le maintien de l’indemnisation et refuse des sanctions importantes pour plusieurs refus d’offres jugées raisonnables',z:'prévoit des obligations et sanctions mais sans permettre clairement une perte significative d’allocation dans les conditions décrites'},
            47:{p:'accepte une intervention budgétaire durable sur les prix ou le transport des biens essentiels afin de réduire structurellement la vie chère dans les territoires ultramarins',n:'privilégie la concurrence, la logistique ou des aides temporaires et refuse une subvention nationale durable destinée à aligner les prix',z:'soutient des mesures de lutte contre la vie chère sans trancher le recours durable à une subvention nationale des prix ou du transport'},
            48:{p:'juge la protection du contrat permanent suffisamment rigide pour freiner certaines embauches ou adaptations et soutient un assouplissement de la rupture ou du droit du travail',n:'considère la protection du contrat permanent comme nécessaire et refuse de la réduire au motif qu’elle pénaliserait les personnes hors de l’emploi stable',z:'cherche à flexibiliser certains aspects du marché du travail sans affirmer que la protection du contrat permanent est globalement excessive'},
            49:{p:'soutient l’introduction ou le développement d’une composante de retraite capitalisée en complément du système par répartition',n:'veut préserver un système essentiellement fondé sur la répartition et rejette une évolution structurelle vers la capitalisation',z:'maintient la répartition comme socle tout en acceptant des dispositifs d’épargne ou de capitalisation complémentaires sans réforme structurelle claire'},
            50:{p:'lie explicitement l’évolution de l’âge de la retraite à l’allongement de l’espérance de vie ou à un mécanisme démographique comparable',n:'refuse d’automatiser le relèvement de l’âge de la retraite en fonction de l’espérance de vie et privilégie une décision politique ou un âge plus bas',z:'prend en compte la démographie dans l’âge de départ sans mécanisme d’indexation automatique suffisamment clair'},
            51:{p:'lie fortement certaines prestations à la durée d’activité, de cotisation ou à des obligations de participation au marché du travail',n:'défend des prestations largement universelles ou fondées sur le besoin et refuse de les conditionner fortement à une carrière contributive',z:'combine prestations universelles et droits contributifs ou obligations d’activité sans conditionnalité forte de l’ensemble de la protection sociale'},
            53:{p:'accepte que l’aide publique exceptionnelle aux entreprises soit assortie de conditions sur dividendes, rachats d’actions ou rémunérations dirigeantes',n:'refuse de lier les aides publiques à des restrictions importantes sur les dividendes ou rémunérations et privilégie des conditions limitées ou contractuelles',z:'accepte certaines contreparties aux aides publiques sans règle claire comparable au blocage prévu par l’énoncé'},
            54:{p:'utilise ou veut développer l’actionnariat public pour orienter des entreprises stratégiques vers des objectifs industriels, énergétiques ou de souveraineté de long terme',n:'préfère une politique industrielle par réglementation, commandes ou incitations sans utiliser davantage le pouvoir de l’État actionnaire',z:'admet l’actionnariat public dans quelques entreprises stratégiques sans volonté claire d’étendre son utilisation comme instrument industriel'},
            55:{p:'veut réduire fortement les contraintes administratives imposées aux entreprises et accepte que certaines règles sociales ou environnementales soient simplifiées ou allégées',n:'accepte la simplification administrative mais refuse qu’elle réduise les protections sociales ou environnementales substantielles',z:'soutient une simplification importante mais pose des lignes rouges sur les principales protections, rendant l’arbitrage de la question incertain'},
            56:{p:'accepte une voie de régularisation fondée sur l’insertion professionnelle durable, l’ancienneté de présence et l’absence de condamnation grave',n:'refuse que le travail et l’ancienneté suffisent à ouvrir une voie de régularisation après une entrée ou un séjour irrégulier',z:'admet des régularisations au cas par cas sans droit ou critère général suffisamment proche de la situation décrite'},
            57:{p:'restreint substantiellement l’accès de certains nouveaux arrivants aux prestations pendant plusieurs années par des conditions de résidence, de travail ou de cotisation',n:'refuse de différer fortement les droits sociaux des immigrés légalement installés et privilégie l’égalité d’accès ou des délais très limités',z:'prévoit certaines conditions initiales d’accès aux prestations sans restriction assez large ou durable pour correspondre pleinement à l’énoncé'},
