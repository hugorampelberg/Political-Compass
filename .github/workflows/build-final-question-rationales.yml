          dk.responses[qi]=1;dk.justifications[qi]='Accord modéré : le gouvernement Frederiksen III renforce les incitations au travail et accepte des allègements fiscaux favorables à l’activité et à certains hauts revenus, mais il maintient un État-providence très redistributif et des prestations universelles. Il admet donc davantage les écarts liés au travail et à l’initiative sans considérer les inégalités comme largement acceptables en elles-mêmes ; +1.';dk.sources[qi]='https://stm.dk/statsministeriet/publikationer/det-politiske-grundlag-for-firkloeverregeringen/';dk.confidence[qi]=2;
          ch.responses[qi]=2;ch.justifications[qi]='Accord net : le cadre économique fédéral suisse repose sur la liberté économique, la concurrence, la responsabilité individuelle et la prise de risque entrepreneuriale. Il accepte donc clairement des différences de revenu liées au travail et à l’initiative, tout en les corrigeant par la protection sociale et la fiscalité ; +2 plutôt que +3.';ch.sources[qi]='https://www.seco.admin.ch/fr/etat-et-concurrence';ch.confidence[qi]=2;
          function recalc(e){const scores={};for(const a of qd.axes){let num=0,mass=0;for(let i=0;i<qs.length;i++){const c=Number(qs[i].coefficients?.[a.key]||0);num+=Number(e.responses[i])*c;mass+=Math.abs(c);}scores[a.key]=mass?10*num/(3*mass):0;}e.axisScores=scores;e.averageConfidence=e.confidence.reduce((a,b)=>a+b,0)/e.confidence.length;}
