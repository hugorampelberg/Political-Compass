          function explain(e,q,score){const r=R[q.id];if(!r)throw new Error('No rationale Q'+q.id);const n=e.shortName||e.name;if(score===0)return `Position intermédiaire : ${n} ${r.z}. La note 0 traduit cette combinaison plutôt qu’une absence artificielle de position.`;if(score>0){const tail=score===3?'Cette position reprend directement l’essentiel de l’arbitrage posé, ce qui justifie +3.':score===2?'L’orientation est nette, mais une partie de l’arbitrage ou son intensité reste plus nuancée que dans l’énoncé, d’où +2.':'L’orientation va dans ce sens mais reste partielle, conditionnelle ou moins ambitieuse que l’énoncé, d’où +1.';return `${label(score)} : ${n} ${r.p}. ${tail}`;}const tail=score===-3?'Cette position est presque entièrement opposée à l’arbitrage posé, ce qui justifie -3.':score===-2?'Le désaccord est net, mais tous les termes de l’énoncé ne sont pas nécessairement rejetés avec la même intensité, d’où -2.':'La réserve est réelle mais partielle ou insuffisamment générale pour retenir un désaccord plus fort, d’où -1.';return `${label(score)} : ${n} ${r.n}. ${tail}`;}
