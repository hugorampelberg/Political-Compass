name: Force production redeploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-production-redeploy.yml'

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Touch deployed application source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/app.js')
          text = p.read_text()
          marker = '// deployment-sync: entity-all-notes-detail\n'
          if marker not in text:
              text = marker + text
              p.write_text(text)
          PY
          node --check scripts/app.js
          git diff --check

      - name: Commit source change and remove workflow
        shell: bash
        run: |
          rm .github/workflows/force-production-redeploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app.js .github/workflows/force-production-redeploy.yml
          git diff --cached --check
          git commit -m "Trigger production deploy for note details UI"
          git push origin HEAD:main
