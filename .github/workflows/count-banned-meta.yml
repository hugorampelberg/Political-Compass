name: Count banned meta justifications
on:
  push:
    paths: ['.github/workflows/count-banned-meta.yml']
permissions: { contents: write }
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat >/tmp/c.js <<'NODE'
          const fs=require('fs'),vm=require('vm'); function load(p,n){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(p,'utf8')+`\nthis.x=${n}`,c);return c.x}
          const es=[...load('data/parties.js','PARTIES_DATA'),...load('data/governments.js','GOVERNMENTS_DATA')];
          const ps=[/niveau de confiance documentaire/i,/orientation cohérente avec le document officiel retenu/i,/estimation prudente/i,/sources officielles et prises de position convergentes/i,/preuve primaire directe ou proposition officielle très proche/i,/codage cohérent/i];
          const out={total:0,byEntity:{}}; for(const e of es){const n=e.justifications.filter(j=>ps.some(r=>r.test(j||''))).length;out.byEntity[e.id]=n;out.total+=n;} fs.writeFileSync('audit/banned-meta-summary.json',JSON.stringify(out,null,2)+'\n'); console.log(out);
          NODE
          node /tmp/c.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/banned-meta-summary.json
          git rm .github/workflows/count-banned-meta.yml
          git commit -m 'Count banned meta justifications'
          git push
