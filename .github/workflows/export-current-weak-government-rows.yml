name: Export current weak government rows
on:
  push:
    paths: ['.github/workflows/export-current-weak-government-rows.yml']
permissions: { contents: write }
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat >/tmp/e.js <<'NODE'
          const fs=require('fs'),vm=require('vm');function load(p,n){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(p,'utf8')+`\nthis.x=${n}`,c);return c.x}
          const qs=load('data/questionnaire.js','QUESTIONNAIRE_DATA').questions, gs=load('data/governments.js','GOVERNMENTS_DATA');
          for(const g of gs){console.log('\n###',g.id,g.name);g.justifications.forEach((j,i)=>{j=String(j||'').trim();if(j.length<130||/inférence|codage|niveau de preuve|source retenue|documentation/i.test(j)) console.log(`Q${qs[i].id}\t${g.responses[i]}\tC${g.confidence[i]}\t${g.sources[i]}\t${j}`)});}
          NODE
          node /tmp/e.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/export-current-weak-government-rows.yml
          git commit -m 'Remove one-shot government inventory'
          git push
