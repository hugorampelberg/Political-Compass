name: Compare root sources to baseline
on:
  push:
    paths: ['.github/workflows/compare-root-sources-to-baseline.yml']
permissions: { contents: write }
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          git show 0005b2fd72947fcd8bb08b2ba0b568c6e01f672b:data/parties.js >/tmp/old-parties.js
          git show 0005b2fd72947fcd8bb08b2ba0b568c6e01f672b:data/governments.js >/tmp/old-governments.js
          cat >/tmp/q.js <<'NODE'
          const fs=require('fs'),vm=require('vm');function load(p,n){const c={};vm.createContext(c);vm.runInContext(fs.readFileSync(p,'utf8')+`\nthis.x=${n}`,c);return c.x}
          const qs=load('data/questionnaire.js','QUESTIONNAIRE_DATA').questions,cur=[...load('data/parties.js','PARTIES_DATA'),...load('data/governments.js','GOVERNMENTS_DATA')],old=[...load('/tmp/old-parties.js','PARTIES_DATA'),...load('/tmp/old-governments.js','GOVERNMENTS_DATA')];
          const om=new Map(old.map(e=>[e.id,e]));for(const e of cur){const oe=om.get(e.id);if(!oe)continue;e.sources.forEach((s,i)=>{let root=false;try{const u=new URL(s);root=u.pathname==='/'||u.pathname===''}catch{};if(root&&oe.sources[i]!==s)console.log(`${e.id}\tQ${qs[i].id}\tNOW=${s}\tOLD=${oe.sources[i]}`);});}
          NODE
          node /tmp/q.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/compare-root-sources-to-baseline.yml
          git commit -m 'Remove one-shot source recovery audit'
          git push
