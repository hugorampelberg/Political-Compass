name: Generate final political coding audit dataset

on:
  push:
    branches:
      - audit/final-full-verification-2026-08-10
    paths:
      - '.github/workflows/generate-final-audit-dataset.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-full-verification-2026-08-10
          fetch-depth: 0

      - name: Generate audit datasets
        shell: bash
        run: |
          mkdir -p audit
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          function loadConst(path, variableName) {
            const source = fs.readFileSync(path, 'utf8');
            const context = {};
            vm.runInNewContext(`${source}\nthis.__value = ${variableName};`, context, { filename: path });
            return context.__value;
          }

          const questionnaire = loadConst('data/questionnaire.js', 'QUESTIONNAIRE_DATA');
          const parties = loadConst('data/parties.js', 'PARTIES_DATA');
          const governments = loadConst('data/governments.js', 'GOVERNMENTS_DATA');
          const entities = [
            ...parties.map(x => ({...x, entityType: 'party'})),
            ...governments.map(x => ({...x, entityType: 'government'})),
          ];

          const clean = value => String(value ?? '').replace(/\t/g, ' ').replace(/\r?\n/g, ' ').trim();
          const full = ['entityType\tentity\tqid\ttheme\tquestion\tresponse\tconfidence\tjustification\tsource'];
          const flags = ['severity\treason\tentityType\tentity\tqid\ttheme\tquestion\tresponse\tconfidence\tjustification\tsource'];
          const summary = {
            questionCount: questionnaire.questions.length,
            parties: parties.length,
            governments: governments.length,
            entities: entities.length,
            codings: questionnaire.questions.length * entities.length,
            counts: {},
            entitiesSummary: {},
            questionsSummary: {},
          };

          const genericPatterns = [
            /orientation cohérente/i,
            /sources officielles et prises de position convergentes/i,
            /estimation prudente/i,
            /codage cohérent/i,
            /transposition ou inférence prudente/i,
            /comparabilité limitée/i,
            /niveau de preuve/i,
            /document officiel retenu/i,
          ];
          const isGeneric = text => genericPatterns.some(re => re.test(text || ''));
          const direction = text => {
            const t = String(text || '').toLowerCase();
            if (/^désaccord|^reserve|^réserve/.test(t)) return -1;
            if (/^accord/.test(t)) return 1;
            if (/^position (équilibrée|neutre|non tranchée|de compromis)/.test(t)) return 0;
            return null;
          };
          const addFlag = (sev, reason, e, q, i) => {
            flags.push([
              sev, reason, e.entityType, e.shortName, q.id, q.theme, q.text,
              e.responses[i], e.confidence[i], e.justifications[i], e.sources[i]
            ].map(clean).join('\t'));
            summary.counts[reason] = (summary.counts[reason] || 0) + 1;
          };

          for (const e of entities) {
            const es = summary.entitiesSummary[e.shortName] = {
              type: e.entityType, generic: 0, lowConfidence: 0, signMismatch: 0,
              missingSource: 0, extremeGeneric: 0, neutralGeneric: 0, flags: 0,
            };
            questionnaire.questions.forEach((q, i) => {
              const response = e.responses[i];
              const conf = e.confidence[i];
              const just = e.justifications[i] || '';
              const source = e.sources[i] || '';
              full.push([
                e.entityType, e.shortName, q.id, q.theme, q.text, response, conf, just, source
              ].map(clean).join('\t'));

              const qs = summary.questionsSummary[q.id] ||= {theme:q.theme, flags:0, generic:0, lowConfidence:0, signMismatch:0, missingSource:0, extremeGeneric:0, neutralGeneric:0};
              const before = flags.length;
              const generic = isGeneric(just);
              if (generic) { es.generic++; qs.generic++; }
              if (conf <= 1) { addFlag('medium','low_confidence',e,q,i); es.lowConfidence++; qs.lowConfidence++; }
              if (!source || !/^https?:\/\//i.test(source)) { addFlag('high','missing_or_invalid_source',e,q,i); es.missingSource++; qs.missingSource++; }
              const d = direction(just);
              if (d !== null && response !== 0 && Math.sign(response) !== d) { addFlag('high','justification_sign_mismatch',e,q,i); es.signMismatch++; qs.signMismatch++; }
              if (Math.abs(response) === 3 && generic) { addFlag('high','extreme_score_generic_justification',e,q,i); es.extremeGeneric++; qs.extremeGeneric++; }
              if (response === 0 && generic) { addFlag('medium','neutral_score_generic_justification',e,q,i); es.neutralGeneric++; qs.neutralGeneric++; }
              if (Math.abs(response) >= 2 && conf <= 1) addFlag('high','strong_score_low_confidence',e,q,i);
              const added = flags.length - before;
              es.flags += added;
              qs.flags += added;
            });
          }

          fs.writeFileSync('audit/full-codings.tsv', full.join('\n') + '\n');
          fs.writeFileSync('audit/flags.tsv', flags.join('\n') + '\n');
          fs.writeFileSync('audit/summary.json', JSON.stringify(summary, null, 2) + '\n');

          const qRows = ['qid\ttheme\tquestion\tcoefficients'];
          for (const q of questionnaire.questions) qRows.push([q.id,q.theme,q.text,JSON.stringify(q.coefficients)].map(clean).join('\t'));
          fs.writeFileSync('audit/questions.tsv', qRows.join('\n') + '\n');
          console.log(JSON.stringify({codings: summary.codings, flags: flags.length - 1, reasons: summary.counts}, null, 2));
          NODE

      - name: Commit audit datasets and remove workflow
        shell: bash
        run: |
          rm .github/workflows/generate-final-audit-dataset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit .github/workflows/generate-final-audit-dataset.yml
          git diff --cached --check
          git commit -m "Generate final political coding audit dataset"
          git push origin HEAD:audit/final-full-verification-2026-08-10
