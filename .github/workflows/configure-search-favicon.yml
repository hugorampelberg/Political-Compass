name: Configure search favicon

on:
  push:
    paths:
      - '.github/scripts/configure-search-favicon.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate favicon assets and update SEO config
        run: python .github/scripts/configure-search-favicon.py
      - name: Validate generated image sizes
        run: |
          python - <<'PY'
          from PIL import Image
          for path, expected in [('favicon.png', None), ('apple-touch-icon.png', (180, 180))]:
              with Image.open(path) as im:
                  if im.width != im.height:
                      raise SystemExit(f'{path} is not square: {im.size}')
                  if expected and im.size != expected:
                      raise SystemExit(f'{path} has size {im.size}, expected {expected}')
                  if not expected and im.width <= 48:
                      raise SystemExit(f'{path} is too small: {im.size}')
                  print(path, im.size)
          PY
      - name: Validate vercel.json
        run: python -m json.tool vercel.json >/dev/null
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vercel.json favicon.png apple-touch-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Configure favicon for Google Search"
          git push origin main
