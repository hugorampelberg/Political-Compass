name: Apply Denmark audit updates

on:
  push:
    paths:
      - '.github/scripts/apply-denmark-audit-updates.js'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Denmark updates
        run: node .github/scripts/apply-denmark-audit-updates.js
      - name: Validate JavaScript syntax
        run: node --check data/governments.js
      - name: Validate targeted Denmark responses and axis scores
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const c={}; vm.createContext(c);
          for (const p of ['data/questionnaire.js','data/governments.js']) {
            vm.runInContext(fs.readFileSync(p,'utf8').replace(/^const /gm,'var '), c, {filename:p});
          }
          const qi=new Map(c.QUESTIONNAIRE_DATA.questions.map((q,i)=>[q.id,i]));
          const d=c.GOVERNMENTS_DATA.find(g=>g.id==='danemark');
          const expected={44:1,50:1,92:3,55:0,27:2,5:-2,26:-2,33:1,35:0,75:-2,76:-2,83:2,90:-3};
          for (const [qid,v] of Object.entries(expected)) {
            const got=d.responses[qi.get(Number(qid))];
            if (got!==v) throw new Error(`Danemark Q${qid}: ${got} != ${v}`);
          }
          for (const axis of c.QUESTIONNAIRE_DATA.axes.map(a=>a.key)) {
            let num=0,mass=0;
            c.QUESTIONNAIRE_DATA.questions.forEach((q,i)=>{const x=q.coefficients[axis]||0;num+=d.responses[i]*x;mass+=Math.abs(x);});
            const score=mass?10*num/(3*mass):0;
            if (Math.abs(d.axisScores[axis]-score)>1e-10) throw new Error(`Danemark ${axis} stale`);
          }
          console.log('Validation passed');
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/governments.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply approved Denmark scoring corrections"
          git push origin main
