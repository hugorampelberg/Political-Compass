name: Apply approved economy score updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-economy-scores-2026-08-09.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved economy scores
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const context = {};
          vm.createContext(context);
          for (const path of ['data/questionnaire.js', 'data/parties.js']) {
            const source = fs.readFileSync(path, 'utf8');
            vm.runInContext(source.replace(/^const /gm, 'var '), context, { filename: path });
          }

          const questionnaire = context.QUESTIONNAIRE_DATA;
          const parties = context.PARTIES_DATA;
          const questionIndex = new Map(questionnaire.questions.map((q, i) => [q.id, i]));
          const original = JSON.parse(JSON.stringify(parties));

          const changes = [
            { shortName: 'PS', q: 7, from: 1, to: 3,
              justification: "Accord fort : le projet socialiste prévoit des prises de contrôle publiques et des nationalisations dans des secteurs stratégiques ; la proposition correspond directement au principe de la question." },
            { shortName: 'PS', q: 82, from: 1, to: 3,
              justification: "Accord fort : le projet de « Grande Sécu » prévoit le remboursement intégral des soins essentiels par la Sécurité sociale et une forte réduction du rôle des complémentaires sur ce panier." },
            { shortName: 'PS', q: 85, from: 2, to: 3,
              justification: "Accord fort : le projet socialiste conditionne explicitement le financement des établissements privés sous contrat à des objectifs mesurables de mixité sociale." },
            { shortName: 'Les Écologistes', q: 90, from: 2, to: 1,
              justification: "Accord modéré : Les Écologistes veulent développer les EHPAD publics et non lucratifs, mais ne proposent pas clairement d'interdire tous les EHPAD privés lucratifs existants ni de les convertir." },
            { shortName: 'MoDem', q: 34, from: 3, to: 1,
              justification: "Accord modéré : François Bayrou souhaite alléger le financement de la protection sociale pesant sur le travail et n'écarte pas un transfert vers la TVA, mais il n'en fait pas une mesure ferme ; +1 reflète cette orientation prudente." },
            { shortName: 'Horizons', q: 49, from: 1, to: 2,
              justification: "Accord net : Horizons propose d'introduire un pilier de capitalisation en complément de la répartition ; le pilier visé restant minoritaire et progressif, +2 traduit mieux l'intensité que +3." },
            { shortName: 'LFH', q: 34, from: 1, to: 2,
              justification: "Accord net : Dominique de Villepin propose de réduire les charges patronales et de transférer progressivement une partie du financement vers la consommation et les bénéfices ; c'est proche d'une TVA sociale sans être strictement identique, d'où +2." }
          ];

          const changedKeys = new Set();
          for (const change of changes) {
            const party = parties.find(p => p.shortName === change.shortName);
            if (!party) throw new Error(`Parti introuvable: ${change.shortName}`);
            const index = questionIndex.get(change.q);
            if (index === undefined) throw new Error(`Question introuvable: Q${change.q}`);
            if (party.responses[index] !== change.from) {
              throw new Error(`${change.shortName} Q${change.q}: attendu ${change.from}, trouvé ${party.responses[index]}`);
            }
            party.responses[index] = change.to;
            party.justifications[index] = change.justification;
            changedKeys.add(`${party.id}:${index}`);
          }

          // Vérifie qu'aucune autre réponse, confiance ou source n'a changé.
          for (let p = 0; p < parties.length; p++) {
            const now = parties[p];
            const before = original[p];
            if (now.id !== before.id) throw new Error('Ordre des partis modifié');
            for (let i = 0; i < now.responses.length; i++) {
              const key = `${now.id}:${i}`;
              if (!changedKeys.has(key) && now.responses[i] !== before.responses[i]) {
                throw new Error(`Réponse non autorisée modifiée: ${now.id} index ${i}`);
              }
              if (now.confidence[i] !== before.confidence[i]) {
                throw new Error(`Confiance modifiée: ${now.id} index ${i}`);
              }
              if (now.sources[i] !== before.sources[i]) {
                throw new Error(`Source modifiée: ${now.id} index ${i}`);
              }
              if (!changedKeys.has(key) && now.justifications[i] !== before.justifications[i]) {
                throw new Error(`Justification non autorisée modifiée: ${now.id} index ${i}`);
              }
            }
          }

          // Recalcule exactement tous les scores d'axe à partir des réponses finales.
          const axes = questionnaire.axes.map(axis => axis.key);
          for (const party of parties) {
            for (const axis of axes) {
              let numerator = 0;
              let mass = 0;
              questionnaire.questions.forEach((question, index) => {
                const coefficient = question.coefficients[axis] || 0;
                numerator += party.responses[index] * coefficient;
                mass += Math.abs(coefficient);
              });
              party.axisScores[axis] = mass ? 10 * numerator / (3 * mass) : 0;
            }
            party.averageConfidence = party.confidence.reduce((sum, value) => sum + value, 0)
              / (questionnaire.questions.length * 3);
          }

          // Contrôle structurel et contrôle des sept valeurs demandées.
          for (const party of parties) {
            for (const field of ['responses', 'confidence', 'justifications', 'sources']) {
              if (party[field].length !== questionnaire.questions.length) {
                throw new Error(`${party.id}.${field}: longueur incohérente`);
              }
            }
            for (const axis of axes) {
              let numerator = 0;
              let mass = 0;
              questionnaire.questions.forEach((question, index) => {
                const coefficient = question.coefficients[axis] || 0;
                numerator += party.responses[index] * coefficient;
                mass += Math.abs(coefficient);
              });
              const expected = mass ? 10 * numerator / (3 * mass) : 0;
              if (Math.abs(party.axisScores[axis] - expected) > 1e-12) {
                throw new Error(`${party.id}.${axis}: score d'axe incohérent`);
              }
            }
          }

          for (const change of changes) {
            const party = parties.find(p => p.shortName === change.shortName);
            const index = questionIndex.get(change.q);
            if (party.responses[index] !== change.to) {
              throw new Error(`Validation finale échouée: ${change.shortName} Q${change.q}`);
            }
          }

          const output = `// Profils documentés des partis politiques français.\nconst PARTIES_DATA = ${JSON.stringify(parties, null, 2)};\n`;
          fs.writeFileSync('data/parties.js', output, 'utf8');
          console.log('Validation ciblée OK : 7 réponses modifiées, autres réponses/confiances/sources inchangées, scores d’axe recalculés.');
          NODE

          if git diff --quiet -- data/parties.js; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parties.js
          git commit -m "Update approved economy party scores"
          git push origin HEAD:main
