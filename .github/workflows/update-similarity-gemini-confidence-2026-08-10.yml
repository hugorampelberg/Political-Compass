name: Update similarity calculation and Gemini comparison data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoring, confidence and Gemini payload changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(text, oldValue, newValue, label) {
            const count = text.split(oldValue).length - 1;
            if (count !== 1) throw new Error(`${label}: expected 1 exact match, found ${count}`);
            return text.replace(oldValue, newValue);
          }

          let app = fs.readFileSync('scripts/app.js', 'utf8');

          app = replaceOnce(
            app,
            "const STRUCTURAL_WEIGHT_SHARE = 0.3;",
            "const STRUCTURAL_WEIGHT_SHARE = 0.3;\nconst QUESTION_SIMILARITY_SHARE = 0.8;\nconst AXIS_COORDINATE_SIMILARITY_SHARE = 0.2;",
            'similarity constants'
          );

          const oldEntityResult = `function entityResult(entity, userScores, weights){
  const axisScores=entityAxisScores(entity);
  const detailed={}; DATA.axes.forEach(a=>detailed[a.key]=detailedAxisSimilarity(entity,a.key));
  const weightSum=Object.values(weights).reduce((a,b)=>a+b,0);
  const global=DATA.axes.reduce((sum,a)=>sum+detailed[a.key]*weights[a.key],0)/weightSum;
  const netByAxis={}; DATA.axes.forEach(a=>netByAxis[a.key]=clamp(100*(1-Math.abs(userScores[a.key]-axisScores[a.key])/20),0,100));
  const net=DATA.axes.reduce((sum,a)=>sum+netByAxis[a.key]*weights[a.key],0)/weightSum;
  const dx=userScores.economy-axisScores.economy, dy=userScores.authority-axisScores.authority;
  const compass=clamp(100*(1-Math.sqrt(dx*dx+dy*dy)/(20*Math.sqrt(2))),0,100);
  return {...entity,axisScores,detailed,global,netByAxis,net,compass};
}`;

          const newEntityResult = `function entityResult(entity, userScores, weights){
  const axisScores=entityAxisScores(entity);
  const detailed={}; DATA.axes.forEach(a=>detailed[a.key]=detailedAxisSimilarity(entity,a.key));
  const weightSum=Object.values(weights).reduce((a,b)=>a+b,0);
  const questionSimilarity=DATA.axes.reduce((sum,a)=>sum+detailed[a.key]*weights[a.key],0)/weightSum;
  const netByAxis={}; DATA.axes.forEach(a=>netByAxis[a.key]=clamp(100*(1-Math.abs(userScores[a.key]-axisScores[a.key])/20),0,100));
  const axisCoordinateSimilarity=DATA.axes.reduce((sum,a)=>sum+netByAxis[a.key]*weights[a.key],0)/weightSum;
  const global=QUESTION_SIMILARITY_SHARE*questionSimilarity+AXIS_COORDINATE_SIMILARITY_SHARE*axisCoordinateSimilarity;
  const dx=userScores.economy-axisScores.economy, dy=userScores.authority-axisScores.authority;
  const compass=clamp(100*(1-Math.sqrt(dx*dx+dy*dy)/(20*Math.sqrt(2))),0,100);
  return {...entity,axisScores,detailed,questionSimilarity,axisCoordinateSimilarity,global,netByAxis,net:axisCoordinateSimilarity,compass};
}`;
          app = replaceOnce(app, oldEntityResult, newEntityResult, 'entityResult');

          app = replaceOnce(
            app,
            "function formatAnswer(v){ return `${v>0?'+':''}${v}`; }",
            "function formatAnswer(v){ return `${v>0?'+':''}${v}`; }\nfunction documentaryConfidencePercent(entity){\n  const raw=Number(entity?.averageConfidence);\n  if(!Number.isFinite(raw)) return 0;\n  const normalized=raw>1 ? raw/3 : raw;\n  return Math.round(clamp(normalized,0,1)*100);\n}",
            'confidence helper'
          );

          app = replaceOnce(
            app,
            "$('#modal-subtitle').textContent=`Similitude globale : ${fmt(e.global)} % · Confiance documentaire moyenne : ${Math.round(e.averageConfidence*100)} %`;",
            "$('#modal-subtitle').textContent=`Similitude globale : ${fmt(e.global)} % · Confiance documentaire moyenne : ${documentaryConfidencePercent(e)} %`;",
            'confidence display'
          );

          const oldPayloadRanking = `  const partyRanking = results.parties.map((e,i)=>({
    rank:i+1, name:e.name, score:Number(e.global.toFixed(1)),
    axis_scores:Object.fromEntries(DATA.axes.map(a=>[PRIORITY_LABELS[a.key],Number(e.detailed[a.key].toFixed(1))]))
  }));
  const governmentRanking = results.governments.map((e,i)=>({
    rank:i+1, name:e.name, score:Number(e.global.toFixed(1)),
    axis_scores:Object.fromEntries(DATA.axes.map(a=>[PRIORITY_LABELS[a.key],Number(e.detailed[a.key].toFixed(1))]))
  }));
  const topPartyDrivers = results.parties.slice(0,3).map(e=>{
    const {agree,disagree}=driversFor(e);
    const convert=x=>({
      question:x.q.text,
      user_answer:answerForAI(state.answers[x.i]),
      user_comment:String(state.questionComments[x.i] || '').trim(),
      party_answer:answerForAI(e.responses[x.i])
    });
    return {name:e.name,score:Number(e.global.toFixed(1)),agreements:agree.map(convert),disagreements:disagree.map(convert)};
  });`;

          const newPayloadRanking = `  const axisPositionsFor=e=>Object.fromEntries(DATA.axes.map(a=>[PRIORITY_LABELS[a.key],Number(e.axisScores[a.key].toFixed(2))]));
  const axisSimilarityFor=e=>Object.fromEntries(DATA.axes.map(a=>[PRIORITY_LABELS[a.key],Number(e.detailed[a.key].toFixed(1))]));
  const rankingEntry=(e,i)=>({
    rank:i+1,
    name:e.name,
    score:Number(e.global.toFixed(1)),
    question_similarity:Number(e.questionSimilarity.toFixed(1)),
    axis_coordinate_similarity:Number(e.axisCoordinateSimilarity.toFixed(1)),
    axis_scores:axisPositionsFor(e),
    axis_similarity:axisSimilarityFor(e)
  });
  const partyRanking = results.parties.map(rankingEntry);
  const governmentRanking = results.governments.map(rankingEntry);
  const buildTopDrivers=(entities, answerField)=>entities.slice(0,3).map(e=>{
    const {agree,disagree}=driversFor(e);
    const convert=x=>({
      question:x.q.text,
      user_answer:answerForAI(state.answers[x.i]),
      user_comment:String(state.questionComments[x.i] || '').trim(),
      [answerField]:answerForAI(e.responses[x.i])
    });
    return {
      name:e.name,
      score:Number(e.global.toFixed(1)),
      question_similarity:Number(e.questionSimilarity.toFixed(1)),
      axis_coordinate_similarity:Number(e.axisCoordinateSimilarity.toFixed(1)),
      axis_scores:axisPositionsFor(e),
      axis_similarity:axisSimilarityFor(e),
      agreements:agree.map(convert),
      disagreements:disagree.map(convert)
    };
  });
  const topPartyDrivers = buildTopDrivers(results.parties,'party_answer');
  const topGovernmentDrivers = buildTopDrivers(results.governments,'government_answer');`;
          app = replaceOnce(app, oldPayloadRanking, newPayloadRanking, 'AI rankings/drivers');

          app = replaceOnce(
            app,
            "    top_party_drivers:topPartyDrivers,\n    open_answers:openAnswers,",
            "    top_party_drivers:topPartyDrivers,\n    top_government_drivers:topGovernmentDrivers,\n    open_answers:openAnswers,",
            'top government drivers payload'
          );

          app = replaceOnce(
            app,
            "      score_meaning:'Distance mathématique calculée, pas pourcentage d’adhésion au programme',",
            "      score_meaning:'Distance mathématique calculée, pas pourcentage d’adhésion au programme',\n      similarity_formula:'Le score global combine 80 % de proximité question par question et 20 % de proximité entre les coordonnées finales des six axes, avec la même pondération des axes.',",
            'methodological similarity formula'
          );

          fs.writeFileSync('scripts/app.js', app);

          let gemini = fs.readFileSync('lib/gemini.js', 'utf8');

          gemini = replaceOnce(
            gemini,
            'const MAX_BODY_BYTES = 260_000;',
            'const MAX_BODY_BYTES = 320_000;',
            'Gemini max body'
          );

          gemini = replaceOnce(
            gemini,
            '  if (!Array.isArray(payload.party_ranking) || payload.party_ranking.length < 1 || payload.party_ranking.length > 20) return false;\n  if (!Array.isArray(payload.government_ranking) || payload.government_ranking.length > 12) return false;\n  return JSON.stringify(payload).length <= 220_000;',
            '  if (!Array.isArray(payload.party_ranking) || payload.party_ranking.length < 1 || payload.party_ranking.length > 20) return false;\n  if (!Array.isArray(payload.government_ranking) || payload.government_ranking.length < 1 || payload.government_ranking.length > 12) return false;\n  if (!Array.isArray(payload.top_party_drivers) || payload.top_party_drivers.length < 1 || payload.top_party_drivers.length > 3) return false;\n  if (!Array.isArray(payload.top_government_drivers) || payload.top_government_drivers.length < 1 || payload.top_government_drivers.length > 3) return false;\n  return JSON.stringify(payload).length <= 280_000;',
            'Gemini payload validation'
          );

          const oldInternationalPrompt = `6. COMPARAISON INTERNATIONALE

N’effectue une comparaison internationale que si des gouvernements, partis étrangers ou profils nationaux ont été explicitement fournis dans les données.

N’invente aucune correspondance avec un pays à partir de ta connaissance générale.

Pour chaque rapprochement, précise les ressemblances, les divergences et les limites.

Ne regroupe pas sous une même étiquette des modèles institutionnels très différents.

Cette partie doit contenir entre 80 et 140 mots.

Si aucune donnée internationale exploitable n’est fournie, indique sobrement que les informations disponibles ne permettent pas une comparaison suffisamment fiable.`;

          const newInternationalPrompt = `6. COMPARAISON INTERNATIONALE

Utilise les données de government_ranking et top_government_drivers lorsqu’elles sont présentes. Elles contiennent, pour les gouvernements comparés, le score global, sa composante question par question, sa composante fondée sur les coordonnées finales, les positions réelles sur les six axes, les similitudes par axe et les principaux accords et désaccords concrets.

Analyse prioritairement les trois gouvernements les mieux classés. Pour chacun des rapprochements retenus, précise au moins une ressemblance importante et une divergence importante. Lorsque le classement global paraît contre-intuitif à cause d’un fort écart sur un axe, explique explicitement comment les autres axes et les réponses détaillées compensent ou non cet écart.

Les champs axis_scores décrivent les positions politiques réelles sur les axes ; les champs axis_similarity décrivent les pourcentages de similitude. Ne confonds jamais les deux.

Le score global combine 80 % de proximité question par question et 20 % de proximité entre les coordonnées finales des axes. Utilise cette décomposition pour expliquer le classement sans présenter le pourcentage comme un taux d’adhésion.

N’invente aucune correspondance avec un pays à partir de ta connaissance générale et n’ajoute aucune position absente des données transmises.

Ne regroupe pas sous une même étiquette des modèles institutionnels très différents.

Cette partie doit contenir entre 100 et 170 mots.

Si top_government_drivers contient au moins un gouvernement, les données internationales sont considérées comme exploitables : ne réponds pas qu’une comparaison fiable est impossible. Si aucune donnée internationale exploitable n’est fournie, indique sobrement cette limite.`;
          gemini = replaceOnce(gemini, oldInternationalPrompt, newInternationalPrompt, 'international comparison prompt');

          gemini = replaceOnce(
            gemini,
            '- chaque parti comporte des convergences et une divergence ;\n- les tensions sont présentées comme des arbitrages ;',
            '- chaque parti comporte des convergences et une divergence ;\n- la comparaison internationale utilise les positions réelles, les similitudes par axe et les drivers des gouvernements lorsqu’ils sont fournis ;\n- chaque gouvernement cité dans la comparaison internationale comporte au moins une convergence et une divergence ;\n- les tensions sont présentées comme des arbitrages ;',
            'Gemini validation checklist'
          );

          fs.writeFileSync('lib/gemini.js', gemini);
          NODE

          node --check scripts/app.js
          node --check lib/gemini.js

          # Vérifications ciblées des changements.
          grep -q "QUESTION_SIMILARITY_SHARE = 0.8" scripts/app.js
          grep -q "AXIS_COORDINATE_SIMILARITY_SHARE = 0.2" scripts/app.js
          grep -q "top_government_drivers:topGovernmentDrivers" scripts/app.js
          grep -q "documentaryConfidencePercent(e)" scripts/app.js
          grep -q "top_government_drivers" lib/gemini.js
          grep -q "80 % de proximité question par question" lib/gemini.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app.js lib/gemini.js
          git diff --cached --check
          git commit -m "Improve similarity scoring and international AI analysis"
          git push
